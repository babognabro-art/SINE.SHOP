<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SINE.SHOP • AI Assistant Proactif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/shared-header.css">
    <style>
        /* =========================================================
           STYLES COMPLETS — AI-SINE.SHOP v3.0
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        :root {
            --bg-primary: #e8f4f8;
            --bg-card: rgba(255,255,255,0.85);
            --text-primary: #0a2a44;
            --text-secondary: #4a6a8a;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(26,36,54,0.92);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition);
        }

        /* =========================================================
           HEADER
           ========================================================= */
        .assistant-header {
            background: linear-gradient(180deg, rgba(126,190,245,0.96) 0%, rgba(62,132,205,0.94) 48%, rgba(18,57,105,0.97) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 6px 35px rgba(7,21,43,0.22);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background var(--transition);
        }
        [data-theme="dark"] .assistant-header {
            background: linear-gradient(180deg, rgba(18,40,70,0.96) 0%, rgba(10,25,50,0.96) 100%);
            border-bottom-color: rgba(255,255,255,0.1);
        }

        .assistant-header .logo-area { display: flex; align-items: center; gap: 1rem; }
        .assistant-header .logo-area img { height: 42px; width: auto; border-radius: 12px; }
        .assistant-header .logo-area h1 { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: #ffffff; 
            text-shadow: 0 2px 10px rgba(0,0,0,.18); 
        }
        .assistant-header .logo-area h1 span { 
            font-size: 0.6rem; 
            background: var(--accent-gradient); 
            padding: 0.1rem 0.6rem; 
            border-radius: 30px; 
            color: white; 
            margin-left: 4px; 
        }
        .assistant-header .logo-area small { font-size: 0.7rem; color: rgba(255,255,255,.82); display: block; }

        .assistant-header .header-actions { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
        .assistant-header .header-actions button {
            padding: 0.4rem 1rem;
            border-radius: 30px;
            color: #1a3a5a;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .assistant-header .header-actions button:hover { 
            background: rgba(255,255,255,0.85); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 15px rgba(59,130,246,0.15); 
        }
        .assistant-header .header-actions .btn-primary { 
            background: var(--accent-gradient); 
            color: white; 
            border: none; 
        }
        .assistant-header .header-actions .btn-primary:hover { 
            transform: translateY(-2px) scale(1.02); 
        }

        /* =========================================================
           USER PROFILE BUTTON
           ========================================================= */
        .user-profile-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.2rem 0.8rem 0.2rem 0.2rem;
            border-radius: 40px;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.6);
            transition: var(--transition);
        }
        .user-profile-btn:hover { background: rgba(255,255,255,0.85); }
        .user-profile-btn img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }
        .user-profile-btn .user-info { line-height: 1.2; }
        .user-profile-btn .user-info .name { font-weight: 700; font-size: 0.82rem; color: #0b2a4a; }
        .user-profile-btn .user-info .status { font-size: 0.6rem; color: #3b82f6; display: flex; align-items: center; gap: 4px; }

        /* =========================================================
           CONTEXT BAR — NOUVEAU
           ========================================================= */
        #contextBar {
            display: flex;
            gap: 1.2rem;
            padding: 0.5rem 1.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-wrap: wrap;
            font-size: 0.8rem;
            backdrop-filter: blur(8px);
            align-items: center;
        }
        #contextBar .context-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        #contextBar .context-item:hover {
            background: rgba(59,130,246,0.08);
            color: var(--text-primary);
        }
        #contextBar .context-item .count {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
        #contextBar .context-item .count.warning { background: #ef4444; }
        #contextBar .context-item .count.success { background: #22c55e; }

        /* =========================================================
           MEMORY INDICATOR
           ========================================================= */
        #memoryIndicator {
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 0.2rem 1rem;
            text-align: center;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        #memoryIndicator i { color: #8b5cf6; }

        /* =========================================================
           LAYOUT
           ========================================================= */
        .assistant-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 160px);
            overflow: hidden;
            gap: 0;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */
        .sidebar-history {
            width: 300px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.3s ease;
        }
        .sidebar-history .sidebar-header {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-history .sidebar-header h3 { 
            font-size: 0.85rem; 
            color: var(--text-secondary); 
            font-weight: 600; 
        }
        .sidebar-history .sidebar-header button { 
            color: var(--accent); 
            font-size: 0.75rem; 
            font-weight: 600; 
        }
        .sidebar-history .sidebar-header button:hover { color: #2563eb; }

        .sidebar-history .search-conv {
            padding: 0.6rem 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .sidebar-history .search-conv input {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
        }
        .sidebar-history .search-conv input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12); 
            background: white; 
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem 0;
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            border-radius: 0 12px 12px 0;
            margin: 0 0.3rem;
        }
        .conv-item:hover { background: rgba(59,130,246,0.06); }
        .conv-item.active { 
            background: rgba(59,130,246,0.1); 
            border-left-color: var(--accent); 
        }
        .conv-item img { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: rgba(255,255,255,0.5); 
        }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-info .conv-name { 
            font-weight: 600; 
            font-size: 0.85rem; 
            color: var(--text-primary); 
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .conv-item .conv-info .conv-name .pin { color: #f59e0b; font-size: 0.6rem; }
        .conv-item .conv-info .conv-preview { 
            font-size: 0.72rem; 
            color: var(--text-secondary); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .conv-item .conv-time { 
            font-size: 0.6rem; 
            color: var(--text-secondary); 
            flex-shrink: 0; 
        }

        .sidebar-actions {
            padding: 0.5rem 1.2rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .sidebar-actions button {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(0,0,0,0.04);
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sidebar-actions button:hover { background: rgba(0,0,0,0.08); }
        .sidebar-actions button.danger { color: #ef4444; }
        .sidebar-actions button.danger:hover { background: rgba(239,68,68,0.08); }

        /* =========================================================
           CHAT PANEL
           ========================================================= */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            min-width: 0;
        }

        .chat-header {
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .chat-header .chat-user { display: flex; align-items: center; gap: 0.8rem; }
        .chat-header .chat-user img { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--accent); 
        }
        .chat-header .chat-user .chat-user-info .name { 
            font-weight: 700; 
            font-size: 0.95rem; 
            color: var(--text-primary); 
        }
        .chat-header .chat-user .chat-user-info .status { 
            font-size: 0.65rem; 
            color: var(--text-secondary); 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }
        .chat-header .chat-actions { display: flex; gap: 0.3rem; }
        .chat-header .chat-actions button {
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.3);
            border: 1px solid transparent;
        }
        .chat-header .chat-actions button:hover { 
            background: rgba(255,255,255,0.6); 
            color: var(--text-primary); 
        }

        /* =========================================================
           MESSAGES
           ========================================================= */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: transparent;
        }

        .msg {
            max-width: 75%;
            padding: 0.7rem 1.2rem;
            border-radius: 18px;
            animation: msgIn 0.3s ease;
            word-break: break-word;
            line-height: 1.5;
            font-size: 0.92rem;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.2);
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0,0,0,0.06);
        }
        [data-theme="dark"] .msg.ai {
            background: rgba(26,36,54,0.9);
            border-color: rgba(255,255,255,0.06);
        }

        .msg .msg-time { 
            font-size: 0.55rem; 
            opacity: 0.5; 
            margin-top: 4px; 
            display: block; 
        }
        .msg .intent-badge {
            font-size: 0.55rem;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            background: rgba(59,130,246,0.12);
            color: var(--accent);
            display: inline-block;
            margin-bottom: 4px;
        }
        .msg .msg-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            opacity: 0.5;
            font-size: 0.65rem;
        }
        .msg .msg-actions button {
            color: var(--text-secondary);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.3);
            transition: var(--transition);
        }
        .msg .msg-actions button:hover { 
            background: rgba(255,255,255,0.7); 
            color: var(--text-primary); 
            opacity: 1;
        }
        .msg .msg-media { margin-top: 0.4rem; border-radius: 12px; overflow: hidden; max-width: 300px; }
        .msg .msg-media img { width: 100%; height: auto; border-radius: 12px; cursor: pointer; }
        .msg .msg-media video { width: 100%; max-height: 300px; border-radius: 12px; }

        .related-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .related-chip {
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            background: white;
            border: 1px solid #dbe4f0;
            color: var(--accent);
            font-weight: 600;
            text-align: left;
            transition: var(--transition);
        }
        .related-chip:hover { 
            background: #eff6ff; 
            border-color: var(--accent); 
            transform: translateY(-1px);
        }

        /* =========================================================
           SUGGESTIONS PROACTIVES — NOUVEAU
           ========================================================= */
        .proactive-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.3rem 1.5rem 0.6rem;
            border-top: 1px solid rgba(0,0,0,0.04);
            background: var(--bg-card);
        }
        .proactive-suggestions .suggestion-chip {
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            background: rgba(59,130,246,0.08);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .proactive-suggestions .suggestion-chip:hover {
            background: rgba(59,130,246,0.15);
            transform: translateY(-1px);
        }
        .proactive-suggestions .suggestion-chip .badge {
            font-size: 0.55rem;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 1px 5px;
            margin-left: 4px;
        }

        /* =========================================================
           COMPOSE
           ========================================================= */
        .chat-input-area {
            padding: 0.6rem 1.5rem 1rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .chat-input-area .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .chat-input-area .input-row .tools {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
        }
        .chat-input-area .input-row .tools button,
        .chat-input-area .input-row .tools label {
            padding: 0.3rem 0.6rem;
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .chat-input-area .input-row .tools button:hover,
        .chat-input-area .input-row .tools label:hover { 
            background: rgba(255,255,255,0.6); 
            color: var(--text-primary); 
        }
        .chat-input-area .input-row .tools input[type="file"] { display: none; }

        .chat-input-area textarea {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 24px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            font-size: 0.92rem;
            resize: none;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
            max-height: 150px;
            line-height: 1.5;
        }
        .chat-input-area textarea:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1); 
            background: white; 
        }
        .chat-input-area textarea::placeholder { color: var(--text-secondary); }

        .chat-input-area .send-btn {
            padding: 0.6rem 1.6rem;
            border-radius: 30px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.2);
        }
        .chat-input-area .send-btn:hover { 
            transform: scale(1.02); 
            box-shadow: 0 4px 25px rgba(59,130,246,0.3); 
        }

        /* =========================================================
           TYPOGRAPHY / UTILITIES
           ========================================================= */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.4rem 0;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 900px) {
            .sidebar-history { width: 240px; }
        }
        @media (max-width: 768px) {
            .assistant-layout { flex-direction: column; height: auto; }
            .sidebar-history { 
                width: 100%; 
                height: 220px; 
                border-right: none; 
                border-bottom: 1px solid rgba(0,0,0,0.06); 
            }
            .chat-panel { height: calc(100vh - 280px); }
            .assistant-header { padding: 0.5rem 1rem; }
            .assistant-header .logo-area h1 { font-size: 1rem; }
            #contextBar { padding: 0.3rem 1rem; gap: 0.6rem; font-size: 0.7rem; }
            .msg { max-width: 90%; }
            .chat-input-area .input-row { flex-wrap: wrap; }
            .chat-input-area .input-row .tools { order: 2; width: 100%; justify-content: center; }
            .chat-input-area textarea { order: 1; width: 100%; }
            .chat-input-area .send-btn { order: 3; width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .assistant-header .header-actions button span { display: none; }
            .sidebar-history { height: 180px; }
            .chat-panel { height: calc(100vh - 240px); }
            .conv-item { padding: 0.5rem 0.8rem; }
            .chat-messages { padding: 0.8rem; }
            .chat-header { padding: 0.4rem 0.8rem; }
            .chat-input-area { padding: 0.4rem 0.8rem 0.8rem; }
            #contextBar { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
            .proactive-suggestions .suggestion-chip { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
        }

        /* =========================================================
           MODALS / OVERLAYS
           ========================================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,40,0.5);
            backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 30px 80px rgba(0,0,0,0.1);
        }
        .modal-content h2 { font-size: 1.3rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem; color: var(--text-primary); }
        .modal-content .form-group { margin-bottom: 1rem; }
        .modal-content .form-group label { display: block; font-weight: 600; font-size: 0.82rem; color: var(--text-secondary); margin-bottom: 3px; }
        .modal-content .form-group input,
        .modal-content .form-group select {
            width: 100%;
            padding: 0.5rem 0.9rem;
            border-radius: 14px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            transition: var(--transition);
        }
        .modal-content .form-group input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(59,130,246,0.08); }
        .modal-actions { display: flex; gap: 0.8rem; margin-top: 1.2rem; justify-content: flex-end; }
        .modal-actions button {
            padding: 0.5rem 1.6rem;
            border-radius: 30px;
            font-weight: 700;
            transition: var(--transition);
        }
        .modal-actions .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-primary); border: 1px solid rgba(0,0,0,0.08); }
        .modal-actions .btn-secondary:hover { background: rgba(0,0,0,0.08); }
        .modal-actions .btn-primary { background: var(--accent-gradient); color: white; }
        .modal-actions .btn-primary:hover { transform: scale(1.02); }

        /* EMOJI PANEL */
        .emoji-panel {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            width: min(400px, calc(100vw - 40px));
            max-height: 340px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(7,21,43,0.2);
            z-index: 300;
            padding: 10px;
        }
        .emoji-panel.active { display: block; }
        .emoji-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
        .emoji-search { flex: 1; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 8px 12px; outline: none; font-size: 0.8rem; }
        .emoji-tabs { display: flex; gap: 4px; overflow: auto; padding-bottom: 6px; }
        .emoji-tabs button { flex: 0 0 auto; padding: 5px 8px; border-radius: 8px; background: rgba(0,0,0,0.04); font-size: 16px; transition: var(--transition); }
        .emoji-tabs button:hover { background: rgba(59,130,246,0.1); }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; overflow: auto; max-height: 250px; }
        .emoji-grid button { font-size: 22px; padding: 5px 0; border-radius: 8px; transition: var(--transition); }
        .emoji-grid button:hover { background: rgba(59,130,246,0.1); }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        .toast-item {
            padding: 0.6rem 1.6rem;
            border-radius: 14px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            animation: toastIn 0.4s ease;
            pointer-events: auto;
            max-width: 90%;
        }
        .toast-item.success { border-left: 4px solid #22c55e; }
        .toast-item.warning { border-left: 4px solid #f59e0b; }
        .toast-item.error { border-left: 4px solid #ef4444; }
        .toast-item.info { border-left: 4px solid var(--accent); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* RECORDING */
        .recording {
            animation: recordPulse 1s infinite;
            color: #ef4444 !important;
            background: #fff1f2 !important;
        }
        @keyframes recordPulse {
            50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(239,68,68,0.12); }
        }
    </style>
</head>

    <script src="../js/config.js"></script>

    <script>
        (function() {
            'use strict';

            // =========================================================
            // CONFIGURATION
            // =========================================================
            let currentUser = null;
            let conversations = [];
            let currentConvId = null;
            let currentLang = 'fr';
            let isTyping = false;
            let contextData = null;
            let memoryData = null;

            // =========================================================
            // AUTH
            // =========================================================
            function checkAuth() {
                const token = localStorage.getItem('sineToken');
                const user = JSON.parse(localStorage.getItem('sineUser') || 'null');
                if (!token || !user) {
                    window.location.href = '../html/login.html';
                    return false;
                }
                return true;
            }

            // =========================================================
            // TOAST
            // =========================================================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast-item ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = '0.4s';
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            // =========================================================
            // CHARGEMENT UTILISATEUR
            // =========================================================
            function loadUser() {
                const userData = JSON.parse(localStorage.getItem('sineUser'));
                if (userData) {
                    currentUser = userData;
                    const nom = userData.firstName || userData.prenom || 'Utilisateur';
                    document.getElementById('headerName').textContent = nom;
                    document.getElementById('chatName').textContent = 'AI-SINE.SHOP';
                    if (userData.profilePicture) {
                        document.getElementById('headerAvatar').src = userData.profilePicture;
                        document.getElementById('modalAvatar').src = userData.profilePicture;
                    }
                }
            }

            // =========================================================
            // CHARGEMENT CONTEXTE
            // =========================================================
            async function loadContext() {
                try {
                    const data = await window.SineAPI.getContext();
                    contextData = data.context || {};
                    const suggestions = data.suggestions || [];
                    
                    // Mise à jour de la barre de contexte
                    document.getElementById('contextOrdersCount').textContent = contextData.orders?.length || 0;
                    document.getElementById('contextCartCount').textContent = contextData.cart?.totalItems || 0;
                    document.getElementById('contextMessagesCount').textContent = contextData.notifications?.length || 0;
                    
                    // Mise à jour des suggestions proactives
                    renderProactiveSuggestions(suggestions);
                    
                    // Mise à jour de l'indicateur de mémoire
                    if (memoryData && memoryData.memories) {
                        document.getElementById('memoryTopics').textContent = memoryData.memories.length + ' sujets appris';
                    }
                    
                    // Temps de session
                    document.getElementById('contextTime').textContent = '⏱️ ' + new Date().toLocaleTimeString();
                    
                } catch (error) {
                    console.error('Erreur chargement contexte:', error);
                }
            }

            // =========================================================
            // RENDER SUGGESTIONS PROACTIVES
            // =========================================================
            function renderProactiveSuggestions(suggestions) {
                const container = document.getElementById('proactiveSuggestions');
                if (!suggestions || suggestions.length === 0) {
                    container.innerHTML = `
                        <span style="font-size:0.7rem;color:var(--text-secondary);">💡 Des suggestions apparaîtront ici</span>
                        <button class="suggestion-chip" onclick="window.sendMessage('Aide')">❓ Aide</button>
                        <button class="suggestion-chip" onclick="window.sendMessage('Voir mes commandes')">📦 Commandes</button>
                    `;
                    return;
                }
                
                container.innerHTML = suggestions.map(s => `
                    <button class="suggestion-chip" onclick="window.sendMessage('${s.label.replace(/'/g, "\\'")}')">
                        ${s.label}
                        ${s.badge ? `<span class="badge">${s.badge}</span>` : ''}
                    </button>
                `).join('');
            }

            // =========================================================
            // CHARGEMENT DE L'HISTORIQUE
            // =========================================================
            async function loadConversations() {
                try {
                    const data = await window.SineAPI.getAiConversations(20);
                    conversations = data.conversations || [];

                    if (conversations.length === 0) {
                        const now = new Date().toISOString();
                        conversations.push({
                            id: 'conv_temp_' + Date.now(),
                            title: 'Bienvenue sur SINE.SHOP AI',
                            messages: [
                                { id: 'msg_welcome', from: 'ai', text: 'Bonjour ! Je suis AI-SINE.SHOP, votre copilote intelligent. Je me souviens de vos préférences et je suis là pour vous aider à chaque étape.', time: now, intent: 'Accueil', suggestions: ['Comment ça fonctionne ?', 'Voir mes commandes', 'Aide'] }
                            ],
                            createdAt: now,
                            updatedAt: now,
                            pinned: false,
                            archived: false,
                            isTemp: true
                        });
                    }
                    currentConvId = conversations[0].id;
                    renderConversationList();
                    renderMessages(currentConvId);
                    loadContext();
                    
                    // Chargement de la mémoire
                    loadMemory();
                    
                } catch (error) {
                    console.error('Erreur chargement historique:', error);
                    showToast('Erreur de chargement de l\'historique', 'error');
                }
            }

            // =========================================================
            // CHARGEMENT MÉMOIRE
            // =========================================================
            async function loadMemory() {
                try {
                    const data = await window.SineAPI.getMemory();
                    memoryData = data;
                    if (data.memories) {
                        document.getElementById('memoryTopics').textContent = data.memories.length + ' sujets appris';
                        document.getElementById('memoryText').textContent = '🧠 Je me souviens de ' + data.memories.length + ' sujets';
                    }
                } catch (error) {
                    console.error('Erreur chargement mémoire:', error);
                }
            }

            // =========================================================
            // RENDER CONVERSATIONS
            // =========================================================
            function renderConversationList() {
                const container = document.getElementById('conversationList');
                const active = conversations.filter(c => !c.archived);
                if (active.length === 0) {
                    container.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-secondary);font-size:0.85rem;">Aucune conversation</div>';
                    return;
                }
                container.innerHTML = active.map(c => `
                    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" data-id="${c.id}">
                        <img src="../images/logo.png" alt="AI" onerror="this.src='../images/logo.png'">
                        <div class="conv-info">
                            <div class="conv-name">
                                ${c.title || 'Discussion'}
                                ${c.pinned ? '<span class="pin"><i class="fa-solid fa-thumbtack"></i></span>' : ''}
                            </div>
                            <div class="conv-preview">${c.messages.length > 0 ? c.messages[c.messages.length-1].text.substring(0, 50) : 'Nouvelle discussion'}</div>
                        </div>
                        <div class="conv-time">${new Date(c.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                `).join('');

                container.querySelectorAll('.conv-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;

            // =========================================================
            // RENDER MESSAGES
            // =========================================================
            function renderMessages(convId) {
                const container = document.getElementById('chatMessages');
                const conv = conversations.find(c => c.id === convId);
                if (!conv) {
                    container.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;">Conversation introuvable</div>';
                    return;
                }

                document.getElementById('chatStatusText').textContent = '🧠 ' + (conv.messages.length || 0) + ' messages • Contexte enrichi';

                if (conv.messages.length === 0) {
                    renderWelcomeScreen(container);
                    return;
                }

                container.innerHTML = conv.messages.map(m => {
                    const isUser = m.from === 'user';
                    const avatar = isUser ? (currentUser?.profilePicture || '../images/profil.png') : '../images/logo.png';
                    const name = isUser ? (currentUser?.firstName || 'Vous') : 'AI-SINE.SHOP';
                    const time = new Date(m.time).toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                    let mediaHtml = '';
                    if (m.media) {
                        if (m.media.type === 'image') {
                            mediaHtml = `<div class="msg-media"><img src="${m.media.url}" alt="Image" loading="lazy" onclick="window.open(this.src)"></div>`;
                        } else if (m.media.type === 'video') {
                            mediaHtml = `<div class="msg-media"><video src="${m.media.url}" controls></video></div>`;
                        } else if (m.media.type === 'audio') {
                            mediaHtml = `<div class="msg-media"><audio src="${m.media.url}" controls></audio></div>`;
                        }
                    }

                    let intentHtml = '';
                    if (m.intent) {
                        intentHtml = `<div class="intent-badge"><i class="fa-regular fa-lightbulb"></i> ${m.intent}</div>`;
                    }

                    let relatedHtml = '';
                    if (!isUser && m.suggestions && m.suggestions.length > 1) {
                        relatedHtml = `<div class="related-chips">
                            ${m.suggestions.slice(0, 4).map(s => `<button class="related-chip" onclick="window.sendMessage('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}
                        </div>`;
                    }

                    return `
                        <div class="msg ${isUser ? 'user' : 'ai'}">
                            ${!isUser ? intentHtml : ''}
                            ${mediaHtml}
                            ${m.text}
                            <span class="msg-time">${time} ${isUser ? '' : '• AI'}</span>
                            ${!isUser ? `
                                <div class="msg-actions">
                                    <button onclick="window.copyMessage('${m.id}')"><i class="fa-regular fa-copy"></i></button>
                                    <button onclick="window.reportMessage('${m.id}')"><i class="fa-regular fa-flag"></i></button>
                                    <button onclick="window.translateMessage('${m.id}')"><i class="fa-regular fa-language"></i></button>
                                </div>
                            ` : ''}
                            ${relatedHtml}
                        </div>
                    `;
                }).join('');

                container.scrollTop = container.scrollHeight;
            }

            // =========================================================
            // ENVOYER UN MESSAGE
            // =========================================================
            window.sendMessage = function(text, media) { return sendMessage(text, media); };
            async function sendMessage(text, media = null) {
                if (!text.trim() && !media) return;

                const conv = conversations.find(c => c.id === currentConvId);
                if (!conv) {
                    showToast('Aucune conversation active', 'error');
                    return;
                }

                // Message utilisateur (optimiste)
                const msgUser = {
                    id: 'msg_' + Date.now() + '_user',
                    from: 'user',
                    text: text.trim(),
                    time: new Date().toISOString(),
                    media: null,
                    intent: null
                };
                conv.messages.push(msgUser);
                conv.updatedAt = new Date().toISOString();
                renderMessages(currentConvId);
                renderConversationList();

                // Typing
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = `<span></span><span></span><span></span> Réflexion...`;
                document.getElementById('chatMessages').appendChild(typingDiv);
                document.getElementById('chatMessages').scrollTop = document.getElementById('chatMessages').scrollHeight;

                try {
                    const realConvId = conv.isTemp ? null : currentConvId;
                    
                    // Récupère le contexte pour l'envoyer au backend
                    const context = await window.SineAPI.getContext();
                    
                    const response = await window.SineAPI.sendChatMessage(text, realConvId, {
                        lastMessages: conv.messages.slice(-10).map(m => ({ from: m.from, text: m.text })),
                        context: context.context || {},
                        media: media ? {
                            type: media.type,
                            url: media.type === 'video' ? undefined : media.url,
                            name: media.name,
                            mimeType: media.mimeType,
                            frames: media.type === 'video' ? (media.frames || []) : undefined
                        } : undefined
                    });

                    if (conv.isTemp && response.conversationId) {
                        conv.id = response.conversationId;
                        conv.isTemp = false;
                        currentConvId = response.conversationId;
                    }

                    typingDiv.remove();

                    // Mise à jour du contexte après la réponse
                    if (response.context) {
                        contextData = response.context;
                    }

                    const msgAI = {
                        id: 'msg_' + Date.now() + '_ai',
                        from: 'ai',
                        text: response.response || 'Je n\'ai pas pu générer une réponse.',
                        time: new Date().toISOString(),
                        intent: response.intent || 'Général',
                        suggestions: response.suggestions || [],
                        media: null
                    };
                    conv.messages.push(msgAI);
                    conv.updatedAt = new Date().toISOString();
                    renderMessages(currentConvId);
                    renderConversationList();
                    
                    // Met à jour les suggestions proactives
                    if (response.suggestions) {
                        renderProactiveSuggestions(response.suggestions.map(s => ({ label: s })));
                    }
                    
                    // Met à jour la mémoire
                    if (response.memory) {
                        document.getElementById('memoryText').textContent = '🧠 ' + response.memory;
                    }

                } catch (error) {
                    typingDiv.remove();
                    console.error('Erreur API:', error);
                    showToast('Erreur: ' + (error.message || 'Problème de connexion'), 'error');
                    const fallback = {
                        id: 'msg_' + Date.now() + '_ai_fallback',
                        from: 'ai',
                        text: 'Désolé, je rencontre un problème technique. Veuillez réessayer plus tard.',
                        time: new Date().toISOString(),
                        intent: 'Erreur',
                        media: null
                    };
                    conv.messages.push(fallback);
                    conv.updatedAt = new Date().toISOString();
                    renderMessages(currentConvId);
                    renderConversationList();
                }
            }

            // =========================================================
            // FILE UPLOAD
            // =========================================================
            async function fileToDataURL(file) {
                return await new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            async function sampleVideoFrames(file, maxFrames = 6) {
                const url = URL.createObjectURL(file);
                const video = document.createElement('video');
                video.muted = true;
                video.playsInline = true;
                video.src = url;
                await new Promise((resolve, reject) => {
                    video.onloadedmetadata = resolve;
                    video.onerror = reject;
                });
                const duration = Number.isFinite(video.duration) ? video.duration : 0;
                const count = Math.max(1, Math.min(maxFrames, Math.ceil(duration / 10) || 1));
                const frames = [];
                const canvas = document.createElement('canvas');
                canvas.width = 768;
                canvas.height = 432;
                for (let i = 0; i < count; i++) {
                    video.currentTime = duration ? (duration * i / Math.max(1, count - 1)) : 0;
                    await new Promise(resolve => { video.onseeked = resolve; });
                    const ratio = Math.min(canvas.width / video.videoWidth, canvas.height / video.videoHeight);
                    const w = Math.max(1, Math.round(video.videoWidth * ratio));
                    const h = Math.max(1, Math.round(video.videoHeight * ratio));
                    canvas.width = w; canvas.height = h;
                    canvas.getContext('2d').drawImage(video, 0, 0, w, h);
                    frames.push(canvas.toDataURL('image/jpeg', 0.68));
                }
                URL.revokeObjectURL(url);
                return frames;
            }

                    this.style.height = 'auto';

                    const files = Array.from(e.target.files || []);
                    this.value = '';
                    for (const file of files.slice(0, 3)) {

                            if (file.size > 8 * 1024 * 1024) {
                                showToast(`${file.name} est trop volumineux (8 Mo max).`, 'warning');
                                continue;
                            }
                            const dataUrl = await fileToDataURL(file);
                            let media;

                                showToast(`🎬 Analyse de ${file.name}...`, 'info');
                                media = {
                                    type: 'video',
                                    url: dataUrl,
                                    name: file.name,
                                    mimeType: file.type,
                                    frames: await sampleVideoFrames(file)
                                };
                            } else if (file.type.startsWith('image/')) {
                                media = { type: 'image', url: dataUrl, name: file.name, mimeType: file.type };
                            } else if (file.type.startsWith('audio/')) {
                                media = { type: 'audio', url: dataUrl, name: file.name, mimeType: file.type };
                            } else {
                                media = { type: 'file', url: dataUrl, name: file.name, mimeType: file.type || 'application/octet-stream' };

                    '🧑': '👶 🧒 👦 👧 🧑 👱 👨 🧔 👨‍🦰 👨‍🦱 👨‍🦳 👩 👩‍🦰 👩‍🦱 👩‍🦳 🧓 👴 👵 🙍 🙎 🙅 🙆 💁 🙋 🧏 🙇 🤦 🤷 👮 🕵️ 💂 👷 🤴 👸 👳 🧕 🤵 👰 🤰 🫃 🫄',
                    '🐶': '🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐒 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🕷️ 🦂 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦀 🐠 🐟 🐡 🐬 🐳 🦈',
                    '🍎': '🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶️ 🫑 🥒 🥬 🥦 🧄 🧅 🍞 🥐 🥖 🥨 🧀 🥚 🍳 🧇 🥞 🧈 🍗 🍔 🍟 🍕 🌭 🌮 🌯 🥗 🍿 🍩 🍪 🎂 🍰 🧁 🍫 🍭 🍬 ☕ 🧃 🥤',
                    '🇨🇮': '🇨🇮 🇫🇷 🇬🇧 🇺🇸 🇨🇦 🇲🇦 🇸🇳 🇳🇬 🇬🇭 🇧🇯 🇹🇬 🇬🇳 🇧🇫 🇲🇱 🇨🇲 🇩🇪 🇪🇸 🇮🇹 🇵🇹 🇨🇳 🇯🇵 🇰🇷 🇦🇪 🇿🇦'
                };
                const emojiPanel = document.getElementById('emojiPanel');
                const emojiGrid = document.getElementById('emojiGrid');
                const emojiTabs = document.getElementById('emojiTabs');
                const emojiSearch = document.getElementById('emojiSearch');
                let currentEmojiSet = Object.keys(emojiSets)[0];

                function drawEmojis(filter = '') {
                    let emojis = Object.values(emojiSets).join(' ').split(/\s+/).filter(Boolean);
                    if (!filter) emojis = emojiSets[currentEmojiSet].split(/\s+/).filter(Boolean);
                    else emojis = emojis.filter(e => e.includes(filter));
                    emojiGrid.innerHTML = emojis.map(e => `<button type="button" data-emoji="${e}">${e}</button>`).join('');
                    emojiGrid.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                        const input = document.getElementById('messageInput');
                        const pos = input.selectionStart ?? input.value.length;
                        input.value = input.value.slice(0,pos) + b.dataset.emoji + input.value.slice(pos);
                        input.focus();
                    }));
                }
                emojiTabs.innerHTML = Object.keys(emojiSets).map(k => `<button type="button" data-set="${k}">${k}</button>`).join('');
                emojiTabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                    currentEmojiSet = b.dataset.set;
                    emojiSearch.value = '';
                    drawEmojis();
                }));
                document.getElementById('btnEmoji').addEventListener('click', () => {
                    emojiPanel.classList.toggle('active');
                    if (emojiPanel.classList.contains('active')) drawEmojis();
                });
                document.getElementById('emojiClose').addEventListener('click', () => emojiPanel.classList.remove('active'));
                emojiSearch.addEventListener('input', () => drawEmojis(emojiSearch.value.trim()));
                document.addEventListener('click', e => {
                    if (!emojiPanel.contains(e.target) && e.target.id !== 'btnEmoji') emojiPanel.classList.remove('active');
                });

                // Boutons
                document.getElementById('btnNewChat').addEventListener('click', newConversation);
                document.getElementById('btnClearHistory').addEventListener('click', clearHistory);
                document.getElementById('btnArchiveAll').addEventListener('click', archiveAll);
                document.getElementById('btnExportChat').addEventListener('click', exportChat);
                document.getElementById('btnDeleteChat').addEventListener('click', deleteCurrentChat);
                document.getElementById('btnArchiveChat').addEventListener('click', archiveCurrentChat);
                document.getElementById('btnPinChat').addEventListener('click', togglePinConversation);
                document.getElementById('btnPinConversation').addEventListener('click', togglePinConversation);

                // Suggestions proactives
                document.getElementById('btnSuggestAction').addEventListener('click', function() {
                    loadContext();
                    showToast('🔄 Suggestions mises à jour', 'info');
                });

                // Context bar clicks
                document.getElementById('contextOrders').addEventListener('click', () => {
                    sendMessage('Voir mes commandes');
                });
                document.getElementById('contextCart').addEventListener('click', () => {
                    sendMessage('Voir mon panier');
                });
                document.getElementById('contextMessages').addEventListener('click', () => {
                    sendMessage('Voir mes messages');
                });
                document.getElementById('contextSupport').addEventListener('click', () => {
                    sendMessage('Contacter le support');
                });
                document.getElementById('contextMemory').addEventListener('click', () => {
                    sendMessage('Que sais-tu de moi ?');
                });

                // Recherche
                document.getElementById('searchHistory').addEventListener('input', function() {
                    const query = this.value.toLowerCase();
                    const items = document.querySelectorAll('.conv-item');
                    items.forEach(item => {
                        const text = item.textContent.toLowerCase();
                        item.style.display = text.includes(query) ? '' : 'none';
                    });
                });

                // Langues
                document.querySelectorAll('.lang-selector button').forEach(btn => {
                    btn.addEventListener('click', function() {
                        const lang = this.dataset.lang;
                        currentLang = lang;
                        localStorage.setItem('aiLang', lang);
                        document.querySelectorAll('.lang-selector button').forEach(b => b.classList.remove('active'));
                        this.classList.add('active');
                        showToast('Langue: ' + lang.toUpperCase(), 'info');
                    });
                });

                // Options Overlay
                const optionsOverlay = document.getElementById('optionsOverlay');
                const closeOptions = () => optionsOverlay.classList.remove('active');
                document.getElementById('btnMoreOptions').addEventListener('click', () => optionsOverlay.classList.add('active'));
                optionsOverlay.addEventListener('click', e => { if (e.target === optionsOverlay) closeOptions(); });
                document.getElementById('optClose').addEventListener('click', closeOptions);
                document.getElementById('optNew').addEventListener('click', async () => { closeOptions(); await newConversation(); });
                document.getElementById('optExport').addEventListener('click', () => { closeOptions(); exportChat(); });
                document.getElementById('optPin').addEventListener('click', async () => { closeOptions(); await togglePinConversation(); });
                document.getElementById('optArchive').addEventListener('click', async () => { closeOptions(); await archiveCurrentChat(); });
                document.getElementById('optDelete').addEventListener('click', async () => { closeOptions(); await deleteCurrentChat(); });
                document.getElementById('optStats').addEventListener('click', () => {
                    const conv = conversations.find(c => c.id === currentConvId);
                    const count = conv?.messages?.length || 0;
                    const userCount = conv?.messages?.filter(m => m.from === 'user').length || 0;
                    const aiCount = conv?.messages?.filter(m => m.from === 'ai').length || 0;
                    closeOptions();
                    showToast(`📊 ${count} messages • ${userCount} de vous • ${aiCount} de l'IA`, 'info');
                });

                // Profil Modal
                const profileModal = document.getElementById('profileModal');
                document.getElementById('btnOpenProfile').addEventListener('click', () => profileModal.classList.add('active'));
                document.getElementById('modalClose').addEventListener('click', () => profileModal.classList.remove('active'));
                profileModal.addEventListener('click', (e) => { if (e.target === profileModal) profileModal.classList.remove('active'); });

                document.getElementById('modalAvatarInput').addEventListener('change', function(e) {
                    const file = e.target.files[0];
                    if (file) {
                        const reader = new FileReader();
                        reader.onload = function(ev) {
                            document.getElementById('modalAvatar').src = ev.target.result;
                            showToast('Avatar mis à jour', 'success');
                        };
                        reader.readAsDataURL(file);
                    }
                });

                document.getElementById('btnResetAvatar').addEventListener('click', function() {
                    document.getElementById('modalAvatar').src = '../images/logo.png';
                    document.getElementById('headerAvatar').src = '../images/logo.png';
                    document.getElementById('modalAvatarInput').value = '';
                    showToast('Avatar réinitialisé', 'info');
                });

                document.getElementById('modalSave').addEventListener('click', function() {
                    const name = document.getElementById('modalDisplayName').value || 'AI-SINE.SHOP';
                    const status = document.getElementById('modalStatus').value;
                    const lang = document.getElementById('modalLanguage').value;
                    const tone = document.getElementById('modalTone').value;

                    document.getElementById('headerName').textContent = currentUser?.firstName || 'Utilisateur';
                    document.getElementById('chatName').textContent = name;
                    document.getElementById('userStatus').textContent = status;
                    document.getElementById('chatStatusText').textContent = status + ' • Prêt à vous aider';

                    const avatarSrc = document.getElementById('modalAvatar').src;
                    document.getElementById('headerAvatar').src = avatarSrc;
                    document.getElementById('chatAvatar').src = avatarSrc;

                    currentLang = lang;
                    document.querySelectorAll('.lang-selector button').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.lang === lang);
                    });

                    localStorage.setItem('aiLang', lang);
                    localStorage.setItem('aiTone', tone);
                    profileModal.classList.remove('active');
                    showToast('Profil mis à jour !', 'success');
                });

                const savedLang = localStorage.getItem('aiLang') || 'fr';
                currentLang = savedLang;
                document.querySelectorAll('.lang-selector button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.lang === savedLang);
                });
                document.getElementById('modalLanguage').value = savedLang;
                document.getElementById('modalTone').value = localStorage.getItem('aiTone') || 'warm';

                // Rafraîchissement contexte toutes les 30 secondes
                setInterval(() => {
                    if (document.hidden) return;
                    loadContext();
                }, 30000);

                console.log('✅ AI-SINE.SHOP v3.0 — Assistant Proactif & Contextuel');
                console.log('👤 Utilisateur:', currentUser?.email);
                console.log('🧠 Mémoire:', memoryData?.memories?.length || 'chargement...');
            });

        })();
    </script>

</body>
</html>
