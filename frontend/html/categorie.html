<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Catégorie • SINE.SHOP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/shared-header.css">
    <style>
        /* =========================================================
           IDENTITÉ VISUELLE PROPRE À CETTE PAGE — "boutique éditoriale"
           Fond crème, accent terracotta, titres serif — volontairement
           différente de collections.html (bleu) et search.html (violet),
           mais avec le header standard du site (shared-header.css).
           ========================================================= */
        :root {
            --cat-bg: #fbf6ef;
            --cat-card: #ffffff;
            --cat-ink: #2b2118;
            --cat-muted: #8a7a68;
            --cat-accent: #c1622d;
            --cat-accent-dark: #a04e21;
            --cat-line: #ece3d6;
            --cat-success: #4d7c4a;
            --cat-danger: #b64a3c;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            background: var(--cat-bg);
            color: var(--cat-ink);
            min-height: 100vh;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; touch-action: manipulation; }
        img { max-width: 100%; height: auto; display: block; }

        /* ===== BANDEAU CATÉGORIE ===== */
        .cat-hero {
            max-width: 1200px;
            margin: 0 auto;
            padding: 48px 24px 24px;
            text-align: center;
        }
        .cat-hero .cat-icon { font-size: 2.6rem; margin-bottom: 8px; }
        .cat-hero h1 {
            font-family: "Fraunces", serif;
            font-size: clamp(2rem, 4.5vw, 3rem);
            font-weight: 600;
            color: var(--cat-ink);
        }
        .cat-hero p { color: var(--cat-muted); margin-top: 10px; max-width: 560px; margin-left: auto; margin-right: auto; }
        .cat-hero .cat-count { display:inline-block; margin-top:14px; padding:6px 16px; border-radius:30px; background:var(--cat-card); border:1px solid var(--cat-line); font-size:0.8rem; color:var(--cat-accent); font-weight:600; }

        /* ===== BARRE UTILITAIRE (favoris / panier / profil) ===== */
        .cat-utility {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 24px 20px;
            display: flex;
            justify-content: flex-end;
            gap: 10px;
        }
        .cat-utility button {
            padding: 8px 16px;
            border-radius: 30px;
            background: var(--cat-card);
            border: 1px solid var(--cat-line);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--cat-ink);
            display: flex;
            align-items: center;
            gap: 6px;
            position: relative;
        }
        .cat-utility button:hover { border-color: var(--cat-accent); color: var(--cat-accent); }
        .cat-utility .badge {
            position: absolute;
            top: -6px;
            right: -6px;
            background: var(--cat-accent);
            color: white;
            font-size: 0.62rem;
            font-weight: 700;
            border-radius: 30px;
            min-width: 16px;
            height: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 0 4px;
        }

        /* ===== FILTRES ===== */
        .cat-filters {
            max-width: 1200px;
            margin: 0 auto 28px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
            gap: 10px;
        }
        .cat-filters select, .cat-filters input {
            padding: 10px 14px;
            border-radius: 14px;
            border: 1px solid var(--cat-line);
            background: var(--cat-card);
            color: var(--cat-ink);
            font-size: 0.85rem;
            outline: none;
        }
        .cat-filters select:focus, .cat-filters input:focus { border-color: var(--cat-accent); }
        .cat-filters label { display: flex; align-items: center; gap: 6px; font-size: 0.85rem; color: var(--cat-muted); background: var(--cat-card); border-radius: 14px; border: 1px solid var(--cat-line); padding: 0 14px; }

        /* ===== GRILLE PRODUITS ===== */
        .cat-grid {
            max-width: 1200px;
            margin: 0 auto 60px;
            padding: 0 24px;
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 22px;
        }
        .cat-card {
            background: var(--cat-card);
            border-radius: 22px;
            border: 1px solid var(--cat-line);
            overflow: hidden;
            transition: 0.3s;
        }
        .cat-card:hover { transform: translateY(-4px); box-shadow: 0 14px 34px rgba(43,33,24,0.08); }
        .cat-card .cat-media { position: relative; aspect-ratio: 1/1; background: #f4ede2; cursor: pointer; overflow: hidden; }
        .cat-card .cat-media-scroll {
            display: flex; width: 100%; height: 100%; overflow-x: auto;
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .cat-card .cat-media-scroll::-webkit-scrollbar { display: none; }
        .cat-card .cat-media-scroll img, .cat-card .cat-media-scroll video {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: cover; scroll-snap-align: start; transition: 0.4s;
        }
        .cat-card .cat-media-count {
            position: absolute; bottom: 10px; right: 10px; background: rgba(43,33,24,0.6); color: white;
            font-size: 0.6rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; pointer-events: none;
        }
        .cat-card .cat-badges { position: absolute; top: 10px; left: 10px; display: flex; flex-direction: column; gap: 4px; pointer-events: none; }
        .cat-card .cat-badges span { padding: 3px 10px; border-radius: 20px; font-size: 0.62rem; font-weight: 700; color: white; text-transform: uppercase; letter-spacing: 0.3px; }
        .badge-promo { background: var(--cat-accent); }
        .badge-stock { background: var(--cat-danger); }
        .cat-card .cat-fav {
            position: absolute; top: 10px; right: 10px; width: 32px; height: 32px; border-radius: 50%;
            background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;
            color: var(--cat-muted); font-size: 0.95rem; transition: 0.2s; z-index: 2;
        }
        .cat-card .cat-fav:hover { transform: scale(1.1); }
        .cat-card .cat-fav.active { color: var(--cat-danger); }
        .cat-card .cat-share {
            position: absolute; top: 10px; left: 10px; width: 30px; height: 30px; border-radius: 50%;
            background: rgba(255,255,255,0.92); display: flex; align-items: center; justify-content: center;
            color: var(--cat-muted); font-size: 0.8rem; transition: 0.2s; z-index: 2;
        }
        .cat-card .cat-share:hover { transform: scale(1.1); color: var(--cat-accent); }
        .cat-card .cat-body { padding: 16px; }
        .cat-card .cat-title { font-family: "Fraunces", serif; font-size: 1.02rem; font-weight: 600; min-height: 2.5em; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; cursor: pointer; }
        .cat-card .cat-title:hover { color: var(--cat-accent); }
        .cat-card .cat-price { display: flex; align-items: baseline; gap: 8px; margin: 8px 0 4px; }
        .cat-card .cat-price .now { font-size: 1.15rem; font-weight: 700; color: var(--cat-accent-dark); }
        .cat-card .cat-price .old { font-size: 0.82rem; color: var(--cat-muted); text-decoration: line-through; }
        .cat-card .cat-stock { font-size: 0.72rem; font-weight: 600; }
        .cat-card .cat-stock.in { color: var(--cat-success); }
        .cat-card .cat-stock.out { color: var(--cat-danger); }
        .cat-card .cat-vendor { display: flex; align-items: center; gap: 6px; margin: 8px 0; padding-top: 8px; border-top: 1px solid var(--cat-line); }
        .cat-card .cat-vendor img { width: 24px; height: 24px; border-radius: 50%; object-fit: cover; cursor: pointer; background: var(--cat-line); }
        .cat-card .cat-vendor span { font-size: 0.74rem; color: var(--cat-muted); cursor: pointer; }
        .cat-card .cat-vendor span:hover { color: var(--cat-accent); }
        .cat-card .cat-actions { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 6px; padding: 0 16px 16px; }
        .cat-card .cat-actions button {
            padding: 8px 6px; border-radius: 12px; font-size: 0.68rem; font-weight: 700;
            display: flex; align-items: center; justify-content: center; gap: 4px; transition: 0.2s;
        }
        .cat-card .cat-actions .btn-add { background: var(--cat-accent); color: white; grid-column: span 2; }
        .cat-card .cat-actions .btn-add:hover { background: var(--cat-accent-dark); }
        .cat-card .cat-actions .btn-ghost { background: #f4ede2; color: var(--cat-ink); }
        .cat-card .cat-actions .btn-ghost:hover { background: #ece0cf; }
        .cat-card .cat-actions .btn-ghost.active { background: var(--cat-accent); color: white; }
        .cat-card .cat-actions.wide { grid-template-columns: 1fr; }

        .cat-empty { grid-column: 1/-1; text-align: center; padding: 60px 20px; color: var(--cat-muted); }
        .cat-empty .icon { font-size: 3rem; display: block; margin-bottom: 12px; }

        /* ===== MODAL PRODUIT (galerie image + vidéo) ===== */
        .cat-modal { display: none; position: fixed; inset: 0; background: rgba(43,33,24,0.55); z-index: 9999; align-items: center; justify-content: center; padding: 20px; }
        .cat-modal.active { display: flex; }
        .cat-modal-content { background: var(--cat-card); border-radius: 24px; max-width: 820px; width: 100%; max-height: 90vh; overflow-y: auto; padding: 26px; }
        .cat-modal-close { float: right; font-size: 1.3rem; color: var(--cat-muted); cursor: pointer; }
        .cat-modal-close:hover { color: var(--cat-ink); }
        .cat-modal-product { display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .cat-modal-media { position: relative; width: 100%; aspect-ratio: 1/1; border-radius: 16px; background: #f4ede2; overflow: hidden; }
        .cat-modal-media img, .cat-modal-media video { width: 100%; height: 100%; object-fit: contain; }
        .cat-modal-thumbs { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
        .cat-modal-thumbs img { width: 54px; height: 54px; object-fit: cover; border-radius: 10px; cursor: pointer; border: 2px solid transparent; }
        .cat-modal-thumbs img:hover { border-color: var(--cat-accent); }
        .cat-modal-thumbs .thumb-video { position: relative; width: 54px; height: 54px; border-radius: 10px; overflow: hidden; cursor: pointer; border: 2px solid transparent; }
        .cat-modal-thumbs .thumb-video:hover { border-color: var(--cat-accent); }
        .cat-modal-thumbs .thumb-video video { width: 100%; height: 100%; object-fit: cover; pointer-events: none; }
        .cat-modal-thumbs .thumb-video .play { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: rgba(0,0,0,0.35); color: white; font-size: 0.9rem; pointer-events: none; }
        .cat-modal-info h2 { font-family: "Fraunces", serif; font-size: 1.5rem; margin-bottom: 8px; }
        .cat-modal-info .price { font-size: 1.5rem; font-weight: 700; color: var(--cat-accent-dark); margin: 10px 0; }
        .cat-modal-info .price .old { font-size: 1rem; color: var(--cat-muted); text-decoration: line-through; margin-left: 8px; }
        .cat-modal-info .desc { color: var(--cat-muted); line-height: 1.6; margin-bottom: 12px; }
        .cat-modal-info .meta { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 14px; }
        .cat-modal-info .meta div { font-size: 0.85rem; padding: 4px 0; border-bottom: 1px solid var(--cat-line); }
        .cat-modal-info .modal-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .cat-modal-info .modal-actions button { padding: 11px; border-radius: 14px; font-weight: 700; font-size: 0.85rem; }
        .cat-modal-info .modal-actions .btn-add { background: var(--cat-accent); color: white; }
        .cat-modal-info .modal-actions .btn-add:hover { background: var(--cat-accent-dark); }
        .cat-modal-info .modal-actions .btn-ghost { background: #f4ede2; }
        .cat-modal-info .modal-actions .btn-ghost:hover { background: #ece0cf; }
        .cat-modal-info .modal-actions.full { grid-column: 1/-1; }

        #catToast {
            position: fixed; bottom: 26px; right: 26px; padding: 12px 20px; border-radius: 14px;
            background: var(--cat-ink); color: white; font-weight: 600; font-size: 0.88rem; z-index: 99999;
            opacity: 0; transform: translateY(16px); transition: 0.35s; pointer-events: none; max-width: 320px;
        }
        #catToast.show { opacity: 1; transform: translateY(0); }
        #catToast.success { background: var(--cat-success); }
        #catToast.error { background: var(--cat-danger); }
        #catToast.warning { background: #b8863c; }

        footer { text-align: center; padding: 30px 20px; color: var(--cat-muted); font-size: 0.8rem; border-top: 1px solid var(--cat-line); margin-top: 20px; }

        @media (max-width: 768px) {
            .cat-modal-product { grid-template-columns: 1fr; }
            .cat-grid { grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 14px; }
        }
        @media (max-width: 480px) {
            .cat-grid { grid-template-columns: 1fr 1fr; gap: 10px; }
            .cat-card .cat-actions button { font-size: 0.68rem; padding: 7px; }
        }
    </style>
</head>
<body>

    <!-- HEADER STANDARD (identique aux autres pages du site) -->
    <header class="sine-header">
        <div class="sine-header-stars">
            <span style="top:15%;left:10%;"></span>
            <span style="top:30%;left:25%;animation-delay:0.5s;"></span>
            <span style="top:20%;left:45%;animation-delay:1s;"></span>
            <span style="top:60%;left:15%;animation-delay:0.3s;"></span>
            <span style="top:70%;left:35%;animation-delay:1.5s;"></span>

        <a href="../html/index.html" class="sine-header-brand"><span class="sine-word-1">SINE.</span><span class="sine-word-2">SH</span><span class="sine-heart">♡</span><span class="sine-word-3">P</span></a>
        <div class="sine-header-actions">
            <a href="../html/index.html">Accueil</a>
            <a href="../html/collections.html">Collections</a>
            <a href="../html/search.html">Recherche</a>
        </div>
    </header>

    <!-- BANDEAU CATÉGORIE -->
    <section class="cat-hero">
        <div class="cat-icon" id="catIcon">📦</div>
        <h1 id="catTitle">Catégorie</h1>
        <p id="catDescription">Découvrez notre sélection.</p>
        <span class="cat-count" id="catCount">0 produit(s)</span>
    </section>

    <div class="cat-utility">
        <button id="btnFavoris">❤️ Favoris <span class="badge" id="badgeFavoris">0</span></button>
        <button id="btnPanier">🛒 Panier <span class="badge" id="badgePanier">0</span></button>
        <button id="btnProfil">👤 Profil</button>
    </div>

    <!-- FILTRES -->
    <section class="cat-filters">
        <select id="filtreTri">
            <option value="recent">Plus récents</option>
            <option value="prixCroissant">Prix croissant</option>
            <option value="prixDecroissant">Prix décroissant</option>
            <option value="nom">Nom A-Z</option>
            <option value="popularite">Popularité</option>
        </select>
        <input type="number" id="filtrePrix" placeholder="Prix maximum" min="0">
        <label><input type="checkbox" id="filtreStock"> En stock uniquement</label>
        <label><input type="checkbox" id="filtrePromo"> En promotion</label>
    </section>

    <!-- GRILLE PRODUITS -->
    <section class="cat-grid" id="catGrid">
        <div class="cat-empty"><span class="icon">📦</span>Chargement...</div>
    </section>

    <!-- MODAL PRODUIT -->
    <div class="cat-modal" id="catModal">
        <div class="cat-modal-content">
            <span class="cat-modal-close" id="catModalClose">✕</span>
            <div id="catModalContent"></div>
        </div>
    </div>

    <div id="catToast"></div>

    <footer>
        © 2026 SINE.SHOP — Tous droits réservés ·
        <a href="../html/cgu.html" style="color:var(--cat-accent);">CGU</a> ·
        <a href="../html/privacy.html" style="color:var(--cat-accent);">Confidentialité</a>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/comparison-widget.js"></script>
    <script src="../js/share-widget.js"></script>
    <script src="../js/produits.js"></script>
    <script>
        (function() {
            'use strict';

            // Cloisonnement des rôles — page publique (invités autorisés),
            // mais un vendeur/livreur/affilié/admin DÉJÀ connecté ne doit
            // jamais s'y retrouver depuis son espace compte : redirection
            // immédiate vers son propre espace, sans bloquer les visiteurs
            // anonymes ni les clients.
            (function redirigerSiRoleNonClient() {
                try {
                    const u = JSON.parse(localStorage.getItem('sineUser') || 'null');
                    if (!u || u.role === 'client') return;
                    const pages = {
                        seller: '../html/vendeur.html',
                        livreur: '../html/livreur.html',
                        affiliate: '../html/sineshopaffiliation.html',
                        admin: '../html/administrateur.html',
                        superadmin: '../html/superadministrateur.html',
                        moderator: '../html/moderateur.html',
                        support: '../html/support.html',
                    };
                    if (pages[u.role]) window.location.href = pages[u.role];
                } catch (e) {}
            })();


            const params = new URLSearchParams(window.location.search);
            const targetSlug = (params.get('slug') || '').toLowerCase();
            const targetId = params.get('id') || '';

            let produits = [];
            let produitsFiltres = [];
            let favoris = [];
            let panier = null;
            let comparaisonIds = [];
            let utilisateur = null;
            let categorieActuelle = null;

            const grid = document.getElementById('catGrid');
            const modal = document.getElementById('catModal');
            const modalContent = document.getElementById('catModalContent');

            function getDevise() {
                const user = JSON.parse(localStorage.getItem('sineUser') || '{}');
                return user.preferredCurrency || 'XOF';
            }
            function getDeviseSymbole(dev) {
                return { 'FCFA': 'FCFA', 'XOF': 'FCFA', 'EUR': '€', 'USD': '$', 'GBP': '£', 'CAD': 'CA$', 'MAD': 'MAD' }[dev] || dev;
            }
            function formatPrix(montant) {
                return (montant || 0).toLocaleString('fr-FR') + ' ' + getDeviseSymbole(getDevise());
            }

            function showToast(message, type) {
                const el = document.getElementById('catToast');
                el.textContent = message;
                el.className = 'show ' + (type || '');
                clearTimeout(el._t);
                el._t = setTimeout(() => el.classList.remove('show'), 4000);
            }

            async function init() {
                utilisateur = JSON.parse(localStorage.getItem('sineUser') || 'null');

                await window.SINE.initialiserMoteur();
                favoris = window.SINE.favoris || [];
                panier = window.SINE.panier;

                if (utilisateur) {
                    try {
                        const data = await window.SineAPI.getComparison();
                        comparaisonIds = (data || []).map(p => p._id);
                    } catch (e) { comparaisonIds = []; }
                }

                // Retrouver la catégorie ciblée (par id ou par slug)
                try {
                    const categories = await window.SineAPI.getCategories();
                    categorieActuelle = categories.find(c =>
                        (targetId && c._id === targetId) || (targetSlug && c.slug === targetSlug)
                    ) || null;
                } catch (e) { categorieActuelle = null; }

                if (categorieActuelle) {
                    document.getElementById('catTitle').textContent = categorieActuelle.name;
                    document.title = categorieActuelle.name + ' • SINE.SHOP';
                    document.getElementById('catDescription').textContent = categorieActuelle.description || 'Découvrez notre sélection.';
                    if (categorieActuelle.icon) document.getElementById('catIcon').textContent = categorieActuelle.icon;
                    produits = window.SINE.getProduitsParCategorie(categorieActuelle._id);
                } else if (targetId || targetSlug) {
                    document.getElementById('catTitle').textContent = 'Catégorie introuvable';
                    document.getElementById('catDescription').textContent = 'Cette catégorie n\'existe pas ou plus.';
                    produits = [];
                } else {
                    document.getElementById('catTitle').textContent = 'Toutes les catégories';
                    document.getElementById('catDescription').textContent = 'Aucune catégorie précisée — voici tous les produits disponibles.';
                    produits = window.SINE.getProduitsVisibles();
                }

                mettreAJourCompteurs();
                appliquerFiltres();
                if (window.ComparisonWidget) window.ComparisonWidget.init();
            }

            function mettreAJourCompteurs() {
                document.getElementById('badgeFavoris').textContent = favoris.length;
                document.getElementById('badgePanier').textContent = panier?.totalItems || (panier?.items || []).reduce((s, i) => s + (i.quantity || 1), 0);
            }

            function appliquerFiltres() {
                const tri = document.getElementById('filtreTri').value;
                const prixMax = parseFloat(document.getElementById('filtrePrix').value) || Infinity;
                const stockOnly = document.getElementById('filtreStock').checked;
                const promoOnly = document.getElementById('filtrePromo').checked;

                produitsFiltres = produits.filter(p => {
                    if (prixMax !== Infinity && (p.price || 0) > prixMax) return false;
                    if (stockOnly && (p.stock || 0) <= 0) return false;
                    if (promoOnly && !(p.discountedPrice && p.discountedPrice < p.price)) return false;
                    return true;
                });

                switch (tri) {
                    case 'prixCroissant': produitsFiltres.sort((a, b) => (a.price || 0) - (b.price || 0)); break;
                    case 'prixDecroissant': produitsFiltres.sort((a, b) => (b.price || 0) - (a.price || 0)); break;
                    case 'nom': produitsFiltres.sort((a, b) => (a.name || '').localeCompare(b.name || '')); break;
                    case 'popularite': produitsFiltres.sort((a, b) => (b.views || 0) - (a.views || 0)); break;
                    default: produitsFiltres.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                }

                document.getElementById('catCount').textContent = produitsFiltres.length + ' produit(s)';
                afficherProduits();
            }
            ['filtreTri', 'filtrePrix', 'filtreStock', 'filtrePromo'].forEach(id => {
                document.getElementById(id).addEventListener('input', appliquerFiltres);
                document.getElementById(id).addEventListener('change', appliquerFiltres);
            });

            // Plus il y a de produits, plus les colonnes se resserrent.
            function densiteGrille(count) {
                if (count <= 4) return 260;
                if (count <= 10) return 230;
                if (count <= 20) return 200;
                return 180;
            }

            function afficherProduits() {
                if (produitsFiltres.length === 0) {
                    grid.innerHTML = '<div class="cat-empty"><span class="icon">📦</span>Aucun produit dans cette catégorie pour le moment</div>';
                    return;
                }
                grid.style.gridTemplateColumns = `repeat(auto-fill, minmax(${densiteGrille(produitsFiltres.length)}px, 1fr))`;

                grid.innerHTML = produitsFiltres.map(p => {
                    const id = p._id;
                    const estFavori = favoris.some(f => (f.product?._id || f.product) === id);
                    const estDispo = (p.stock || 0) > 0;
                    const enPromo = p.discountedPrice && p.discountedPrice < p.price;
                    const images = p.images?.length > 0 ? p.images.map(i => i.url) : ['../images/produit.png'];
                    const videos = p.videos?.length > 0 ? p.videos.map(v => v.url) : [];
                    const vendeur = p.seller?.storeName || `${p.seller?.firstName || ''} ${p.seller?.lastName || ''}`.trim() || 'Vendeur';
                    const vendeurPhoto = p.seller?.profilePicture || '../images/profil.png';
                    const prixAffiche = enPromo ? p.discountedPrice : (p.price || 0);
                    const ref = p.category?.slug && p.categorySequence ? `${p.category.slug}_${String(p.categorySequence).padStart(6, '0')}` : '';
                    const enComparaison = comparaisonIds.includes(id);

                    const mediaHtml = images.map(img => `<img src="${img}" alt="${p.name || 'Produit'}" loading="lazy" onerror="this.src='../images/produit.png'">`).join('')
                        + videos.map(v => `<video src="${v}" muted preload="metadata" playsinline loop onerror="this.closest('.media-scroll')?.classList.add('has-broken-media');this.style.display='none'" class="media-video"></video>`).join('');
                    const totalMedias = images.length + videos.length;

                    return `
                        <div class="cat-card" ${ref ? `data-ref="${ref}"` : ''}>
                            <div class="cat-media">
                                <div class="cat-media-scroll" onclick="window.voirProduitCat('${id}')">${mediaHtml}</div>
                                ${totalMedias > 1 ? `<span class="cat-media-count">${totalMedias} médias</span>` : ''}
                                <div class="cat-badges">
                                    ${enPromo ? `<span class="badge-promo">-${Math.round((1 - prixAffiche/p.price) * 100)}%</span>` : ''}
                                    ${!estDispo ? '<span class="badge-stock">Rupture</span>' : ''}
                                </div>
                                <button class="cat-fav ${estFavori ? 'active' : ''}" onclick="event.stopPropagation();window.toggleFavoriCat('${id}')"><i class="fa-solid fa-heart"></i></button>
                                <button class="cat-share" onclick="event.stopPropagation();window.shareProduct('${id}', this)" title="Partager"><i class="fa-solid fa-share-nodes"></i></button>
                            </div>
                            <div class="cat-body">
                                <div class="cat-title" onclick="window.voirProduitCat('${id}')">${p.name || 'Produit'}</div>
                                <div class="cat-price">
                                    <span class="now">${formatPrix(prixAffiche)}</span>
                                    ${enPromo ? `<span class="old">${formatPrix(p.price)}</span>` : ''}
                                </div>
                                <div class="cat-stock ${estDispo ? 'in' : 'out'}">${estDispo ? '✔ En stock' : '✕ Rupture'}</div>
                                <div class="cat-vendor">
                                    <img src="${vendeurPhoto}" alt="" onclick="window.voirVendeurCat('${p.seller?._id || ''}')" onerror="this.src='../images/profil.png'">
                                    <span onclick="window.voirVendeurCat('${p.seller?._id || ''}')">${vendeur}</span>
                                </div>
                            </div>
                            <div class="cat-actions">
                                <button class="btn-add" onclick="window.ajouterAuPanierCat('${id}')">🛒 Ajouter</button>
                                <button class="btn-ghost" onclick="window.reserverProduitCat('${id}')">📅 Réserver</button>
                                <button class="btn-ghost" onclick="window.voirProduitCat('${id}')">👁 Aperçu</button>
                                <button class="btn-ghost ${enComparaison ? 'active' : ''}" onclick="window.ajouterComparaisonCat('${id}')">⚖ Comparer</button>
                                <button class="btn-ghost" onclick="window.ouvrirAvisCat('${id}')">⭐ Avis</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }

            // ===== MODAL PRODUIT (galerie image + vidéo) =====
            window.voirProduitCat = function(id) {
                const p = produits.find(x => x._id === id);
                if (!p) { showToast('Produit introuvable', 'error'); return; }

                const images = p.images?.length > 0 ? p.images.map(i => i.url) : ['../images/produit.png'];
                const videos = p.videos?.length > 0 ? p.videos.map(v => v.url) : [];
                const enPromo = p.discountedPrice && p.discountedPrice < p.price;
                const vendeur = p.seller?.storeName || `${p.seller?.firstName || ''} ${p.seller?.lastName || ''}`.trim() || 'Vendeur';
                const estFavori = favoris.some(f => (f.product?._id || f.product) === id);

                let thumbs = images.map(img => `<img src="${img}" onclick="window.showCatModalImage('${img}')" onerror="this.src='../images/produit.png'">`).join('');
                thumbs += videos.map(v => `<div class="thumb-video" onclick="window.showCatModalVideo('${v}')"><video src="${v}" muted preload="metadata" playsinline loop onerror="this.closest('.media-scroll')?.classList.add('has-broken-media');this.style.display='none'" class="media-video"></video><span class="play">▶</span></div>`).join('');

                modalContent.innerHTML = `
                    <div class="cat-modal-product">
                        <div>
                            <div class="cat-modal-media">
                                <img id="catModalImg" src="${images[0]}" alt="${p.name || 'Produit'}" onerror="this.src='../images/produit.png'">
                                <video id="catModalVid" controls style="display:none;"></video>
                            </div>
                            <div class="cat-modal-thumbs">${thumbs}</div>
                        </div>
                        <div class="cat-modal-info">
                            <h2>${p.name || 'Produit'}</h2>
                            <div class="price">${formatPrix(enPromo ? p.discountedPrice : p.price)} ${enPromo ? `<span class="old">${formatPrix(p.price)}</span>` : ''}</div>
                            <div class="desc">${p.description || 'Aucune description disponible.'}</div>
                            <div class="meta">
                                <div><strong>Catégorie</strong><br>${p.category?.name || 'Non définie'}</div>
                                <div><strong>Stock</strong><br>${(p.stock || 0) > 0 ? p.stock + ' disponibles' : 'Rupture'}</div>
                                <div><strong>Vendeur</strong><br>${vendeur}</div>
                                ${p.weight ? `<div><strong>Poids</strong><br>${p.weight} kg</div>` : ''}
                            </div>
                            <div class="modal-actions">
                                <button class="btn-add" onclick="window.ajouterAuPanierCat('${id}');fermerCatModal();">🛒 Ajouter au panier</button>
                                <button class="btn-ghost" onclick="window.reserverProduitCat('${id}');fermerCatModal();">📅 Réserver</button>
                                <button class="btn-ghost full" onclick="window.toggleFavoriCat('${id}');fermerCatModal();">${estFavori ? '❤️ Retirer des favoris' : '🤍 Ajouter aux favoris'}</button>
                                <button class="btn-ghost full" onclick="window.ouvrirAvisCat('${id}')">⭐ Laisser un avis</button>
                            </div>
                        </div>
                    </div>
                `;
                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            };

            window.showCatModalImage = function(url) {
                document.getElementById('catModalVid').style.display = 'none';
                document.getElementById('catModalVid').pause?.();
                const img = document.getElementById('catModalImg');
                img.src = url; img.style.display = 'block';
            };
            window.showCatModalVideo = function(url) {
                document.getElementById('catModalImg').style.display = 'none';
                const vid = document.getElementById('catModalVid');
                vid.src = url; vid.style.display = 'block'; vid.play().catch(() => {});
            };
            window.fermerCatModal = function() {
                modal.classList.remove('active');
                document.body.style.overflow = '';
            };
            document.getElementById('catModalClose').addEventListener('click', window.fermerCatModal);
            modal.addEventListener('click', (e) => { if (e.target === modal) window.fermerCatModal(); });
            document.addEventListener('keydown', (e) => { if (e.key === 'Escape') window.fermerCatModal(); });

            // ===== FAVORIS =====
            window.toggleFavoriCat = async function(id) {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                try {
                    const estFavori = favoris.some(f => (f.product?._id || f.product) === id);
                    if (estFavori) {
                        await window.SineAPI.removeFavorite(id);
                        showToast('❤️ Retiré des favoris', 'warning');
                    } else {
                        await window.SineAPI.toggleFavorite(id);
                        showToast('❤️ Ajouté aux favoris', 'success');
                    }
                    const data = await window.SineAPI.getFavorites();
                    favoris = Array.isArray(data) ? data : (data?.favorites || []);
                    mettreAJourCompteurs();
                    appliquerFiltres();
                } catch (e) {
                    showToast(e.message || 'Erreur favoris.', 'error');
                }
            };

            // ===== PANIER =====
            window.ajouterAuPanierCat = async function(id) {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                try {
                    await window.SineAPI.addToCart(id, 1);
                    const data = await window.SineAPI.getCart();
                    panier = data.cart;
                    mettreAJourCompteurs();
                    showToast('🛒 Ajouté au panier', 'success');
                } catch (e) {
                    showToast(e.message || 'Erreur lors de l\'ajout au panier.', 'error');
                }
            };

            // ===== RÉSERVATION =====
            window.reserverProduitCat = async function(id) {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                const p = produits.find(x => x._id === id);
                if (!p) { showToast('Produit introuvable', 'error'); return; }
                if ((p.stock || 0) <= 0) { showToast('Produit en rupture de stock', 'error'); return; }
                try {
                    const startDate = new Date();
                    const endDate = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
                    const reservation = await window.SineAPI.createReservation({
                        // Le backend attend productId, pas product.
                        productId: id, quantity: 1,
                        startDate: startDate.toISOString(), endDate: endDate.toISOString(),
                        totalPrice: p.discountedPrice || p.price || 0,
                    });
                    showToast('📅 Réservation effectuée ! Vous avez 7 jours pour finaliser.', 'success');
                    setTimeout(() => { window.location.href = '../html/confirmation.html?id=' + reservation._id + '&type=reservation'; }, 1000);
                } catch (e) {
                    showToast(e.message || 'Erreur lors de la réservation.', 'error');
                }
            };

            // ===== AVIS =====
            window.ouvrirAvisCat = async function(id) {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                const p = produits.find(x => x._id === id);
                if (!p) { showToast('Produit introuvable', 'error'); return; }
                const note = prompt('Votre note sur 5 :', '5');
                if (note === null) return;
                const numNote = parseInt(note);
                if (isNaN(numNote) || numNote < 1 || numNote > 5) { showToast('Note invalide (1 à 5).', 'warning'); return; }
                const commentaire = prompt('Votre commentaire (optionnel) :', '');
                try {
                    await window.SineAPI.addReview(id, numNote, commentaire || '');
                    showToast('✅ Avis envoyé, merci !', 'success');
                } catch (e) {
                    showToast(e.message || 'Erreur lors de l\'envoi de l\'avis.', 'error');
                }
            };

            // ===== VENDEUR =====
            // ===== COMPARAISON — synchronisée côté serveur (User.comparisonList) =====
            window.ajouterComparaisonCat = async function(id) {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                try {
                    const result = await window.SineAPI.toggleComparison(id);
                    comparaisonIds = (result.comparisonList || []).map(cid => cid.toString ? cid.toString() : cid);
                    showToast(result.added ? '⚖ Produit ajouté à la comparaison' : '⚖ Produit retiré de la comparaison', result.added ? 'success' : 'warning');
                    afficherProduits();
                    if (window.ComparisonWidget) window.ComparisonWidget.refresh();
                } catch (e) {
                    showToast(e.message || 'Erreur lors de la mise à jour de la comparaison.', 'error');
                }
            };

            window.voirVendeurCat = function(vendeurId) {
                if (!vendeurId) { showToast('Informations du vendeur non disponibles', 'warning'); return; }
                window.location.href = '../html/vendeur-profil.html?id=' + vendeurId;
            };

            // ===== NAVIGATION UTILITAIRE =====
            document.getElementById('btnFavoris').addEventListener('click', () => window.location.href = '../html/favoris.html');
            document.getElementById('btnPanier').addEventListener('click', () => window.location.href = '../html/panier.html');
            document.getElementById('btnProfil').addEventListener('click', function() {
                if (!utilisateur) { window.location.href = '../html/login.html'; return; }
                const pages = {
                    client: '../html/client.html', seller: '../html/vendeur.html',
                    livreur: '../html/livreur.html', affiliate: '../html/sineshopaffiliation.html',
                    admin: '../html/administrateur.html', superadmin: '../html/superadministrateur.html',
                    moderator: '../html/moderateur.html', support: '../html/support.html'
                };
                window.location.href = pages[utilisateur.role] || '../html/client.html';
            });

            init();
            console.log('✅ Page Catégorie dynamique SINE.SHOP chargée');
        })();
    </script>

</body>
</html>
