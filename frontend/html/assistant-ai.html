                    console.warn('Erreur chargement utilisateur:', e);
                }
            }

            // =========================================================
            // 8. CHARGEMENT DU CONTEXTE (backend)
            // =========================================================
            async function loadContext() {
                try {
                    const data = await apiCall('/ai/context', 'GET');
                    contextData = data.data || data.context || {};
                    
                    document.getElementById('contextOrdersCount').textContent = contextData.orders?.length || 0;
                    document.getElementById('contextCartCount').textContent = contextData.cart?.totalItems || 0;
                    document.getElementById('contextMessagesCount').textContent = contextData.notifications?.length || 0;
                    document.getElementById('contextTime').textContent = '⏱️ ' + new Date().toLocaleTimeString();

                    // Suggestions proactives
                    if (data.suggestions) {
                        renderProactiveSuggestions(data.suggestions);
                    }

                    // Mémoire
                    if (data.memory) {
                        const memory = loadMemoryLocal();
                        memory.memories = data.memory.memories || memory.memories;
                        saveMemoryLocal(memory);
                        updateMemoryUI();
                    }

                    return data;
                } catch (error) {
                    console.warn('Erreur chargement contexte:', error);
                    // Fallback: utiliser les données locales
                    return null;
                }
            }

            // =========================================================
            // 9. CHARGEMENT DES CONVERSATIONS (backend)
            // =========================================================
            async function loadConversations() {
                try {
                    const data = await apiCall('/ai/conversations', 'GET');
                    conversations = data.data?.conversations || [];

                    if (conversations.length === 0) {
                        // Créer une conversation locale en attendant
                        const now = new Date().toISOString();
                        const conv = {
                            id: 'local_' + Date.now(),
                            title: 'Bienvenue sur SINE.SHOP AI',
                            messages: [{
                                id: 'msg_welcome_' + Date.now(),
                                from: 'ai',
                                text: 'Bonjour ! Je suis AI-SINE.SHOP, votre assistant connecté au backend. Je m\'adapte à votre langue, je mémorise nos échanges et je peux accéder à vos données réelles (commandes, panier, etc.). Que puis-je faire pour vous ?',
                                time: now,
                                intent: 'Accueil',
                                suggestions: ['Comment créer un compte ?', 'Passer une commande', 'Devenir vendeur', 'Aide']
                            }],
                            createdAt: now,
                            updatedAt: now,
                            pinned: false,
                            archived: false
                        };
                        conversations.push(conv);
                    }

                    currentConvId = conversations[0].id;
                    renderConversationList();
                    renderMessages(currentConvId);
                    
                    return conversations;
                } catch (error) {
                    console.warn('Erreur chargement conversations:', error);
                    // Fallback: conversation locale
                    const now = new Date().toISOString();
                    const conv = {
                        id: 'local_' + Date.now(),
                        title: 'Bienvenue sur SINE.SHOP AI',
                        messages: [{
                            id: 'msg_welcome_' + Date.now(),
                            from: 'ai',
                            text: 'Bonjour ! Je suis AI-SINE.SHOP. Je me connecte au backend pour récupérer vos données. Que puis-je faire pour vous ?',
                            time: now,
                            intent: 'Accueil',
                            suggestions: ['Comment créer un compte ?', 'Passer une commande', 'Aide']
                        }],
                        createdAt: now,
                        updatedAt: now,
                        pinned: false,
                        archived: false
                    };
                    conversations = [conv];
                    currentConvId = conv.id;
                    renderConversationList();
                    renderMessages(currentConvId);
                    return conversations;
                }
            }

            // =========================================================
            // 10. RENDER CONVERSATIONS
            // =========================================================
            function renderConversationList() {
                const container = document.getElementById('conversationList');
                const active = conversations.filter(c => !c.archived);
                if (active.length === 0) {
                    container.innerHTML = '<div style="padding:1rem;text-align:center;color:var(--text-secondary);font-size:0.85rem;">Aucune conversation</div>';
                    return;
                }
                container.innerHTML = active.map(c => `
                    <div class="conv-item ${c.id === currentConvId ? 'active' : ''}" data-id="${c.id}">
                        <img src="../images/logo.png" alt="AI" onerror="this.src='../images/logo.png'">
                        <div class="conv-info">
                            <div class="conv-name">
                                ${c.title || 'Discussion'}
                                ${c.pinned ? '<span class="pin"><i class="fa-solid fa-thumbtack"></i></span>' : ''}
                            </div>
                            <div class="conv-preview">${c.messages.length > 0 ? c.messages[c.messages.length-1].text.substring(0, 50) : 'Nouvelle discussion'}</div>
                        </div>
                        <div class="conv-time">${new Date(c.updatedAt).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'})}</div>
                    </div>
                `).join('');

                container.querySelectorAll('.conv-item').forEach(el => {
                    el.addEventListener('click', function() {
                        const id = this.dataset.id;
                        if (id && id !== currentConvId) {
                            currentConvId = id;
                            renderConversationList();
                            renderMessages(id);
                        }
                    });
                });
            }

            // =========================================================
            // 11. RENDER MESSAGES
            // =========================================================
            function renderMessages(convId) {
                const container = document.getElementById('chatMessages');
                const conv = conversations.find(c => c.id === convId);
                if (!conv) {
                    container.innerHTML = '<div style="text-align:center;color:var(--text-secondary);padding:2rem;">Conversation introuvable</div>';
                    return;
                }

                document.getElementById('chatStatusText').textContent = '🧠 ' + (conv.messages.length || 0) + ' messages • Contexte enrichi';

                if (conv.messages.length === 0) {
                    renderWelcomeScreen(container);
                    return;
                }

                container.innerHTML = conv.messages.map(m => {
                    const isUser = m.from === 'user';
                    const avatar = isUser ? (currentUser?.profilePicture || '../images/profil.png') : '../images/logo.png';
                    const name = isUser ? (currentUser?.firstName || 'Vous') : 'AI-SINE.SHOP';
                    const time = new Date(m.time).toLocaleString('fr-FR', { hour: '2-digit', minute: '2-digit' });

                    let mediaHtml = '';
                    if (m.media) {
                        if (m.media.type === 'image') {
                            mediaHtml = `<div class="msg-media"><img src="${m.media.url}" alt="Image" loading="lazy" onclick="window.open(this.src)"></div>`;
                        } else if (m.media.type === 'video') {
                            mediaHtml = `<div class="msg-media"><video src="${m.media.url}" controls></video></div>`;
                        } else if (m.media.type === 'audio') {
                            mediaHtml = `<div class="msg-media"><audio src="${m.media.url}" controls></audio></div>`;
                        }
                    }

                    let intentHtml = '';
                    if (m.intent) {
                        intentHtml = `<div class="intent-badge"><i class="fa-regular fa-lightbulb"></i> ${m.intent}</div>`;
                    }

                    let relatedHtml = '';
                    if (!isUser && m.suggestions && m.suggestions.length > 1) {
                        relatedHtml = `<div class="related-chips">
                            ${m.suggestions.slice(0, 4).map(s => `<button class="related-chip" onclick="window.sendMessage('${s.replace(/'/g, "\\'")}')">${s}</button>`).join('')}
                        </div>`;
                    }

                    return `
                        <div class="msg ${isUser ? 'user' : 'ai'}">
                            ${!isUser ? intentHtml : ''}
                            ${mediaHtml}
                            ${m.text}
                            <span class="msg-time">${time} ${isUser ? '' : '• AI'}</span>
                            ${!isUser ? `
                                <div class="msg-actions">
                                    <button onclick="window.copyMessage('${m.id}')"><i class="fa-regular fa-copy"></i></button>
                                    <button onclick="window.reportMessage('${m.id}')"><i class="fa-regular fa-flag"></i></button>
                                </div>
                            ` : ''}
                            ${relatedHtml}
                        </div>
                    `;
                }).join('');

                container.scrollTop = container.scrollHeight;
            }

            // =========================================================
            // 13. ENVOYER UN MESSAGE (backend + local)
            // =========================================================
            window.sendMessage = function(text, media) { return sendMessage(text, media); };
            async function sendMessage(text, media = null) {
                if (!text.trim() && !media) return;
                if (isProcessing) {
                    showToast('Veuillez attendre la fin du traitement en cours.', 'warning');
                    return;
                }

                const conv = conversations.find(c => c.id === currentConvId);
                if (!conv) {
                    showToast('Aucune conversation active', 'error');
                    return;
                }

                isProcessing = true;

                // Message utilisateur (optimiste)
                const msgUser = {
                    id: 'msg_' + Date.now() + '_user',
                    from: 'user',
                    text: text.trim(),
                    time: new Date().toISOString(),
                    media: media || null,
                    intent: null
                };
                conv.messages.push(msgUser);
                conv.updatedAt = new Date().toISOString();
                renderMessages(currentConvId);
                renderConversationList();

                // Typing
                const chatMessages = document.getElementById('chatMessages');
                const typingDiv = document.createElement('div');
                typingDiv.className = 'typing-indicator';
                typingDiv.innerHTML = `<span></span><span></span><span></span> Réflexion...`;
                chatMessages.appendChild(typingDiv);
                chatMessages.scrollTop = chatMessages.scrollHeight;

                try {
                    // Préparer le contexte
                    const history = conv.messages.slice(-10).map(m => ({ from: m.from, text: m.text }));
                    
                    // Appel au backend
                    const payload = {
                        message: text.trim(),
                        conversationId: conv.id,
                        media: media || null,
                        context: { lastMessages: history }
                    };

                    // Si l'ID commence par 'local_', on ne l'envoie pas au backend
                    if (conv.id.startsWith('local_')) {
                        delete payload.conversationId;
                    }

                    const data = await apiCall('/ai/chat', 'POST', payload);
                    const result = data.data || data;

                    typingDiv.remove();

                    // Message AI
                    const msgAI = {
                        id: 'msg_' + Date.now() + '_ai',
                        from: 'ai',
                        text: result.response || 'Je n\'ai pas pu générer une réponse.',
                        time: new Date().toISOString(),
                        intent: result.intent || 'Général',
                        suggestions: result.suggestions || [],
                        media: null
                    };
                    conv.messages.push(msgAI);
                    conv.updatedAt = new Date().toISOString();
                    
                    // Si le backend a retourné un vrai conversationId, mettre à jour
                    if (result.conversationId && !conv.id.startsWith('local_')) {
                        conv.id = result.conversationId;
                    }

                    renderMessages(currentConvId);
                    renderConversationList();

                    // Mettre à jour les suggestions proactives
                    if (result.suggestions) {
                        renderProactiveSuggestions(result.suggestions);
                    }

                    // Mettre à jour le contexte
                    if (result.context) {
                        contextData = result.context;
                        document.getElementById('contextOrdersCount').textContent = result.context.orders || 0;
                        document.getElementById('contextCartCount').textContent = result.context.cartItems || 0;
                    }

                    // Mettre à jour la mémoire
                    updateMemoryUI();

                } catch (error) {
                    typingDiv.remove();
                    console.error('Erreur API:', error);
                    
                    // Fallback: traitement local
                    const fallbackResult = processLocalQuery(text.trim());
                    
                    const msgAI = {
                        id: 'msg_' + Date.now() + '_ai_fallback',
                        from: 'ai',
                        text: fallbackResult.response,
                        time: new Date().toISOString(),
                        intent: fallbackResult.intent || 'Général',
                        suggestions: fallbackResult.suggestions || [],
                        media: null
                    };
                    conv.messages.push(msgAI);
                    conv.updatedAt = new Date().toISOString();
                    renderMessages(currentConvId);
                    renderConversationList();
                    
                    showToast('Mode local activé (backend indisponible)', 'warning');
                } finally {
                    isProcessing = false;
                }
            }

            // =========================================================
            // 14. TRAITEMENT LOCAL (fallback)
            // =========================================================
            function processLocalQuery(query) {
                const cleanQuery = String(query || '').trim();
                if (!cleanQuery) {
                    return { response: 'Veuillez écrire un message.', suggestions: [], intent: 'Erreur' };
                }

                const match = findBestMatch(cleanQuery);
                let response = '';
                let intent = 'Général';
                let suggestions = [];

                if (match) {
                    response = match.entry.a;
                    intent = match.entry.cat || 'Général';
                    const related = findRelatedEntries(cleanQuery, 3, match.entry.id);
                    suggestions = related.map(r => r.entry.q);
                    if (suggestions.length < 2) {
                        suggestions = ['Voir mes commandes', 'Comment publier un produit ?', 'Contacter le support'];
                    }
                } else {
                    const related = findRelatedEntries(cleanQuery, 4);
                    if (related.length > 0) {
                        response = "Je n'ai pas de réponse exacte à cette question, mais voici des sujets proches :\n\n" +
                            related.map((r, i) => `• ${r.entry.q}`).join('\n') +
                            "\n\nSinon, reformulez votre question ou contactez le support.";
                        suggestions = related.map(r => r.entry.q);
                    } else {
                        response = "Je n'ai pas encore de réponse précise à cette question. N'hésitez pas à la reformuler, ou contactez notre support à support@sineshophome.com.";
                        suggestions = ['Comment créer un compte ?', 'Passer une commande', 'Devenir vendeur', 'Contacter le support'];
                    }
                    intent = 'Non reconnu';
                }

                return { response, suggestions, intent };
            }

            // =========================================================

            // =========================================================
            function renderProactiveSuggestions(suggestions) {
                const container = document.getElementById('proactiveSuggestions');
                if (!suggestions || suggestions.length === 0) {
                    container.innerHTML = `

                        <button class="suggestion-chip" onclick="window.sendMessage('Aide')">❓ Aide</button>
                        <button class="suggestion-chip" onclick="window.sendMessage('Voir mes commandes')">📦 Commandes</button>
                        <button class="suggestion-chip" onclick="window.sendMessage('Devenir vendeur')">🏪 Vendre</button>
                    `;
                    return;
                }
                container.innerHTML = suggestions.map(s => `
                    <button class="suggestion-chip" onclick="window.sendMessage('${String(s).replace(/'/g, "\\'")}')">
                        ${s}
                    </button>
                `).join('');
            }

            // =========================================================
            // 16. ACTIONS GLOBALES
            // =========================================================
            window.copyMessage = function(id) {
                const conv = conversations.find(c => c.id === currentConvId);
                if (!conv) return;
                const msg = conv.messages.find(m => m.id === id);
                if (msg) {
                    navigator.clipboard.writeText(msg.text).then(() => {
                        showToast('Message copié !', 'success');
                    });

                if (!confirm('Signaler ce message comme inapproprié ?')) return;
                showToast('Message signalé. Merci.', 'warning');
            };

            // =========================================================
            // 17. NOUVELLE CONVERSATION
            // =========================================================
            async function newConversation() {
                try {
                    const data = await apiCall('/ai/conversations', 'POST', { title: 'Nouvelle discussion' });
                    const conv = data.data || data;
                    conv.messages = conv.messages || [];
                    conversations.unshift(conv);
                    currentConvId = conv.id;
                    renderConversationList();
                    renderMessages(currentConvId);
                    showToast('Nouvelle conversation créée', 'success');
                    loadContext();
                } catch (error) {
                    // Fallback local
                    const now = new Date().toISOString();
                    const conv = {
                        id: 'local_' + Date.now(),
                        title: 'Nouvelle discussion',
                        messages: [{
                            id: 'msg_welcome_' + Date.now(),
                            from: 'ai',
                            text: 'Bonjour ! Je suis AI-SINE.SHOP. Je suis prêt à vous aider.',
                            time: now,
                            intent: 'Accueil',
                            suggestions: ['Comment créer un compte ?', 'Passer une commande', 'Aide']
                        }],
                        createdAt: now,
                        updatedAt: now,
                        pinned: false,
                        archived: false
                    };
                    conversations.unshift(conv);
                    currentConvId = conv.id;
                    renderConversationList();
                    renderMessages(currentConvId);
                    showToast('Nouvelle conversation créée (local)', 'info');

            // =========================================================
            // 18. AUTRES ACTIONS
            // =========================================================
            async function clearHistory() {
                if (!confirm('Supprimer tout l\'historique ?')) return;
                try {
                    await apiCall('/ai/history', 'DELETE');
                    conversations = [];
                    await newConversation();
                    showToast('Historique effacé', 'warning');
                } catch (error) {
                    showToast('Erreur lors de la suppression', 'error');
                }
            }

            async function archiveAll() {
                try {
                    await apiCall('/ai/archive-all', 'POST');
                    conversations.forEach(c => c.archived = true);
                    renderConversationList();
                    showToast('Toutes les conversations archivées', 'info');
                } catch (error) {
                    showToast('Erreur lors de l\'archivage', 'error');
                }
            }

            function exportChat() {
                const conv = conversations.find(c => c.id === currentConvId);
                if (!conv) return;
                const text = conv.messages.map(m => {
                    const from = m.from === 'user' ? 'Vous' : 'AI-SINE.SHOP';
                    const time = new Date(m.time).toLocaleString();
                    return `[${time}] ${from}: ${m.text}`;
                }).join('\n');
                const blob = new Blob([text], { type: 'text/plain' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `conversation_${new Date().toISOString().slice(0,10)}.txt`;
                a.click();
                URL.revokeObjectURL(url);
                showToast('Conversation exportée', 'success');
            }

            async function deleteCurrentChat() {
                if (!currentConvId) return;
                if (!confirm('Supprimer cette conversation ?')) return;
                try {
                    if (!currentConvId.startsWith('local_')) {
                        await apiCall('/ai/conversations/' + currentConvId, 'DELETE');
                    }
                    const index = conversations.findIndex(c => c.id === currentConvId);
                    if (index > -1) conversations.splice(index, 1);
                    if (conversations.length > 0) {
                        currentConvId = conversations[0].id;
                    } else {
                        await newConversation();
                    }
                    renderConversationList();
                    renderMessages(currentConvId);
                    showToast('Conversation supprimée', 'warning');
                } catch (error) {
                    showToast('Erreur lors de la suppression', 'error');
                }
            }

            async function archiveCurrentChat() {
                const conv = conversations.find(c => c.id === currentConvId);
                if (!conv) return;
                try {
                    if (!conv.id.startsWith('local_')) {
                        await apiCall('/ai/conversations/' + currentConvId + '/archive', 'POST');
                    }
                    conv.archived = true;
                    renderConversationList();
                    const next = conversations.find(c => !c.archived);
                    if (next) {
                        currentConvId = next.id;
                    } else {
                        await newConversation();
                    }
                    renderMessages(currentConvId);
                    showToast('Conversation archivée', 'info');
                } catch (error) {
                    showToast('Erreur lors de l\'archivage', 'error');
                }
            }

            function togglePinConversation() {
                const conv = conversations.find(c => c.id === currentConvId);
                if (conv) {
                    conv.pinned = !conv.pinned;
                    renderConversationList();
                    showToast(conv.pinned ? '📌 Épinglée' : '📌 Épingle retirée', 'info');
                }
            }

            // =========================================================
            // 19. FILE UPLOAD
            // =========================================================
            function fileToDataURL(file) {
                return new Promise((resolve, reject) => {
                    const reader = new FileReader();
                    reader.onload = () => resolve(reader.result);
                    reader.onerror = reject;
                    reader.readAsDataURL(file);
                });
            }

            // =========================================================
            // 20. TOAST
            // =========================================================
            function showToast(message, type = 'info') {
                const container = document.getElementById('toastContainer');
                const toast = document.createElement('div');
                toast.className = 'toast-item ' + type;
                toast.textContent = message;
                container.appendChild(toast);
                setTimeout(() => {
                    toast.style.opacity = '0';
                    toast.style.transform = 'translateY(-10px)';
                    toast.style.transition = '0.4s';
                    setTimeout(() => toast.remove(), 500);
                }, 3000);
            }

            // =========================================================
            // 21. INITIALISATION
            // =========================================================
            document.addEventListener('DOMContentLoaded', async function() {
                try {
                    // Charger l'utilisateur
                    await loadUserData();
                    
                    // Charger les conversations
                    await loadConversations();
                    
                    // Charger le contexte
                    await loadContext();
                    
                    // Charger la mémoire locale
                    updateMemoryUI();

                    // Suggestions initiales
                    const initialSuggestions = ['Comment créer un compte ?', 'Passer une commande', 'Devenir vendeur', 'Aide'];
                    renderProactiveSuggestions(initialSuggestions);

                    // =========================================================
                    // ÉVÉNEMENTS
                    // =========================================================
                    const input = document.getElementById('messageInput');
                    const sendBtn = document.getElementById('sendMessageBtn');

                    sendBtn.addEventListener('click', function() {
                        const text = input.value.trim();
                        if (text) {
                            sendMessage(text);
                            input.value = '';
                            input.style.height = 'auto';
                        }
                    });

                    input.addEventListener('keydown', function(e) {
                        if (e.key === 'Enter' && !e.shiftKey) {
                            e.preventDefault();
                            sendBtn.click();
                        }
                    });

                    input.addEventListener('input', function() {
                        this.style.height = 'auto';
                        this.style.height = Math.min(this.scrollHeight, 150) + 'px';
                    });

                    // File upload
                    document.getElementById('fileInput').addEventListener('change', async function(e) {
                        const files = Array.from(e.target.files || []);
                        this.value = '';
                        for (const file of files.slice(0, 3)) {
                            try {
                                if (file.size > 8 * 1024 * 1024) {
                                    showToast(`${file.name} est trop volumineux (8 Mo max).`, 'warning');
                                    continue;
                                }
                                const dataUrl = await fileToDataURL(file);
                                let media;
                                if (file.type.startsWith('video/')) {
                                    media = { type: 'video', url: dataUrl, name: file.name, mimeType: file.type };
                                } else if (file.type.startsWith('image/')) {
                                    media = { type: 'image', url: dataUrl, name: file.name, mimeType: file.type };
                                } else if (file.type.startsWith('audio/')) {
                                    media = { type: 'audio', url: dataUrl, name: file.name, mimeType: file.type };
                                } else {
                                    media = { type: 'file', url: dataUrl, name: file.name, mimeType: file.type || 'application/octet-stream' };
                                }
                                sendMessage(`📎 ${file.name}`, media);
                            } catch (err) {
                                console.error(err);
                                showToast(`Impossible de préparer ${file.name}.`, 'error');
                            }
                        }
                    });

                    // Voice recording (Web Speech API)
                    let mediaRecorder = null;
                    let recordedChunks = [];

                    document.getElementById('btnVoiceRecord').addEventListener('click', function() {
                        const btn = this;
                        if (mediaRecorder && mediaRecorder.state === 'recording') {
                            mediaRecorder.stop();
                            return;
                        }
                        if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) {
                            if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                                const recognition = new SpeechRecognition();
                                recognition.lang = currentLang === 'fr' ? 'fr-FR' : currentLang;
                                recognition.continuous = false;
                                recognition.interimResults = false;
                                recognition.onresult = e => sendMessage(e.results[0][0].transcript);
                                recognition.onerror = () => showToast('Microphone indisponible.', 'error');
                                recognition.start();
                                showToast('🎤 Parlez maintenant...', 'info');
                            } else {
                                showToast('Microphone non disponible.', 'error');
                            }
                            return;
                        }

                        let liveTranscript = '';
                        let recognitionInstance = null;
                        if ('SpeechRecognition' in window || 'webkitSpeechRecognition' in window) {
                            const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                            recognitionInstance = new SpeechRecognition();
                            recognitionInstance.lang = currentLang === 'fr' ? 'fr-FR' : currentLang;
                            recognitionInstance.continuous = true;
                            recognitionInstance.interimResults = false;
                            recognitionInstance.onresult = (e) => {
                                for (let i = e.resultIndex; i < e.results.length; i++) {
                                    if (e.results[i].isFinal) liveTranscript += e.results[i][0].transcript + ' ';
                                }
                            };
                            recognitionInstance.onerror = () => { /* silencieux */ };
                            try { recognitionInstance.start(); } catch (e) { recognitionInstance = null; }
                        }

                        navigator.mediaDevices.getUserMedia({ audio: true }).then(stream => {
                            recordedChunks = [];
                            mediaRecorder = new MediaRecorder(stream, { mimeType: 'audio/webm' });
                            mediaRecorder.ondataavailable = e => { if (e.data.size) recordedChunks.push(e.data); };
                            mediaRecorder.onstop = async () => {
                                stream.getTracks().forEach(t => t.stop());
                                btn.classList.remove('recording');
                                btn.innerHTML = '<i class="fa-solid fa-microphone"></i>';
                                if (recognitionInstance) { try { recognitionInstance.stop(); } catch (e) {} }
                                const blob = new Blob(recordedChunks, { type: 'audio/webm' });
                                const dataUrl = await new Promise((resolve) => {
                                    const reader = new FileReader();
                                    reader.onload = () => resolve(reader.result);
                                    reader.readAsDataURL(blob);
                                });
                                const transcript = liveTranscript.trim();
                                if (transcript) {
                                    sendMessage(`🎤 ${transcript}`, { type: 'audio', url: dataUrl, name: `vocal_${Date.now()}.webm`, mimeType: 'audio/webm' });
                                } else {
                                    sendMessage('🎤 Message vocal', { type: 'audio', url: dataUrl, name: `vocal_${Date.now()}.webm`, mimeType: 'audio/webm' });
                                }
                            };
                            mediaRecorder.start();
                            btn.classList.add('recording');
                            btn.innerHTML = '<i class="fa-solid fa-stop"></i>';
                            showToast('🎙️ Enregistrement... cliquez pour arrêter.', 'info');
                        }).catch(() => {
                            if (recognitionInstance) { try { recognitionInstance.stop(); } catch (e) {} }
                            showToast('Autorisation microphone refusée.', 'error');
                        });
                    });

                    // Emoji
                    const emojiSets = {
                        '😀': '😀 😃 😄 😁 😆 😅 😂 🤣 😊 😇 🙂 🙃 😉 😌 😍 🥰 😘 😗 😙 😚 😋 😛 😝 😜 🤪 🤨 🧐 🤓 😎 🤩 🥳 😏 😒 😞 😔 😟 😕 🙁 ☹️ 😣 😖 😫 😩 🥺 😢 😭 😤 😠 😡 🤬 🤯 😳 🥵 🥶 😱 😨 😰 😥 😓 🤗 🤔 🤭 🤫 🤥 😶 😐 😑 😬 🙄 😯 😦 😧 😮 😲 🥱 😴 🤤 😪 😵 🤐 🤑 🤠 😈 👿 👹 👺 🤡 💩 👻 💀 ☠️ 👽 👾 🤖 🎃 😺 😸 😹 😻 😼 😽 🙀 😿 😾',
                        '❤️': '❤️ 🧡 💛 💚 💙 💜 🖤 🤍 🤎 💔 ❣️ 💕 💞 💓 💗 💖 💘 💝 💟 💌 💋 💯 💢 💥 💫 💦 💨 🕳️ 💣 💬 👁️‍🗨️ 🗨️ 🗯️',
                        '👋': '👋 🤚 🖐️ ✋ 🖖 👌 🤏 ✌️ 🤞 🤟 🤘 🤙 👈 👉 👆 👇 ☝️ ✍️ 👋 🙏 💪 👏 🙌 👐 🤝 👍 👎 👊 ✊ 🤲 🫶 🫰 🫵',
                        '🧑': '👶 🧒 👦 👧 🧑 👱 👨 🧔 👨‍🦰 👨‍🦱 👨‍🦳 👩 👩‍🦰 👩‍🦱 👩‍🦳 🧓 👴 👵 🙍 🙎 🙅 🙆 💁 🙋 🧏 🙇 🤦 🤷 👮 🕵️ 💂 👷 🤴 👸 👳 🧕 🤵 👰 🤰 🫃 🫄',
                        '🐶': '🐶 🐱 🐭 🐹 🐰 🦊 🐻 🐼 🐨 🐯 🦁 🐮 🐷 🐸 🐵 🙈 🙉 🙊 🐒 🐔 🐧 🐦 🐤 🦆 🦅 🦉 🐺 🐗 🐴 🦄 🐝 🐛 🦋 🐌 🐞 🐜 🕷️ 🦂 🐢 🐍 🦎 🦖 🦕 🐙 🦑 🦀 🐠 🐟 🐡 🐬 🐳 🦈',
                        '🍎': '🍏 🍎 🍐 🍊 🍋 🍌 🍉 🍇 🍓 🫐 🍈 🍒 🍑 🥭 🍍 🥥 🥝 🍅 🥑 🍆 🥔 🥕 🌽 🌶️ 🫑 🥒 🥬 🥦 🧄 🧅 🍞 🥐 🥖 🥨 🧀 🥚 🍳 🧇 🥞 🧈 🍗 🍔 🍟 🍕 🌭 🌮 🌯 🥗 🍿 🍩 🍪 🎂 🍰 🧁 🍫 🍭 🍬 ☕ 🧃 🥤',
                        '🇨🇮': '🇨🇮 🇫🇷 🇬🇧 🇺🇸 🇨🇦 🇲🇦 🇸🇳 🇳🇬 🇬🇭 🇧🇯 🇹🇬 🇬🇳 🇧🇫 🇲🇱 🇨🇲 🇩🇪 🇪🇸 🇮🇹 🇵🇹 🇨🇳 🇯🇵 🇰🇷 🇦🇪 🇿🇦'
                    };
                    const emojiPanel = document.getElementById('emojiPanel');
                    const emojiGrid = document.getElementById('emojiGrid');
                    const emojiTabs = document.getElementById('emojiTabs');
                    const emojiSearch = document.getElementById('emojiSearch');
                    let currentEmojiSet = Object.keys(emojiSets)[0];

                    function drawEmojis(filter = '') {
                        let emojis = Object.values(emojiSets).join(' ').split(/\s+/).filter(Boolean);
                        if (!filter) emojis = emojiSets[currentEmojiSet].split(/\s+/).filter(Boolean);
                        else emojis = emojis.filter(e => e.includes(filter));
                        emojiGrid.innerHTML = emojis.map(e => `<button type="button" data-emoji="${e}">${e}</button>`).join('');
                        emojiGrid.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                            const input = document.getElementById('messageInput');
                            const pos = input.selectionStart ?? input.value.length;
                            input.value = input.value.slice(0,pos) + b.dataset.emoji + input.value.slice(pos);
                            input.focus();
                        }));
                    }
                    emojiTabs.innerHTML = Object.keys(emojiSets).map(k => `<button type="button" data-set="${k}">${k}</button>`).join('');
                    emojiTabs.querySelectorAll('button').forEach(b => b.addEventListener('click', () => {
                        currentEmojiSet = b.dataset.set;
                        emojiSearch.value = '';
                        drawEmojis();
                    }));
                    document.getElementById('btnEmoji').addEventListener('click', () => {
                        emojiPanel.classList.toggle('active');
                        if (emojiPanel.classList.contains('active')) drawEmojis();
                    });
                    document.getElementById('emojiClose').addEventListener('click', () => emojiPanel.classList.remove('active'));
                    emojiSearch.addEventListener('input', () => drawEmojis(emojiSearch.value.trim()));
                    document.addEventListener('click', e => {
                        if (!emojiPanel.contains(e.target) && e.target.id !== 'btnEmoji') emojiPanel.classList.remove('active');
                    });

                    // Boutons
                    document.getElementById('btnNewChat').addEventListener('click', newConversation);
                    document.getElementById('btnClearHistory').addEventListener('click', clearHistory);
                    document.getElementById('btnArchiveAll').addEventListener('click', archiveAll);
                    document.getElementById('btnExportChat').addEventListener('click', exportChat);
                    document.getElementById('btnDeleteChat').addEventListener('click', deleteCurrentChat);
                    document.getElementById('btnArchiveChat').addEventListener('click', archiveCurrentChat);
                    document.getElementById('btnPinChat').addEventListener('click', togglePinConversation);
                    document.getElementById('btnPinConversation').addEventListener('click', togglePinConversation);

                    document.getElementById('btnSuggestAction').addEventListener('click', function() {
                        loadContext();
                        showToast('🔄 Contexte mis à jour', 'info');
                    });

                    // Context bar clicks
                    document.getElementById('contextOrders').addEventListener('click', () => sendMessage('Voir mes commandes'));
                    document.getElementById('contextCart').addEventListener('click', () => sendMessage('Voir mon panier'));
                    document.getElementById('contextMessages').addEventListener('click', () => sendMessage('Voir mes messages'));
                    document.getElementById('contextSupport').addEventListener('click', () => sendMessage('Contacter le support'));
                    document.getElementById('contextMemory').addEventListener('click', () => sendMessage('Que sais-tu de moi ?'));

                    // Recherche
                    document.getElementById('searchHistory').addEventListener('input', function() {
                        const query = this.value.toLowerCase();
                        const items = document.querySelectorAll('.conv-item');
                        items.forEach(item => {
                            const text = item.textContent.toLowerCase();
                            item.style.display = text.includes(query) ? '' : 'none';
                        });
                    });

                    // Langues
                    document.querySelectorAll('.lang-selector button').forEach(btn => {
                        btn.addEventListener('click', function() {
                            const lang = this.dataset.lang;
                            currentLang = lang;
                            localStorage.setItem('aiLang', lang);
                            document.querySelectorAll('.lang-selector button').forEach(b => b.classList.remove('active'));
                            this.classList.add('active');
                            showToast('Langue: ' + lang.toUpperCase(), 'info');
                        });
                    });

                    // Options Overlay
                    const optionsOverlay = document.getElementById('optionsOverlay');
                    const closeOptions = () => optionsOverlay.classList.remove('active');
                    document.getElementById('btnMoreOptions').addEventListener('click', () => optionsOverlay.classList.add('active'));
                    optionsOverlay.addEventListener('click', e => { if (e.target === optionsOverlay) closeOptions(); });
                    document.getElementById('optClose').addEventListener('click', closeOptions);
                    document.getElementById('optNew').addEventListener('click', async () => { closeOptions(); await newConversation(); });
                    document.getElementById('optExport').addEventListener('click', () => { closeOptions(); exportChat(); });
                    document.getElementById('optPin').addEventListener('click', async () => { closeOptions(); togglePinConversation(); });
                    document.getElementById('optArchive').addEventListener('click', async () => { closeOptions(); await archiveCurrentChat(); });
                    document.getElementById('optDelete').addEventListener('click', async () => { closeOptions(); await deleteCurrentChat(); });
                    document.getElementById('optStats').addEventListener('click', () => {
                        const conv = conversations.find(c => c.id === currentConvId);
                        const count = conv?.messages?.length || 0;
                        const userCount = conv?.messages?.filter(m => m.from === 'user').length || 0;
                        const aiCount = conv?.messages?.filter(m => m.from === 'ai').length || 0;
                        closeOptions();
                        showToast(`📊 ${count} messages • ${userCount} de vous • ${aiCount} de l'IA`, 'info');
                    });

                    // Profil Modal
                    const profileModal = document.getElementById('profileModal');
                    document.getElementById('btnOpenProfile').addEventListener('click', () => profileModal.classList.add('active'));
                    document.getElementById('modalClose').addEventListener('click', () => profileModal.classList.remove('active'));
                    profileModal.addEventListener('click', (e) => { if (e.target === profileModal) profileModal.classList.remove('active'); });

                    document.getElementById('modalAvatarInput').addEventListener('change', function(e) {
                        const file = e.target.files[0];
                        if (file) {
                            const reader = new FileReader();
                            reader.onload = function(ev) {
                                document.getElementById('modalAvatar').src = ev.target.result;
                                showToast('Avatar mis à jour', 'success');
                            };
                            reader.readAsDataURL(file);
                        }
                    });

                    document.getElementById('btnResetAvatar').addEventListener('click', function() {
                        document.getElementById('modalAvatar').src = '../images/logo.png';
                        document.getElementById('headerAvatar').src = '../images/logo.png';
                        document.getElementById('modalAvatarInput').value = '';
                        showToast('Avatar réinitialisé', 'info');
                    });

                    document.getElementById('modalSave').addEventListener('click', function() {
                        const name = document.getElementById('modalDisplayName').value || 'AI-SINE.SHOP';
                        const status = document.getElementById('modalStatus').value;
                        const lang = document.getElementById('modalLanguage').value;
                        const tone = document.getElementById('modalTone').value;

                        document.getElementById('headerName').textContent = currentUser?.firstName || 'Utilisateur';
                        document.getElementById('chatName').textContent = name;
                        document.getElementById('userStatus').textContent = status;
                        document.getElementById('chatStatusText').textContent = status + ' • Prêt à vous aider';

                        const avatarSrc = document.getElementById('modalAvatar').src;
                        document.getElementById('headerAvatar').src = avatarSrc;
                        document.getElementById('chatAvatar').src = avatarSrc;

                        currentLang = lang;
                        document.querySelectorAll('.lang-selector button').forEach(btn => {
                            btn.classList.toggle('active', btn.dataset.lang === lang);
                        });

                        localStorage.setItem('aiLang', lang);
                        localStorage.setItem('aiTone', tone);
                        profileModal.classList.remove('active');
                        showToast('Profil mis à jour !', 'success');
                    });

                    const savedLang = localStorage.getItem('aiLang') || 'fr';
                    currentLang = savedLang;
                    document.querySelectorAll('.lang-selector button').forEach(btn => {
                        btn.classList.toggle('active', btn.dataset.lang === savedLang);
                    });
                    document.getElementById('modalLanguage').value = savedLang;
                    document.getElementById('modalTone').value = localStorage.getItem('aiTone') || 'warm';

                    // Rafraîchissement contexte toutes les 30 secondes
                    setInterval(() => {
                        if (document.hidden) return;
                        loadContext();
                    }, 30000);

                    console.log('✅ AI-SINE.SHOP v4.0 — Connecté au backend, sans API externe');
                    console.log('🧠 Base de connaissances: ' + KNOWLEDGE_BASE.length + ' entrées');
                    console.log('👤 Utilisateur:', currentUser?.email || 'non connecté');

                } catch (error) {
                    console.error('Erreur d\'initialisation:', error);
                    showToast('Erreur d\'initialisation: ' + error.message, 'error');
                }
            });

        })();
    </script>

</body>
</html>
