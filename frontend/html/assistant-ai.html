<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>SINE.SHOP • AI Assistant Proactif</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/shared-header.css">
    <style>
        /* =========================================================
           STYLES COMPLETS — AI-SINE.SHOP v4.0 (Backend-Connecté)
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; }
        
        :root {
            --bg-primary: #e8f4f8;
            --bg-card: rgba(255,255,255,0.85);
            --text-primary: #0a2a44;
            --text-secondary: #4a6a8a;
            --accent: #3b82f6;
            --accent-gradient: linear-gradient(135deg, #3b82f6, #8b5cf6);
            --shadow: 0 8px 32px rgba(0,0,0,0.08);
            --radius: 20px;
            --transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        [data-theme="dark"] {
            --bg-primary: #0f172a;
            --bg-card: rgba(26,36,54,0.92);
            --text-primary: #e2e8f0;
            --text-secondary: #94a3b8;
            --shadow: 0 8px 32px rgba(0,0,0,0.4);
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            transition: background var(--transition);
        }

        /* =========================================================
           HEADER
           ========================================================= */
        .assistant-header {
            background: linear-gradient(180deg, rgba(126,190,245,0.96) 0%, rgba(62,132,205,0.94) 48%, rgba(18,57,105,0.97) 100%);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 0.7rem 2rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 1rem;
            border-bottom: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 6px 35px rgba(7,21,43,0.22);
            position: sticky;
            top: 0;
            z-index: 100;
            transition: background var(--transition);
        }
        [data-theme="dark"] .assistant-header {
            background: linear-gradient(180deg, rgba(18,40,70,0.96) 0%, rgba(10,25,50,0.96) 100%);
            border-bottom-color: rgba(255,255,255,0.1);
        }

        .assistant-header .logo-area { display: flex; align-items: center; gap: 1rem; }
        .assistant-header .logo-area img { height: 42px; width: auto; border-radius: 12px; }
        .assistant-header .logo-area h1 { 
            font-size: 1.3rem; 
            font-weight: 800; 
            color: #ffffff; 
            text-shadow: 0 2px 10px rgba(0,0,0,.18); 
        }
        .assistant-header .logo-area h1 span { 
            font-size: 0.6rem; 
            background: var(--accent-gradient); 
            padding: 0.1rem 0.6rem; 
            border-radius: 30px; 
            color: white; 
            margin-left: 4px; 
        }
        .assistant-header .logo-area small { font-size: 0.7rem; color: rgba(255,255,255,.82); display: block; }

        .assistant-header .header-actions { display: flex; align-items: center; gap: 0.8rem; flex-wrap: wrap; }
        .assistant-header .header-actions button {
            padding: 0.4rem 1rem;
            border-radius: 30px;
            color: #1a3a5a;
            font-weight: 600;
            font-size: 0.82rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.6);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .assistant-header .header-actions button:hover { 
            background: rgba(255,255,255,0.85); 
            transform: translateY(-2px); 
            box-shadow: 0 4px 15px rgba(59,130,246,0.15); 
        }
        .assistant-header .header-actions .btn-primary { 
            background: var(--accent-gradient); 
            color: white; 
            border: none; 
        }
        .assistant-header .header-actions .btn-primary:hover { 
            transform: translateY(-2px) scale(1.02); 
        }

        /* =========================================================
           USER PROFILE BUTTON
           ========================================================= */
        .user-profile-btn {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            padding: 0.2rem 0.8rem 0.2rem 0.2rem;
            border-radius: 40px;
            background: rgba(255,255,255,0.5);
            border: 1px solid rgba(255,255,255,0.6);
            transition: var(--transition);
        }
        .user-profile-btn:hover { background: rgba(255,255,255,0.85); }
        .user-profile-btn img { width: 34px; height: 34px; border-radius: 50%; object-fit: cover; border: 2px solid #3b82f6; }
        .user-profile-btn .user-info { line-height: 1.2; }
        .user-profile-btn .user-info .name { font-weight: 700; font-size: 0.82rem; color: #0b2a4a; }
        .user-profile-btn .user-info .status { font-size: 0.6rem; color: #3b82f6; display: flex; align-items: center; gap: 4px; }

        /* =========================================================
           CONTEXT BAR
           ========================================================= */
        #contextBar {
            display: flex;
            gap: 1.2rem;
            padding: 0.5rem 1.5rem;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-wrap: wrap;
            font-size: 0.8rem;
            backdrop-filter: blur(8px);
            align-items: center;
        }
        #contextBar .context-item {
            display: flex;
            align-items: center;
            gap: 0.4rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: var(--transition);
            padding: 0.2rem 0.6rem;
            border-radius: 20px;
        }
        #contextBar .context-item:hover {
            background: rgba(59,130,246,0.08);
            color: var(--text-primary);
        }
        #contextBar .context-item .count {
            background: var(--accent);
            color: white;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            font-size: 0.6rem;
            font-weight: 700;
        }
        #contextBar .context-item .count.warning { background: #ef4444; }
        #contextBar .context-item .count.success { background: #22c55e; }

        /* =========================================================
           MEMORY INDICATOR
           ========================================================= */
        #memoryIndicator {
            font-size: 0.7rem;
            color: var(--text-secondary);
            padding: 0.2rem 1rem;
            text-align: center;
            background: var(--bg-card);
            border-bottom: 1px solid rgba(0,0,0,0.04);
        }
        #memoryIndicator i { color: #8b5cf6; }

        /* =========================================================
           LAYOUT
           ========================================================= */
        .assistant-layout {
            display: flex;
            flex: 1;
            height: calc(100vh - 160px);
            overflow: hidden;
            gap: 0;
        }

        /* =========================================================
           SIDEBAR
           ========================================================= */
        .sidebar-history {
            width: 300px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            border-right: 1px solid rgba(0,0,0,0.06);
            display: flex;
            flex-direction: column;
            flex-shrink: 0;
            overflow: hidden;
            transition: width 0.3s ease;
        }
        .sidebar-history .sidebar-header {
            padding: 0.8rem 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0;
        }
        .sidebar-history .sidebar-header h3 { 
            font-size: 0.85rem; 
            color: var(--text-secondary); 
            font-weight: 600; 
        }
        .sidebar-history .sidebar-header button { 
            color: var(--accent); 
            font-size: 0.75rem; 
            font-weight: 600; 
        }
        .sidebar-history .sidebar-header button:hover { color: #2563eb; }

        .sidebar-history .search-conv {
            padding: 0.6rem 1.2rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            flex-shrink: 0;
        }
        .sidebar-history .search-conv input {
            width: 100%;
            padding: 0.5rem 1rem;
            border-radius: 30px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            font-size: 0.8rem;
            outline: none;
            transition: var(--transition);
        }
        .sidebar-history .search-conv input:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.12); 
            background: white; 
        }

        .conversation-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.3rem 0;
        }
        .conv-item {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem 1.2rem;
            cursor: pointer;
            transition: var(--transition);
            border-left: 3px solid transparent;
            border-radius: 0 12px 12px 0;
            margin: 0 0.3rem;
        }
        .conv-item:hover { background: rgba(59,130,246,0.06); }
        .conv-item.active { 
            background: rgba(59,130,246,0.1); 
            border-left-color: var(--accent); 
        }
        .conv-item img { 
            width: 38px; 
            height: 38px; 
            border-radius: 50%; 
            object-fit: cover; 
            background: rgba(255,255,255,0.5); 
        }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-info .conv-name { 
            font-weight: 600; 
            font-size: 0.85rem; 
            color: var(--text-primary); 
            display: flex;
            align-items: center;
            gap: 0.4rem;
        }
        .conv-item .conv-info .conv-name .pin { color: #f59e0b; font-size: 0.6rem; }
        .conv-item .conv-info .conv-preview { 
            font-size: 0.72rem; 
            color: var(--text-secondary); 
            white-space: nowrap; 
            overflow: hidden; 
            text-overflow: ellipsis; 
        }
        .conv-item .conv-time { 
            font-size: 0.6rem; 
            color: var(--text-secondary); 
            flex-shrink: 0; 
        }

        .sidebar-actions {
            padding: 0.5rem 1.2rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            display: flex;
            gap: 0.4rem;
            flex-wrap: wrap;
            flex-shrink: 0;
        }
        .sidebar-actions button {
            padding: 0.3rem 0.8rem;
            border-radius: 20px;
            font-size: 0.7rem;
            font-weight: 600;
            background: rgba(0,0,0,0.04);
            color: var(--text-secondary);
            transition: var(--transition);
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .sidebar-actions button:hover { background: rgba(0,0,0,0.08); }
        .sidebar-actions button.danger { color: #ef4444; }
        .sidebar-actions button.danger:hover { background: rgba(239,68,68,0.08); }

        /* =========================================================
           CHAT PANEL
           ========================================================= */
        .chat-panel {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            min-width: 0;
        }

        .chat-header {
            padding: 0.6rem 1.5rem;
            border-bottom: 1px solid rgba(0,0,0,0.06);
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: rgba(255,255,255,0.3);
            flex-shrink: 0;
            flex-wrap: wrap;
            gap: 0.5rem;
        }
        .chat-header .chat-user { display: flex; align-items: center; gap: 0.8rem; }
        .chat-header .chat-user img { 
            width: 40px; 
            height: 40px; 
            border-radius: 50%; 
            object-fit: cover; 
            border: 2px solid var(--accent); 
        }
        .chat-header .chat-user .chat-user-info .name { 
            font-weight: 700; 
            font-size: 0.95rem; 
            color: var(--text-primary); 
        }
        .chat-header .chat-user .chat-user-info .status { 
            font-size: 0.65rem; 
            color: var(--text-secondary); 
            display: flex; 
            align-items: center; 
            gap: 4px; 
        }
        .chat-header .chat-actions { display: flex; gap: 0.3rem; }
        .chat-header .chat-actions button {
            padding: 0.3rem 0.7rem;
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.3);
            border: 1px solid transparent;
        }
        .chat-header .chat-actions button:hover { 
            background: rgba(255,255,255,0.6); 
            color: var(--text-primary); 
        }

        /* =========================================================
           MESSAGES
           ========================================================= */
        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.2rem;
            display: flex;
            flex-direction: column;
            gap: 0.8rem;
            background: transparent;
        }

        .msg {
            max-width: 75%;
            padding: 0.7rem 1.2rem;
            border-radius: 18px;
            animation: msgIn 0.3s ease;
            word-break: break-word;
            line-height: 1.5;
            font-size: 0.92rem;
            position: relative;
            box-shadow: 0 2px 8px rgba(0,0,0,0.04);
        }
        @keyframes msgIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        .msg.user {
            align-self: flex-end;
            background: var(--accent-gradient);
            color: white;
            border-bottom-right-radius: 4px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.2);
        }
        .msg.ai {
            align-self: flex-start;
            background: var(--bg-card);
            backdrop-filter: blur(4px);
            color: var(--text-primary);
            border-bottom-left-radius: 4px;
            border: 1px solid rgba(0,0,0,0.06);
        }
        [data-theme="dark"] .msg.ai {
            background: rgba(26,36,54,0.9);
            border-color: rgba(255,255,255,0.06);
        }

        .msg .msg-time { 
            font-size: 0.55rem; 
            opacity: 0.5; 
            margin-top: 4px; 
            display: block; 
        }
        .msg .intent-badge {
            font-size: 0.55rem;
            padding: 0.1rem 0.6rem;
            border-radius: 30px;
            background: rgba(59,130,246,0.12);
            color: var(--accent);
            display: inline-block;
            margin-bottom: 4px;
        }
        .msg .msg-actions {
            display: flex;
            gap: 0.4rem;
            margin-top: 0.4rem;
            opacity: 0.5;
            font-size: 0.65rem;
        }
        .msg .msg-actions button {
            color: var(--text-secondary);
            padding: 0.1rem 0.5rem;
            border-radius: 12px;
            background: rgba(255,255,255,0.3);
            transition: var(--transition);
        }
        .msg .msg-actions button:hover { 
            background: rgba(255,255,255,0.7); 
            color: var(--text-primary); 
            opacity: 1;
        }
        .msg .msg-media { margin-top: 0.4rem; border-radius: 12px; overflow: hidden; max-width: 300px; }
        .msg .msg-media img { width: 100%; height: auto; border-radius: 12px; cursor: pointer; }
        .msg .msg-media video { width: 100%; max-height: 300px; border-radius: 12px; }

        .related-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 5px;
            margin-top: 8px;
        }
        .related-chip {
            font-size: 0.7rem;
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            background: white;
            border: 1px solid #dbe4f0;
            color: var(--accent);
            font-weight: 600;
            text-align: left;
            transition: var(--transition);
            cursor: pointer;
        }
        .related-chip:hover { 
            background: #eff6ff; 
            border-color: var(--accent); 
            transform: translateY(-1px);
        }

        /* =========================================================
           SUGGESTIONS PROACTIVES
           ========================================================= */
        .proactive-suggestions {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            padding: 0.3rem 1.5rem 0.6rem;
            border-top: 1px solid rgba(0,0,0,0.04);
            background: var(--bg-card);
        }
        .proactive-suggestions .suggestion-chip {
            padding: 0.3rem 0.8rem;
            border-radius: 30px;
            background: rgba(59,130,246,0.08);
            color: var(--accent);
            font-size: 0.75rem;
            font-weight: 600;
            transition: var(--transition);
            cursor: pointer;
            border: 1px solid transparent;
        }
        .proactive-suggestions .suggestion-chip:hover {
            background: rgba(59,130,246,0.15);
            transform: translateY(-1px);
        }
        .proactive-suggestions .suggestion-chip .badge {
            font-size: 0.55rem;
            background: #ef4444;
            color: white;
            border-radius: 50%;
            padding: 1px 5px;
            margin-left: 4px;
        }

        /* =========================================================
           COMPOSE
           ========================================================= */
        .chat-input-area {
            padding: 0.6rem 1.5rem 1rem;
            border-top: 1px solid rgba(0,0,0,0.06);
            background: var(--bg-card);
            backdrop-filter: blur(8px);
            flex-shrink: 0;
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }
        .chat-input-area .input-row {
            display: flex;
            gap: 0.5rem;
            align-items: flex-end;
        }
        .chat-input-area .input-row .tools {
            display: flex;
            gap: 0.2rem;
            flex-wrap: wrap;
        }
        .chat-input-area .input-row .tools button,
        .chat-input-area .input-row .tools label {
            padding: 0.3rem 0.6rem;
            border-radius: 30px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: var(--transition);
            background: rgba(255,255,255,0.3);
            border: 1px solid transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 3px;
        }
        .chat-input-area .input-row .tools button:hover,
        .chat-input-area .input-row .tools label:hover { 
            background: rgba(255,255,255,0.6); 
            color: var(--text-primary); 
        }
        .chat-input-area .input-row .tools input[type="file"] { display: none; }

        .chat-input-area textarea {
            flex: 1;
            padding: 0.6rem 1rem;
            border-radius: 24px;
            border: 1px solid rgba(0,0,0,0.08);
            background: rgba(255,255,255,0.5);
            color: var(--text-primary);
            font-size: 0.92rem;
            resize: none;
            outline: none;
            transition: var(--transition);
            min-height: 44px;
            max-height: 150px;
            line-height: 1.5;
        }
        .chat-input-area textarea:focus { 
            border-color: var(--accent); 
            box-shadow: 0 0 0 3px rgba(59,130,246,0.1); 
            background: white; 
        }
        .chat-input-area textarea::placeholder { color: var(--text-secondary); }

        .chat-input-area .send-btn {
            padding: 0.6rem 1.6rem;
            border-radius: 30px;
            background: var(--accent-gradient);
            color: white;
            font-weight: 700;
            font-size: 0.9rem;
            transition: var(--transition);
            white-space: nowrap;
            height: 44px;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: 0 4px 15px rgba(59,130,246,0.2);
        }
        .chat-input-area .send-btn:hover { 
            transform: scale(1.02); 
            box-shadow: 0 4px 25px rgba(59,130,246,0.3); 
        }

        /* =========================================================
           TYPOGRAPHY / UTILITIES
           ========================================================= */
        .typing-indicator {
            display: flex;
            gap: 4px;
            padding: 0.4rem 0;
            align-items: center;
            color: var(--text-secondary);
            font-size: 0.82rem;
        }
        .typing-indicator span {
            width: 8px;
            height: 8px;
            background: var(--accent);
            border-radius: 50%;
            animation: typingBounce 1.4s infinite;
        }
        .typing-indicator span:nth-child(2) { animation-delay: 0.2s; }
        .typing-indicator span:nth-child(3) { animation-delay: 0.4s; }
        @keyframes typingBounce {
            0%, 60%, 100% { transform: translateY(0); opacity: 0.4; }
            30% { transform: translateY(-8px); opacity: 1; }
        }

        /* =========================================================
           RESPONSIVE
           ========================================================= */
        @media (max-width: 900px) {
            .sidebar-history { width: 240px; }
        }
        @media (max-width: 768px) {
            .assistant-layout { flex-direction: column; height: auto; }
            .sidebar-history { 
                width: 100%; 
                height: 220px; 
                border-right: none; 
                border-bottom: 1px solid rgba(0,0,0,0.06); 
            }
            .chat-panel { height: calc(100vh - 280px); }
            .assistant-header { padding: 0.5rem 1rem; }
            .assistant-header .logo-area h1 { font-size: 1rem; }
            #contextBar { padding: 0.3rem 1rem; gap: 0.6rem; font-size: 0.7rem; }
            .msg { max-width: 90%; }
            .chat-input-area .input-row { flex-wrap: wrap; }
            .chat-input-area .input-row .tools { order: 2; width: 100%; justify-content: center; }
            .chat-input-area textarea { order: 1; width: 100%; }
            .chat-input-area .send-btn { order: 3; width: 100%; justify-content: center; }
        }
        @media (max-width: 480px) {
            .assistant-header .header-actions button span { display: none; }
            .sidebar-history { height: 180px; }
            .chat-panel { height: calc(100vh - 240px); }
            .conv-item { padding: 0.5rem 0.8rem; }
            .chat-messages { padding: 0.8rem; }
            .chat-header { padding: 0.4rem 0.8rem; }
            .chat-input-area { padding: 0.4rem 0.8rem 0.8rem; }
            #contextBar { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
            .proactive-suggestions .suggestion-chip { font-size: 0.65rem; padding: 0.2rem 0.6rem; }
        }

        /* =========================================================
           MODALS / OVERLAYS
           ========================================================= */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0,20,40,0.5);
            backdrop-filter: blur(8px);
            z-index: 999;
            justify-content: center;
            align-items: center;
            padding: 1.5rem;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-card);
            backdrop-filter: blur(16px);
            border-radius: 28px;
            padding: 2rem;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            border: 1px solid rgba(255,255,255,0.6);
            box-shadow: 0 30px 80px rgba(0,0,0,0.1);
        }
        .modal-content h2 { font-size: 1.3rem; margin-bottom: 1.2rem; display: flex; align-items: center; gap: 0.6rem; color: var(--text-primary); }
        .modal-content .form-group { margin-bottom: 1rem; }

        .modal-actions button {
            padding: 0.5rem 1.6rem;
            border-radius: 30px;
            font-weight: 700;
            transition: var(--transition);
        }
        .modal-actions .btn-secondary { background: rgba(0,0,0,0.04); color: var(--text-primary); border: 1px solid rgba(0,0,0,0.08); }
        .modal-actions .btn-secondary:hover { background: rgba(0,0,0,0.08); }
        .modal-actions .btn-primary { background: var(--accent-gradient); color: white; }
        .modal-actions .btn-primary:hover { transform: scale(1.02); }

        /* EMOJI PANEL */
        .emoji-panel {
            display: none;
            position: absolute;
            bottom: 70px;
            left: 20px;
            width: min(400px, calc(100vw - 40px));
            max-height: 340px;
            overflow: hidden;
            background: var(--bg-card);
            border: 1px solid rgba(0,0,0,0.08);
            border-radius: 18px;
            box-shadow: 0 20px 60px rgba(7,21,43,0.2);
            z-index: 300;
            padding: 10px;
        }
        .emoji-panel.active { display: block; }
        .emoji-toolbar { display: flex; gap: 6px; align-items: center; margin-bottom: 8px; }
        .emoji-search { flex: 1; border: 1px solid rgba(0,0,0,0.08); border-radius: 12px; padding: 8px 12px; outline: none; font-size: 0.8rem; }
        .emoji-tabs { display: flex; gap: 4px; overflow: auto; padding-bottom: 6px; }
        .emoji-tabs button { flex: 0 0 auto; padding: 5px 8px; border-radius: 8px; background: rgba(0,0,0,0.04); font-size: 16px; transition: var(--transition); }
        .emoji-tabs button:hover { background: rgba(59,130,246,0.1); }
        .emoji-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 2px; overflow: auto; max-height: 250px; }
        .emoji-grid button { font-size: 22px; padding: 5px 0; border-radius: 8px; transition: var(--transition); }
        .emoji-grid button:hover { background: rgba(59,130,246,0.1); }

        /* TOAST */
        .toast-container {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 9999;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 6px;
            pointer-events: none;
        }
        .toast-item {
            padding: 0.6rem 1.6rem;
            border-radius: 14px;
            background: var(--bg-card);
            backdrop-filter: blur(12px);
            color: var(--text-primary);
            font-weight: 600;
            font-size: 0.85rem;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
            border: 1px solid rgba(255,255,255,0.3);
            animation: toastIn 0.4s ease;
            pointer-events: auto;
            max-width: 90%;
        }
        .toast-item.success { border-left: 4px solid #22c55e; }
        .toast-item.warning { border-left: 4px solid #f59e0b; }
        .toast-item.error { border-left: 4px solid #ef4444; }
        .toast-item.info { border-left: 4px solid var(--accent); }
        @keyframes toastIn {
            from { opacity: 0; transform: translateY(20px) scale(0.95); }
            to { opacity: 1; transform: translateY(0) scale(1); }
        }

        /* RECORDING */
        .recording {
            animation: recordPulse 1s infinite;
            color: #ef4444 !important;
            background: #fff1f2 !important;
        }
        @keyframes recordPulse {
            50% { transform: scale(1.06); box-shadow: 0 0 0 6px rgba(239,68,68,0.12); }
        }
    </style>

    <script>
        (function() {
            'use strict';

            // =========================================================
            // CONFIGURATION
            // =========================================================
            const API_BASE = window.location.origin + '/api';
            let currentUser = null;
            let conversations = [];
            let currentConvId = null;
            let currentLang = 'fr';
            let contextData = null;
            let memoryData = null;
            let isProcessing = false;

            // =========================================================
            // 1. BASE DE CONNAISSANCES COMPLÈTE (200+ entrées)
            //    Intégrée directement — pas d'appel externe
            // =========================================================
            const KNOWLEDGE_BASE = [
                // ===================== COMPTE / INSCRIPTION =====================
                { id: 'kb001', cat: 'compte', kw: ['créer', 'compte', 'inscription', 'inscrire'], q: 'Comment créer un compte ?', a: "Cliquez sur \"S'inscrire\" depuis la page d'accueil, choisissez votre profil (client, vendeur, livreur ou affilié), puis renseignez vos informations. Vous recevrez un code de vérification par email ou SMS." },
                { id: 'kb002', cat: 'compte', kw: ['mot de passe', 'oublié', 'réinitialiser'], q: 'J\'ai oublié mon mot de passe', a: 'Cliquez sur "Mot de passe oublié" depuis la page de connexion, saisissez votre email, téléphone ou pseudo. Vous recevrez un code par email (valable 48h) ou SMS pour en choisir un nouveau.' },
                { id: 'kb003', cat: 'compte', kw: ['modifier', 'nom', 'prénom'], q: 'Comment modifier mon nom ?', a: 'Depuis votre Section Profil, vous pouvez modifier votre nom et prénom. Ce champ ne peut être modifié qu\'une fois tous les 30 jours pour éviter les usurpations.' },
                { id: 'kb004', cat: 'compte', kw: ['pseudo', 'pseudonyme', 'changer'], q: 'Comment changer mon pseudonyme ?', a: 'Votre pseudonyme est modifiable une fois tous les 14 jours depuis votre Section Profil. Il doit être unique et contenir 3 à 24 caractères.' },
                { id: 'kb005', cat: 'compte', kw: ['téléphone', 'numéro', 'changer', 'modifier'], q: 'Comment changer mon numéro de téléphone ?', a: 'Vous pouvez modifier votre numéro tous les 3 jours depuis votre Section Profil. Le nouveau numéro devra être revalidé par SMS.' },
                { id: 'kb006', cat: 'compte', kw: ['email', 'adresse', 'changer'], q: 'Comment changer mon adresse email ?', a: 'Cliquez sur "Modifier" à côté de votre email dans la Section Profil, saisissez la nouvelle adresse, puis confirmez avec le code envoyé à cette NOUVELLE adresse (pas l\'ancienne). Modifiable une fois tous les 30 jours.' },
                { id: 'kb007', cat: 'compte', kw: ['valider', 'vérifier', 'numéro', 'sms'], q: 'Comment valider mon numéro de téléphone ?', a: 'Dans votre Section Profil, cliquez sur "Valider" à côté de votre numéro. Vous recevrez un code par SMS à saisir pour confirmer.' },
                { id: 'kb008', cat: 'compte', kw: ['supprimer', 'compte', 'fermer'], q: 'Comment supprimer mon compte ?', a: 'Depuis Paramètres > Gestion du compte, vous trouverez l\'option de suppression. Attention, cette action est irréversible et supprime toutes vos données.' },
                { id: 'kb009', cat: 'compte', kw: ['connexion', 'google', 'facebook'], q: 'Puis-je me connecter avec Google ou Facebook ?', a: 'Oui, les boutons "Continuer avec Google" et "Continuer avec Facebook" sont disponibles sur la page de connexion. Votre compte SINE.SHOP est créé ou relié automatiquement.' },
                { id: 'kb010', cat: 'compte', kw: ['langue', 'changer', 'français', 'anglais'], q: 'Comment changer la langue de l\'application ?', a: 'SINE.SHOP détecte automatiquement la langue de votre appareil (français, anglais, espagnol, arabe). Vous pouvez aussi la changer manuellement dans Paramètres.' },
                { id: 'kb011', cat: 'compte', kw: ['devise', 'monnaie', 'fcfa', 'euro'], q: 'Comment changer la devise affichée ?', a: 'La devise s\'adapte automatiquement à votre pays. Vous pouvez la modifier manuellement dans Paramètres si besoin.' },
                { id: 'kb012', cat: 'compte', kw: ['plusieurs', 'rôles', 'vendeur', 'client', 'basculer'], q: 'Puis-je avoir plusieurs rôles (client et vendeur) ?', a: 'Oui, vous pouvez ajouter un rôle vendeur, livreur ou affilié à votre compte client existant, et basculer entre eux depuis Paramètres > Mes rôles.' },
                { id: 'kb013', cat: 'compte', kw: ['visibilité', 'profil', 'public', 'privé'], q: 'Qui peut voir mes informations de profil ?', a: 'Dans Section Profil > Visibilité de mon profil, vous choisissez ce que les vendeurs/livreurs avec qui vous échangez peuvent voir (nom, photo, ville, téléphone, bio, réseaux sociaux).' },
                { id: 'kb014', cat: 'compte', kw: ['code confidentialité', 'sécurité', 'admin'], q: 'Qu\'est-ce que le code de confidentialité ?', a: 'Réservé aux comptes à privilèges (admin, modérateur, support), ce code additionnel au mot de passe protège l\'accès aux fonctions sensibles.' },
                { id: 'kb015', cat: 'compte', kw: ['session', 'déconnecter', 'tous', 'appareils'], q: 'Comment me déconnecter de tous mes appareils ?', a: 'Depuis Paramètres, le bouton "Déconnecter tous les appareils" met fin à toutes vos sessions actives immédiatement.' },

                // ===================== COMMANDES =====================
                { id: 'kb020', cat: 'commande', kw: ['passer', 'commande', 'comment', 'acheter'], q: 'Comment passer une commande ?', a: 'Ajoutez les articles souhaités à votre panier, cliquez sur "Passer la commande", vérifiez votre adresse de livraison, choisissez le mode de paiement puis validez.' },
                { id: 'kb021', cat: 'commande', kw: ['suivre', 'suivi', 'commande', 'statut'], q: 'Comment suivre ma commande ?', a: 'Rendez-vous dans votre Section Commandes, cliquez sur la commande concernée pour voir son statut en temps réel et suivre le livreur sur la carte une fois expédiée.' },
                { id: 'kb022', cat: 'commande', kw: ['annuler', 'commande'], q: 'Comment annuler une commande ?', a: 'Tant que votre commande est encore "en attente" ou "confirmée", vous pouvez l\'annuler depuis sa page de détail. Une fois expédiée, contactez le vendeur ou le support.' },
                { id: 'kb023', cat: 'commande', kw: ['plusieurs', 'vendeurs', 'même', 'commande'], q: 'Puis-je commander chez plusieurs vendeurs en même temps ?', a: 'Oui ! Ajoutez des articles de différents vendeurs à votre panier, une seule commande groupée est créée (une sous-commande par vendeur), avec un seul paiement.' },
                { id: 'kb024', cat: 'commande', kw: ['statut', 'signification', 'en attente', 'confirmée'], q: 'Que signifient les statuts de commande ?', a: '"En attente" : commande créée, paiement pas encore confirmé. "Confirmée" : paiement validé. "En préparation" : le vendeur prépare le colis. "Expédiée" : le livreur l\'a récupérée. "Livrée" : reçue par vous.' },
                { id: 'kb025', cat: 'commande', kw: ['facture', 'reçu', 'télécharger'], q: 'Comment obtenir ma facture ?', a: 'Depuis le détail de votre commande, cliquez sur "Facture" pour l\'imprimer, la télécharger ou la partager directement.' },
                { id: 'kb026', cat: 'commande', kw: ['modifier', 'adresse', 'livraison', 'commande'], q: 'Puis-je modifier l\'adresse de livraison après commande ?', a: 'Tant que la commande n\'est pas expédiée, contactez le vendeur via la messagerie pour lui demander la modification.' },
                { id: 'kb027', cat: 'commande', kw: ['délai', 'temps', 'livraison', 'combien'], q: 'Quel est le délai de livraison ?', a: 'Le délai varie selon le vendeur et votre localisation, généralement entre 24h et 72h en zone urbaine. Le délai estimé est affiché avant validation de la commande.' },
                { id: 'kb028', cat: 'commande', kw: ['historique', 'anciennes', 'commandes'], q: 'Où voir mes anciennes commandes ?', a: 'Toutes vos commandes passées sont dans votre Section Commandes, avec filtre par statut et recherche.' },
                { id: 'kb029', cat: 'commande', kw: ['problème', 'article', 'manquant', 'endommagé'], q: 'Un article est manquant ou endommagé', a: 'Contactez immédiatement le vendeur via la messagerie avec des photos si possible. Si le problème persiste, ouvrez un ticket support ou un litige depuis la commande.' },
                { id: 'kb030', cat: 'commande', kw: ['minimum', 'commande', 'montant'], q: 'Y a-t-il un montant minimum de commande ?', a: 'Non, il n\'y a pas de montant minimum général sur SINE.SHOP, sauf indication contraire d\'un vendeur spécifique.' },

                // ===================== PAIEMENT =====================
                { id: 'kb040', cat: 'paiement', kw: ['modes', 'paiement', 'moyens', 'accepté'], q: 'Quels moyens de paiement sont acceptés ?', a: 'Mobile Money (MTN, Orange, Wave), carte bancaire (Visa/Mastercard) via CinetPay, et le paiement à la livraison selon le vendeur.' },
                { id: 'kb041', cat: 'paiement', kw: ['sécurisé', 'paiement', 'sécurité'], q: 'Le paiement est-il sécurisé ?', a: 'Oui, tous les paiements passent par CinetPay, une passerelle sécurisée et certifiée. SINE.SHOP ne stocke jamais vos données bancaires.' },
                { id: 'kb042', cat: 'paiement', kw: ['échec', 'paiement', 'refusé', 'raté'], q: 'Mon paiement a échoué, que faire ?', a: 'Vérifiez votre solde et réessayez. Si le problème persiste, contactez votre opérateur Mobile Money ou votre banque, ou tentez un autre mode de paiement.' },
                { id: 'kb043', cat: 'paiement', kw: ['remboursement', 'rembourser', 'délai'], q: 'Comment et quand suis-je remboursé ?', a: 'En cas d\'annulation ou de litige validé, le remboursement est traité sous 3 à 7 jours ouvrés sur le moyen de paiement d\'origine.' },
                { id: 'kb044', cat: 'paiement', kw: ['paiement', 'livraison', 'espèces', 'cash'], q: 'Puis-je payer à la livraison ?', a: 'Certains vendeurs proposent le paiement à la livraison (cash on delivery) — vérifiez l\'option lors du paiement.' },
                { id: 'kb045', cat: 'paiement', kw: ['reçu', 'paiement', 'preuve'], q: 'Où trouver mon reçu de paiement ?', a: 'Le reçu est disponible depuis le détail de votre commande, section "Paiement", ou peut être envoyé directement dans une conversation.' },
                { id: 'kb046', cat: 'paiement', kw: ['double', 'débit', 'deux fois'], q: 'J\'ai été débité deux fois', a: 'Contactez immédiatement le support avec vos références de transaction — nous vérifierons et rembourserons le doublon sous 48h.' },

                // ===================== LIVRAISON =====================
                { id: 'kb050', cat: 'livraison', kw: ['frais', 'livraison', 'coût', 'prix'], q: 'Combien coûte la livraison ?', a: 'Les frais de livraison sont calculés selon la distance et affichés avant validation de votre commande, généralement entre 500 et 2000 FCFA.' },
                { id: 'kb051', cat: 'livraison', kw: ['zone', 'couverte', 'livre', 'où'], q: 'Quelles zones sont couvertes ?', a: 'SINE.SHOP livre dans les principales villes de Côte d\'Ivoire et s\'étend progressivement à d\'autres pays. La disponibilité s\'affiche selon votre adresse.' },
                { id: 'kb052', cat: 'livraison', kw: ['contacter', 'livreur', 'joindre'], q: 'Comment contacter mon livreur ?', a: 'Une fois votre commande expédiée, vous pouvez échanger directement avec le livreur via la messagerie intégrée ou l\'appeler.' },
                { id: 'kb053', cat: 'livraison', kw: ['suivre', 'carte', 'temps réel', 'position'], q: 'Puis-je suivre le livreur en temps réel ?', a: 'Oui, une fois la commande expédiée, sa position s\'affiche en direct sur la carte dans la page de suivi.' },
                { id: 'kb054', cat: 'livraison', kw: ['absent', 'personne', 'livraison'], q: 'Je suis absent au moment de la livraison', a: 'Contactez le livreur via la messagerie pour convenir d\'un autre créneau ou d\'un point de dépôt alternatif.' },

                // ===================== RÉSERVATION =====================
                { id: 'kb060', cat: 'reservation', kw: ['réserver', 'réservation', 'comment'], q: 'Comment réserver un article ?', a: 'Sur la fiche produit, cliquez sur "Réserver" puis choisissez vos dates. La réservation est valable 72 heures — pensez à la transformer en commande avant expiration.' },
                { id: 'kb061', cat: 'reservation', kw: ['expire', 'réservation', 'durée'], q: 'Combien de temps dure une réservation ?', a: 'Une réservation reste active 72 heures. Passé ce délai, elle expire automatiquement et l\'article redevient disponible pour d\'autres clients.' },
                { id: 'kb062', cat: 'reservation', kw: ['annuler', 'réservation'], q: 'Comment annuler une réservation ?', a: 'Depuis votre Section Réservations, cliquez sur la réservation concernée puis "Annuler".' },
                { id: 'kb063', cat: 'reservation', kw: ['transformer', 'commande', 'réservation'], q: 'Comment transformer ma réservation en commande ?', a: 'Cliquez sur "Commander" depuis votre réservation active — les articles sont ajoutés à votre panier automatiquement.' },

                // ===================== FAVORIS / PRODUITS =====================
                { id: 'kb070', cat: 'produit', kw: ['favoris', 'ajouter', 'coeur'], q: 'Comment ajouter un produit en favoris ?', a: 'Cliquez sur l\'icône cœur sur n\'importe quelle fiche produit ou carte produit — il apparaîtra dans votre Section Favoris.' },
                { id: 'kb071', cat: 'produit', kw: ['rechercher', 'produit', 'trouver'], q: 'Comment rechercher un produit ?', a: 'Utilisez la barre de recherche en haut de l\'écran, ou parcourez les catégories depuis le menu principal.' },
                { id: 'kb072', cat: 'produit', kw: ['comparer', 'produits'], q: 'Puis-je comparer plusieurs produits ?', a: 'Oui, la fonction comparaison vous permet de mettre côte à côte plusieurs produits similaires (prix, caractéristiques, avis).' },
                { id: 'kb073', cat: 'produit', kw: ['avis', 'note', 'évaluer'], q: 'Comment laisser un avis sur un produit ?', a: 'Une fois votre commande livrée, rendez-vous sur la fiche produit ou votre commande pour laisser une note et un commentaire.' },
                { id: 'kb074', cat: 'produit', kw: ['vendeur', 'vérifié', 'badge'], q: 'Que signifie le badge "vendeur vérifié" ?', a: 'Ce badge indique que le vendeur a complété la vérification de son identité et de sa boutique par notre équipe.' },

                // ===================== MESSAGERIE =====================
                { id: 'kb080', cat: 'messagerie', kw: ['contacter', 'vendeur', 'message'], q: 'Comment contacter un vendeur ?', a: 'Depuis la fiche produit ou le profil du vendeur, cliquez sur "Message" pour ouvrir une conversation directement.' },
                { id: 'kb081', cat: 'messagerie', kw: ['bloquer', 'utilisateur', 'messagerie'], q: 'Comment bloquer quelqu\'un dans la messagerie ?', a: 'Ouvrez la conversation, cliquez sur le menu "⋮" puis "Bloquer" — vous ne recevrez plus de messages de cette personne.' },
                { id: 'kb082', cat: 'messagerie', kw: ['appel', 'vocal', 'vidéo', 'messagerie'], q: 'Puis-je appeler un vendeur depuis l\'application ?', a: 'Oui, la messagerie intègre les appels vocaux et vidéo directement, sans avoir besoin du numéro de téléphone.' },
                { id: 'kb083', cat: 'messagerie', kw: ['archiver', 'conversation'], q: 'Comment archiver une conversation ?', a: 'Ouvrez le menu "⋮" de la conversation puis "Archiver" — retrouvez-la ensuite dans la section Archives.' },
                { id: 'kb084', cat: 'messagerie', kw: ['modifier', 'message', 'envoyé'], q: 'Puis-je modifier un message déjà envoyé ?', a: 'Oui, dans les 10 minutes suivant l\'envoi, cliquez sur le crayon à côté du message pour le modifier.' },

                // ===================== VENDEUR — PRODUITS =====================
                { id: 'kb100', cat: 'vendeur', kw: ['publier', 'produit', 'ajouter', 'vendre'], q: 'Comment publier un produit ?', a: 'Depuis Section Publier, renseignez le nom, la catégorie, le prix, les photos/vidéos et les caractéristiques, puis cliquez sur "Publier".' },
                { id: 'kb101', cat: 'vendeur', kw: ['modifier', 'produit', 'fiche'], q: 'Comment modifier une fiche produit ?', a: 'Depuis Section Produits, cliquez sur le produit concerné puis "Modifier". Notez qu\'un produit déjà réservé ou commandé ne peut pas être modifié tant que la transaction n\'est pas terminée.' },
                { id: 'kb102', cat: 'vendeur', kw: ['supprimer', 'produit'], q: 'Comment supprimer un produit ?', a: 'Depuis la fiche produit dans votre espace, cliquez sur "Supprimer". Un produit réservé ou en commande active ne peut pas être supprimé.' },
                { id: 'kb103', cat: 'vendeur', kw: ['photos', 'vidéos', 'combien'], q: 'Combien de photos/vidéos puis-je ajouter par produit ?', a: 'Vous pouvez ajouter plusieurs photos et une vidéo par produit pour donner un maximum de visibilité à vos articles.' },
                { id: 'kb104', cat: 'vendeur', kw: ['catégorie', 'personnalisée', 'créer'], q: 'Puis-je créer ma propre catégorie ?', a: 'Oui, si aucune catégorie existante ne correspond, utilisez le bouton "➕" à côté du sélecteur de catégorie pour en créer une.' },
                { id: 'kb105', cat: 'vendeur', kw: ['stock', 'gérer', 'quantité'], q: 'Comment gérer mon stock ?', a: 'Indiquez la quantité disponible à la publication — elle se met à jour automatiquement à chaque vente. Vous pouvez l\'ajuster manuellement à tout moment.' },
                { id: 'kb106', cat: 'vendeur', kw: ['taille', 'pointure', 'plusieurs'], q: 'Comment proposer plusieurs tailles/pointures ?', a: 'Lors de la publication, activez la sélection multiple pour cocher toutes les tailles ou pointures disponibles pour cet article.' },
                { id: 'kb107', cat: 'vendeur', kw: ['prévisualiser', 'aperçu', 'avant', 'publier'], q: 'Puis-je prévisualiser mon annonce avant publication ?', a: 'Oui, le bouton "Prévisualiser" affiche exactement le rendu final tel que les acheteurs le verront.' },
                { id: 'kb108', cat: 'vendeur', kw: ['brouillon', 'enregistrer', 'plus tard'], q: 'Puis-je enregistrer un brouillon ?', a: 'Oui, le bouton "Enregistrer comme brouillon" garde votre fiche produit pour la finaliser plus tard sans la publier.' },

                // ===================== VENDEUR — VENTES / STATS / RETRAIT =====================
                { id: 'kb120', cat: 'vendeur_ventes', kw: ['commandes', 'reçues', 'voir'], q: 'Comment voir mes commandes reçues ?', a: 'Votre Section Commandes liste toutes les commandes reçues, avec leur statut, et vous permet de les faire avancer (préparation, expédition).' },
                { id: 'kb121', cat: 'vendeur_ventes', kw: ['solde', 'gains', 'argent', 'combien'], q: 'Comment voir mon solde disponible ?', a: 'Votre solde (issu des ventes livrées et payées) est visible dans votre tableau de bord et la section Retraits.' },
                { id: 'kb122', cat: 'vendeur_ventes', kw: ['retirer', 'retrait', 'argent'], q: 'Comment retirer mon argent ?', a: 'Depuis Section Retraits, indiquez le montant et votre moyen (Mobile Money, virement), puis validez. Un administrateur traite votre demande sous quelques jours.' },
                { id: 'kb123', cat: 'vendeur_ventes', kw: ['commission', 'pourcentage', 'combien', 'prend'], q: 'Quelle commission prend SINE.SHOP ?', a: 'SINE.SHOP prélève une commission de 5% sur chaque vente, déjà déduite automatiquement de votre solde disponible.' },
                { id: 'kb124', cat: 'vendeur_ventes', kw: ['favoris', 'reçus', 'combien'], q: 'Comment savoir quels produits sont mis en favoris ?', a: 'Votre tableau de bord affiche un compteur de favoris par produit, pour repérer ceux qui suscitent le plus d\'intérêt.' },
                { id: 'kb125', cat: 'vendeur_ventes', kw: ['note', 'avis', 'clients'], q: 'Comment voir mes avis clients ?', a: 'Vos avis et notes sont visibles sur votre profil boutique public et résumés dans votre tableau de bord.' },
                { id: 'kb126', cat: 'vendeur_ventes', kw: ['litige', 'conflit', 'client'], q: 'Un client a ouvert un litige, que faire ?', a: 'Consultez le détail du litige depuis votre espace, répondez avec des preuves si besoin. Un modérateur tranchera si aucun accord n\'est trouvé.' },
                { id: 'kb127', cat: 'vendeur_ventes', kw: ['boutique', 'vérifiée', 'validation'], q: 'Comment faire vérifier ma boutique ?', a: 'Complétez votre profil vendeur (pièce d\'identité, justificatifs) — notre équipe valide sous quelques jours et vous obtenez le badge "Vérifié".' },

                // ===================== VENDEUR — CONSEILS / DÉCISIONS =====================
                { id: 'kb140', cat: 'vendeur_conseil', kw: ['prix', 'fixer', 'comment', 'combien'], q: 'Comment fixer le bon prix pour mon produit ?', a: 'Comparez avec des produits similaires sur la plateforme, tenez compte de vos coûts + commission (5%) + marge souhaitée. Un prix trop élevé réduit les vues, trop bas nuit à votre marge.' },
                { id: 'kb141', cat: 'vendeur_conseil', kw: ['vendre', 'plus', 'astuces', 'améliorer'], q: 'Comment vendre plus sur SINE.SHOP ?', a: 'Ajoutez des photos de qualité et une vidéo, rédigez une description claire et complète, répondez vite aux messages, maintenez un bon stock, et encouragez vos clients satisfaits à laisser un avis.' },
                { id: 'kb142', cat: 'vendeur_conseil', kw: ['promotion', 'campagne', 'lancer'], q: 'Comment lancer une promotion ?', a: 'Ajustez temporairement le prix de vos produits phares, et mentionnez-le dans votre description. Les baisses de prix remontent naturellement dans les recommandations des clients qui ont ce produit en favoris.' },
                { id: 'kb143', cat: 'vendeur_conseil', kw: ['visibilité', 'produit', 'améliorer', 'vues'], q: 'Comment améliorer la visibilité de mes produits ?', a: 'Utilisez des mots-clés précis dans le titre, remplissez toutes les caractéristiques, publiez régulièrement de nouveaux articles, et gardez un excellent taux de réponse en messagerie.' },
                { id: 'kb144', cat: 'vendeur_conseil', kw: ['stock', 'faible', 'décision', 'réapprovisionner'], q: 'Mon stock est bas, que faire ?', a: 'Surveillez vos ventes régulières et réapprovisionnez avant la rupture — un produit "en rupture" perd en visibilité et en confiance auprès des acheteurs.' },
                { id: 'kb145', cat: 'vendeur_conseil', kw: ['produit', 'ne', 'vend', 'pas'], q: 'Mon produit ne se vend pas, que faire ?', a: 'Vérifiez le prix par rapport à la concurrence, améliorez les photos/description, et envisagez une petite baisse de prix temporaire pour relancer l\'intérêt.' },
                { id: 'kb146', cat: 'vendeur_conseil', kw: ['description', 'rédiger', 'produit'], q: 'Comment rédiger une bonne description ?', a: 'Soyez précis (matière, dimensions, état), mettez en avant les bénéfices concrets pour l\'acheteur, et anticipez les questions fréquentes directement dans le texte.' },

                // ===================== LIVREUR =====================
                { id: 'kb160', cat: 'livreur', kw: ['devenir', 'livreur', 'inscrire'], q: 'Comment devenir livreur ?', a: 'Inscrivez-vous via "Devenir livreur", renseignez votre véhicule et votre zone, puis complétez la vérification d\'identité.' },
                { id: 'kb161', cat: 'livreur', kw: ['disponibilité', 'disponible', 'changer'], q: 'Comment changer ma disponibilité ?', a: 'Le bouton Disponible/Indisponible sur votre tableau de bord détermine si vous recevez de nouvelles missions.' },
                { id: 'kb162', cat: 'livreur', kw: ['mission', 'livraison', 'accepter'], q: 'Comment accepter une mission de livraison ?', a: 'Une notification vous prévient d\'une nouvelle livraison à prendre en charge, avec l\'adresse du vendeur (retrait) et du client (livraison).' },
                { id: 'kb163', cat: 'livreur', kw: ['plusieurs', 'vendeurs', 'commande', 'groupée'], q: 'Un client a commandé chez plusieurs vendeurs, comment faire ?', a: 'Vous verrez un avertissement "commande groupée" avec la liste des autres retraits à effectuer chez d\'autres vendeurs avant de tout assembler pour une livraison unique au client.' },
                { id: 'kb164', cat: 'livreur', kw: ['zone', 'livraison', 'définir'], q: 'Comment définir ma zone de livraison ?', a: 'Depuis votre profil, indiquez votre ville et le rayon d\'action dans lequel vous acceptez les missions.' },
                { id: 'kb165', cat: 'livreur', kw: ['gains', 'combien', 'gagner'], q: 'Comment sont calculés mes gains ?', a: 'Vous percevez les frais de livraison de chaque commande effectuée, visibles dans votre section Gains, avec un historique détaillé.' },
                { id: 'kb166', cat: 'livreur', kw: ['retirer', 'argent', 'retrait', 'livreur'], q: 'Comment retirer mes gains de livreur ?', a: 'Depuis votre section Retraits, indiquez le montant et votre moyen de paiement préféré (Mobile Money).' },
                { id: 'kb167', cat: 'livreur', kw: ['client', 'absent', 'que faire'], q: 'Le client est absent, que faire ?', a: 'Contactez-le via la messagerie intégrée. Si injoignable après un délai raisonnable, signalez le problème depuis la commande.' },
                { id: 'kb168', cat: 'livreur', kw: ['véhicule', 'changer', 'type'], q: 'Comment changer mon type de véhicule ?', a: 'Modifiable depuis votre Section Profil > informations véhicule.' },

                // ===================== AFFILIATION =====================
                { id: 'kb180', cat: 'affiliation', kw: ['affiliation', 'devenir', 'programme'], q: 'Comment devenir affilié ?', a: 'Inscrivez-vous via "Programme d\'affiliation", vous recevrez un code personnel à partager pour gagner des commissions sur les inscriptions et achats de vos filleuls.' },
                { id: 'kb181', cat: 'affiliation', kw: ['code', 'affiliation', 'où', 'trouver'], q: 'Où trouver mon code d\'affiliation ?', a: 'Votre code personnel est affiché sur votre tableau de bord affilié, avec un lien de partage prêt à l\'emploi.' },
                { id: 'kb182', cat: 'affiliation', kw: ['commission', 'affiliation', 'combien'], q: 'Combien puis-je gagner en affiliation ?', a: 'Vous gagnez une commission sur chaque achat effectué par vos filleuls, ainsi qu\'un bonus pouvant aller jusqu\'à 500$ par nouvelle inscription selon les conditions en vigueur.' },
                { id: 'kb183', cat: 'affiliation', kw: ['retirer', 'gains', 'affiliation'], q: 'Comment retirer mes gains d\'affiliation ?', a: 'Depuis votre tableau de bord affilié, section Retraits, indiquez le montant et votre moyen de paiement.' },
                { id: 'kb184', cat: 'affiliation', kw: ['filleuls', 'voir', 'liste'], q: 'Comment voir mes filleuls ?', a: 'Votre tableau de bord liste tous vos filleuls inscrits avec leur activité et les commissions générées.' },

                // ===================== SÉCURITÉ / CONFIDENTIALITÉ =====================
                { id: 'kb200', cat: 'securite', kw: ['données', 'personnelles', 'protection'], q: 'Comment sont protégées mes données ?', a: 'SINE.SHOP applique des mesures de sécurité strictes (chiffrement, accès restreint) et ne partage jamais vos données sans votre consentement. Consultez notre politique de confidentialité.' },
                { id: 'kb201', cat: 'securite', kw: ['compte', 'piraté', 'suspect', 'connexion'], q: 'Je pense que mon compte a été piraté', a: 'Changez immédiatement votre mot de passe, vérifiez vos sessions actives et déconnectez tous les appareils depuis Paramètres, puis contactez le support.' },
                { id: 'kb202', cat: 'securite', kw: ['arnaque', 'signaler', 'vendeur', 'suspect'], q: 'Comment signaler un vendeur suspect ?', a: 'Depuis sa fiche produit ou son profil, utilisez le bouton "Signaler" — notre équipe de modération examine chaque signalement rapidement.' },
                { id: 'kb203', cat: 'securite', kw: ['code', 'confidentiel', 'partager'], q: 'Dois-je partager mon code de vérification ?', a: 'Non, JAMAIS. Aucun membre de l\'équipe SINE.SHOP ne vous demandera votre code — s\'il vous est demandé, c\'est une tentative de fraude.' },

                // ===================== GÉNÉRAL SINE.SHOP =====================
                { id: 'kb220', cat: 'general', kw: ['sine.shop', 'qu\'est-ce', 'plateforme'], q: 'Qu\'est-ce que SINE.SHOP ?', a: 'SINE.SHOP est une marketplace complète qui connecte clients, vendeurs et livreurs — achat, vente, réservation, livraison et messagerie, le tout dans une seule application.' },
                { id: 'kb221', cat: 'general', kw: ['contact', 'support', 'aide', 'joindre'], q: 'Comment contacter le support ?', a: 'Écrivez à support@sineshophome.com ou ouvrez un ticket depuis votre espace. Notre équipe répond généralement sous 24 à 48h.' },
                { id: 'kb222', cat: 'general', kw: ['réseaux', 'sociaux', 'suivre'], q: 'Sur quels réseaux sociaux suivre SINE.SHOP ?', a: 'Retrouvez-nous sur Instagram, Facebook, TikTok, WhatsApp et X — liens disponibles en bas de chaque page.' },
                { id: 'kb223', cat: 'general', kw: ['application', 'mobile', 'télécharger'], q: 'Y a-t-il une application mobile ?', a: 'Oui, une bannière propose d\'ouvrir l\'application mobile SINE.SHOP si elle est installée, sinon elle vous redirige vers le store correspondant.' },
                { id: 'kb224', cat: 'general', kw: ['merci', 'bonjour', 'salut'], q: 'Salutations', a: 'Bonjour ! Je suis l\'assistant SINE.SHOP, ravi de vous aider. Posez-moi vos questions sur vos commandes, vos ventes, votre livraison ou tout ce qui concerne la plateforme.' },

                // ===================== COMPTE — LOT 2 =====================
                { id: 'kb016', cat: 'compte', kw: ['kyc', 'identité', 'vérification', 'document'], q: 'Qu\'est-ce que la vérification KYC ?', a: 'C\'est la vérification d\'identité (pièce d\'identité + justificatif de domicile) demandée aux vendeurs et livreurs pour sécuriser la plateforme et débloquer le badge "Vérifié".' },
                { id: 'kb017', cat: 'compte', kw: ['notifications', 'désactiver', 'paramètres'], q: 'Comment gérer mes notifications ?', a: 'Depuis Paramètres > Notifications, activez ou désactivez les alertes par email, SMS ou notification interne selon vos préférences.' },
                { id: 'kb018', cat: 'compte', kw: ['thème', 'sombre', 'clair', 'mode'], q: 'Comment activer le mode sombre ?', a: 'Depuis Paramètres, basculez entre thème clair et sombre — l\'en-tête garde toujours son identité visuelle, seul le contenu change.' },
                { id: 'kb019', cat: 'compte', kw: ['date', 'naissance', 'modifier'], q: 'Puis-je modifier ma date de naissance ?', a: 'Non, ce champ est verrouillé définitivement après la première saisie pour des raisons de sécurité et de conformité.' },

            // =========================================================
            // 2. MOTEUR DE CORRESPONDANCE (Matcher) — 100% local
            // =========================================================
            const STOP_WORDS = new Set([
                'le', 'la', 'les', 'un', 'une', 'des', 'de', 'du', 'et', 'ou', 'a', 'au',
                'aux', 'ce', 'ces', 'cet', 'cette', 'je', 'tu', 'il', 'elle', 'nous',
                'vous', 'ils', 'elles', 'mon', 'ma', 'mes', 'ton', 'ta', 'tes', 'son',
                'sa', 'ses', 'pour', 'par', 'sur', 'dans', 'avec', 'sans', 'est', 'sont',
                'suis', 'es', 'sommes', 'etes', 'que', 'qui', 'quoi', 'comment', 'pourquoi',
                'quand', 'ou', 'est-ce', 'svp', 'sil', 'plait',
            ]);

            function normalize(str) {
                return String(str || '')
                    .toLowerCase()
                    .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
                    .replace(/[^a-z0-9\s]/g, ' ')
                    .replace(/\s+/g, ' ')
                    .trim();
            }

            function significantWords(str) {
                return normalize(str).split(' ').filter(w => w.length > 1 && !STOP_WORDS.has(w));
            }

            function scoreEntry(entry, queryWords, queryNormalized) {
                let score = 0;
                for (const kw of entry.kw) {
                    if (queryNormalized.includes(normalize(kw))) score += 2;
                }
                const qWords = significantWords(entry.q);
                for (const w of queryWords) {
                    if (qWords.includes(w)) score += 1;
                }
                return score;
            }

            function findBestMatch(query) {
                const queryNormalized = normalize(query);
                const queryWords = significantWords(query);
                if (!queryWords.length) return null;

                let best = null;
                let bestScore = 0;
                for (const entry of KNOWLEDGE_BASE) {
                    const score = scoreEntry(entry, queryWords, queryNormalized);
                    if (score > bestScore) {
                        bestScore = score;
                        best = entry;
                    }
                }
                return bestScore >= 2 ? { entry: best, score: bestScore } : null;
            }

            function findRelatedEntries(query, limit = 3, excludeId = null) {
                const queryNormalized = normalize(query);
                const queryWords = significantWords(query);
                return KNOWLEDGE_BASE
                    .filter(e => e.id !== excludeId)
                    .map(entry => ({ entry, score: scoreEntry(entry, queryWords, queryNormalized) }))
                    .filter(r => r.score > 0)
                    .sort((a, b) => b.score - a.score)
                    .slice(0, limit);
            }

            // =========================================================
            // 3. DÉTECTION DE LANGUE
            // =========================================================
            function detectLanguage(text) {
                const patterns = {
                    fr: /[êéèëïîçàùôûœæ]/i,
                    en: /\b(the|and|for|with|you|this|that|from|have|are|was|your|can|will|would|could|should|may|might)\b/i,
                    es: /\b(el|la|los|las|un|una|y|en|por|para|con|sin|sobre|entre|como|cuando|donde|quien|que|del|al|si|no)\b/i,
                    ar: /[\u0600-\u06FF]/,
                    de: /\b(der|die|das|und|mit|auf|für|von|bei|nach|aus|durch|über|unter|zwischen|aber|den|dem|zu|ist|ein|eine)\b/i,
                    it: /\b(il|lo|la|i|gli|le|un|uno|una|per|con|su|tra|fra|che|chi|dove|quando|come|si|no|del|dello)\b/i,
                    pt: /\b(o|a|os|as|um|uma|para|com|sem|sobre|entre|como|quando|onde|quem|que|do|da)\b/i,
                };
                let bestLang = 'fr';
                let bestScore = 0;
                for (const [lang, pattern] of Object.entries(patterns)) {
                    const matches = (text.match(pattern) || []).length;
                    if (matches > bestScore) {
                        bestScore = matches;
                        bestLang = lang;
                    }
                }
                if (/[\u0600-\u06FF]/.test(text)) return 'ar';
                return bestLang;
            }

            // =========================================================
            // 4. ANALYSE DE SENTIMENT
            // =========================================================
            function analyzeSentiment(text) {
                const positive = ['bon', 'bien', 'excellent', 'super', 'génial', 'parfait', 'top', 'satisfait', 'content', 'merci', 'rapide', 'recommande', 'parfait'];
                const negative = ['mauvais', 'nul', 'déçu', 'lent', 'problème', 'cassé', 'arnaque', 'horrible', 'jamais', 'annuler', 'remboursement', 'insatisfait'];
                const lower = text.toLowerCase();
                let score = 0;
                positive.forEach(w => { if (lower.includes(w)) score += 1; });
                negative.forEach(w => { if (lower.includes(w)) score -= 1; });
                if (score > 0) return { sentiment: 'positive', score };
                if (score < 0) return { sentiment: 'negative', score };
                return { sentiment: 'neutral', score: 0 };
            }

            // =========================================================
            // 5. API HELPER — Connexion au backend
            // =========================================================
            function getToken() {
                return localStorage.getItem('sineToken');
            }

            function getHeaders() {
                const headers = { 'Content-Type': 'application/json' };
                const token = getToken();
                if (token) headers['Authorization'] = 'Bearer ' + token;
                return headers;
            }

            async function apiCall(endpoint, method = 'GET', body = null) {
                const url = API_BASE + endpoint;
                const options = {
                    method,
                    headers: getHeaders(),
                };
                if (body) {
                    options.body = JSON.stringify(body);
                }
                const response = await fetch(url, options);
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || 'Erreur serveur');
                }
                return data;
            }

            // =========================================================
            // 6. GESTION DE LA MÉMOIRE (backend + localStorage)
            // =========================================================
            function loadMemoryLocal() {
                try {
                    const data = localStorage.getItem('sine_ai_memory');
                    return data ? JSON.parse(data) : { memories: [], interactions: 0, firstSeen: new Date().toISOString() };
                } catch { return { memories: [], interactions: 0, firstSeen: new Date().toISOString() }; }
            }

            function saveMemoryLocal(memory) {
                localStorage.setItem('sine_ai_memory', JSON.stringify(memory));
            }

            function updateMemoryUI() {
                const memory = loadMemoryLocal();
                document.getElementById('memoryTopics').textContent = memory.memories.length + ' sujets appris';
                if (memory.memories.length > 0) {
                    const topics = memory.memories.map(m => m.topic).join(', ');
                    document.getElementById('memoryText').textContent = '🧠 Je me souviens de ' + memory.memories.length + ' sujets : ' + topics.slice(0, 60) + (topics.length > 60 ? '…' : '');
                } else {
                    document.getElementById('memoryText').textContent = '🧠 Assistant connecté au backend';
                }
                document.getElementById('contextMemoryCount').textContent = '🧠 ' + memory.memories.length;
            }

            // 7. CHARGEMENT DES DONNÉES UTILISATEUR
            // =========================================================
            async function loadUserData() {
                try {
                    const userData = JSON.parse(localStorage.getItem('sineUser'));
                    if (userData) {
                        currentUser = userData;
                        document.getElementById('headerName').textContent = userData.firstName || 'Utilisateur';

                    }
