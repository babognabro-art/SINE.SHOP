<!DOCTYPE html>
<html lang="fr" data-theme="light">
<head></head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <meta name="theme-color" content="#87CEEB">
    <title>Vêtements • SINE.SHOP</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Cormorant+Garamond:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="stylesheet" href="../css/shared-header.css">

    <style>
        /* =========================================================
           RESET & BASE - STYLE VÊTEMENTS (violet/moderne)
           ========================================================= */
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: "Outfit", -apple-system, BlinkMacSystemFont, sans-serif;
            background: #f8f5ff;
            color: #1a2a3a;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }
        a { text-decoration: none; color: inherit; }
        button { cursor: pointer; font-family: inherit; border: none; background: none; touch-action: manipulation; }
        img { max-width: 100%; height: auto; display: block; }

        :root {
            --bg-body: #f8f5ff;
            --bg-card: rgba(255,255,255,0.95);
            --bg-header: rgba(135,206,235,0.95);
            --text-primary: #1a1a2e;
            --text-secondary: #5a4a7a;
            --text-muted: #9a8ab0;
            --border-color: rgba(139,92,246,0.15);
            --accent: #8b5cf6;
            --accent-hover: #a78bfa;
            --shadow: 0 8px 30px rgba(139,92,246,0.10);
            --radius: 16px;
            --transition: 0.3s ease;
            --success: #22c55e;
            --warning: #f59e0b;
            --danger: #ef4444;
        }
        [data-theme="dark"] {
            --bg-body: #140f1a;
            --bg-card: rgba(30,20,40,0.95);
            --bg-header: rgba(15,23,42,0.95);
            --text-primary: #e8e0f0;
            --text-secondary: #b0a0c0;
            --text-muted: #7a6a8a;
            --border-color: rgba(255,255,255,0.06);
            --shadow: 0 8px 30px rgba(0,0,0,0.3);
        }

        /* HEADER (identique) */
        .main-header {
            background: linear-gradient(135deg, #87CEEB 0%, #4FC3F7 50%, #29B6F6 100%);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            padding: 12px 30px;
            border-bottom: 2px solid rgba(255,255,255,0.2);
            position: sticky;
            top: 0;
            z-index: 1000;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
            box-shadow: 0 4px 30px rgba(135,206,235,0.3);
            min-height: 70px;
        }
        .main-header .logo-left { display: flex; align-items: center; gap: 12px; }
        .main-header .shop-title {
            font-family: "Cormorant Garamond", serif;
            font-size: 1.8rem; font-weight: 700; color: #0a2a44;
            text-shadow: 0 2px 4px rgba(255,255,255,0.3); letter-spacing: 2px;
        }
        .main-header .shop-title span { color: #fff; }
        .main-header .header-logo {
            height: 45px; width: 45px; object-fit: contain; border-radius: 50%;
            background: rgba(255,255,255,0.2); padding: 4px;
        }
        .main-header .navbar {
            display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
        }
        .main-header .navbar a {
            padding: 6px 14px; border-radius: 30px; color: #0a2a44; font-weight: 600;
            font-size: 0.9rem; transition: var(--transition);
            background: rgba(255,255,255,0.15); backdrop-filter: blur(4px);
            border: 1px solid rgba(255,255,255,0.2);
            display: flex; align-items: center; gap: 6px;
        }
        .main-header .navbar a:hover {
            background: rgba(255,255,255,0.35); transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .main-header .navbar .badge {
            background: #ef4444; color: white; font-size: 0.6rem; padding: 1px 6px;
            border-radius: 30px; font-weight: 700; min-width: 18px; text-align: center;
        }
        .main-header .navbar .user-profile {
            display: flex; align-items: center; gap: 8px; padding: 4px 12px 4px 4px;
            border-radius: 30px; background: rgba(255,255,255,0.2);
            border: 1px solid rgba(255,255,255,0.3); cursor: pointer;
            transition: var(--transition); backdrop-filter: blur(4px);
        }
        .main-header .navbar .user-profile:hover { background: rgba(255,255,255,0.35); }
        .main-header .navbar .user-profile .avatar {
            width: 34px; height: 34px; border-radius: 50%; object-fit: cover;
            background: rgba(255,255,255,0.3); display: flex; align-items: center;
            justify-content: center; font-weight: 700; color: #0a2a44; font-size: 0.9rem;
        }
        .main-header .navbar .user-profile .user-name {
            font-size: 0.85rem; font-weight: 600; color: #0a2a44;
        }
        .theme-toggle {
            display: flex; gap: 2px; background: rgba(255,255,255,0.2);
            border-radius: 30px; padding: 3px; border: 1px solid rgba(255,255,255,0.2);
        }
        .theme-toggle button {
            padding: 4px 10px; border-radius: 30px; font-size: 0.8rem;
            color: #0a2a44; border: none; background: transparent;
            transition: var(--transition); font-weight: 600;
        }
        .theme-toggle button.active { background: rgba(255,255,255,0.4); color: #0a2a44; }

        /* Notification stock */
        .stock-notification {
            display: flex; align-items: center; gap: 16px;
            background: rgba(255,255,255,0.95); backdrop-filter: blur(12px);
            padding: 14px 24px; border-radius: var(--radius);
            border: 1px solid var(--border-color); box-shadow: var(--shadow);
            max-width: 800px; margin: 16px auto 0; position: relative;
            animation: slideDown 0.5s ease;
        }
        @keyframes slideDown {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .stock-notification .notif-icon { font-size: 1.6rem; flex-shrink: 0; }
        .stock-notification .notif-text { flex: 1; }
        .stock-notification .notif-text strong {
            display: block; color: #0a2a44; font-size: 0.95rem;
        }
        .stock-notification .notif-text p {
            color: var(--text-secondary); font-size: 0.85rem;
            margin-top: 2px; line-height: 1.5;
        }
        .stock-notification .close-notif {
            font-size: 1.2rem; color: var(--text-muted); padding: 4px 8px;
            transition: 0.3s; flex-shrink: 0;
        }
        .stock-notification .close-notif:hover { color: #0a2a44; transform: rotate(90deg); }

        .back-link {
            display: inline-block; margin: 14px 30px 8px;
            color: var(--accent); font-weight: 600; font-size: 0.95rem;
            transition: var(--transition);
        }
        .back-link:hover { color: #6d28d9; transform: translateX(-4px); }

        .section-header {
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 30px; margin-bottom: 20px; flex-wrap: wrap; gap: 12px;
        }
        .section-header h2 {
            font-family: "Cormorant Garamond", serif; font-size: 2rem; color: #5b21b6;
        }
        .section-header .btn-category {
            padding: 8px 24px; border-radius: 30px;
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white; font-weight: 600; font-size: 0.85rem;
            transition: var(--transition); border: 1px solid rgba(255,255,255,0.2);
        }
        .section-header .btn-category:hover {
            transform: translateY(-2px); box-shadow: 0 8px 25px rgba(139,92,246,0.3);
        }

        /* GRILLE */
        .products-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 24px;
            padding: 0 30px 40px;
            max-width: 1400px;
            margin: 0 auto;
        }
        @media (max-width: 768px) {
            .products-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; padding: 0 16px 30px; }
        }
        @media (max-width: 480px) {
            .products-grid { grid-template-columns: 1fr 1fr; gap: 12px; padding: 0 12px 24px; }
        }
        @media (max-width: 360px) {
            .products-grid { grid-template-columns: 1fr; }
        }

        /* CARTE PRODUIT - style Vêtements (bordures fines, ombre légère) */
        .product {
            background: var(--bg-card);
            border-radius: 16px;
            overflow: hidden;
            border: 1px solid var(--border-color);
            box-shadow: 0 2px 12px rgba(139,92,246,0.05);
            transition: var(--transition);
            display: flex;
            flex-direction: column;
            position: relative;
            padding: 14px;
            backdrop-filter: blur(8px);
        }
        .product:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 40px rgba(139,92,246,0.12);
            border-color: rgba(139,92,246,0.2);
        }

        .product .image-wrapper {
            width: 100%; aspect-ratio: 1/1; overflow: hidden;
            border-radius: 12px; background: #f5f0ff; position: relative; cursor: pointer;
        }
        .product .image-wrapper .media-scroll {
            display: flex; width: 100%; height: 100%; overflow-x: auto;
            scroll-snap-type: x mandatory; -webkit-overflow-scrolling: touch; scrollbar-width: none;
        }
        .product .image-wrapper .media-scroll::-webkit-scrollbar { display: none; }
        .product .image-wrapper .media-scroll img,
        .product .image-wrapper .media-scroll video {
            flex: 0 0 100%; width: 100%; height: 100%; object-fit: contain; background: #f5f0ff; padding: 4px; scroll-snap-align: start;
        }
        .product .image-wrapper .media-count {
            position: absolute; bottom: 8px; right: 8px; background: rgba(91,33,182,0.65); color: white;
            font-size: 0.62rem; font-weight: 700; padding: 2px 8px; border-radius: 20px; pointer-events: none; z-index: 5;
        }

        .product .favori {
            position: absolute; top: 10px; right: 10px; font-size: 1.4rem;
            color: var(--text-muted); transition: var(--transition);
            background: rgba(255,255,255,0.9); backdrop-filter: blur(8px);
            width: 38px; height: 38px; border-radius: 50%; display: flex;
            align-items: center; justify-content: center;
            border: 1px solid var(--border-color); z-index: 10; font-size: 1.2rem;
        }
        .product .favori.active { color: #8b5cf6; background: #f5f0ff; }
        .product .favori:hover { transform: scale(1.1); }
        .product .btn-share-icon {
            position: absolute;
            top: 10px;
            left: 10px;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            background: rgba(255,255,255,0.9);
            backdrop-filter: blur(8px);
            display: flex;
            align-items: center;
            justify-content: center;
            border: 1px solid var(--border-color);
            z-index: 10;
            font-size: 0.9rem;
            color: var(--text-muted);
            transition: var(--transition);
        }
        .product .btn-share-icon:hover { transform: scale(1.1); color: #8b5cf6; }

        .product .product-badges {
            position: absolute; top: 10px; left: 10px;
            display: flex; flex-direction: column; gap: 4px; z-index: 10;
        }
        .product .product-badges .badge {
            padding: 2px 10px; border-radius: 20px; font-size: 0.6rem;
            font-weight: 700; text-transform: uppercase; backdrop-filter: blur(4px);
        }
        .badge-promo { background: var(--danger); color: white; }
        .badge-stock { background: var(--warning); color: white; }
        .badge-new { background: var(--success); color: white; }

        .product h3 {
            font-size: 1rem; font-weight: 600; color: var(--text-primary);
            margin: 10px 0 4px; line-height: 1.3; cursor: pointer;
        }
        .product h3:hover { color: var(--accent); }

        .product .product-meta {
            font-size: 0.78rem; color: var(--text-secondary); margin-bottom: 4px;
        }
        .product .product-meta span { margin-right: 10px; }

        .product .price {
            font-size: 1.15rem; font-weight: 700; color: var(--accent);
            margin: 4px 0 8px;
        }
        .product .price .old-price {
            font-size: 0.85rem; color: var(--text-muted); text-decoration: line-through;
            font-weight: 500; margin-right: 8px;
        }
        .product .price .new-price { color: var(--accent); }

        .product .stock-indicator {
            font-size: 0.7rem; font-weight: 600; padding: 2px 10px;
            border-radius: 30px; display: inline-block; margin-bottom: 8px; width: fit-content;
        }
        .product .stock-indicator.in-stock { background: #dcfce7; color: #16a34a; }
        .product .stock-indicator.out-of-stock { background: #fee2e2; color: #991b1b; }

        .product .vendor-info {
            display: flex; align-items: center; gap: 8px; padding: 6px 0;
            border-top: 1px solid var(--border-color); margin-top: 4px; cursor: pointer;
        }
        .product .vendor-info:hover { opacity: 0.8; }
        .product .vendor-info img {
            width: 28px; height: 28px; border-radius: 50%; object-fit: cover;
            border: 1px solid var(--border-color);
        }
        .product .vendor-info .vendor-name {
            font-size: 0.75rem; font-weight: 500; color: var(--text-secondary);
        }
        .product .vendor-info .vendor-rating {
            font-size: 0.7rem; color: #f59e0b; margin-left: auto;
        }

        .product .product-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 6px;
            margin-top: 8px;
        }
        .product .product-actions button {
            padding: 8px 6px; border-radius: 10px; font-size: 0.7rem;
            font-weight: 600; transition: var(--transition); text-align: center;
            display: flex; align-items: center; justify-content: center; gap: 4px;
        }
        .product .product-actions .btn-cart {
            background: linear-gradient(135deg, #8b5cf6, #6d28d9);
            color: white; grid-column: span 2;
        }
        .product .product-actions .btn-cart:hover {
            transform: translateY(-2px); box-shadow: 0 8px 20px rgba(139,92,246,0.3);
        }
        .product .product-actions .btn-reserve {
            background: rgba(245,158,11,0.15); color: #d97706;
        }
        .product .product-actions .btn-reserve:hover { background: rgba(245,158,11,0.25); }
        .product .product-actions .btn-preview {
            background: rgba(139,92,246,0.08); color: var(--accent);
        }
        .product .product-actions .btn-preview:hover { background: rgba(139,92,246,0.16); }
        .product .product-actions .btn-compare {
            background: rgba(59,130,246,0.08); color: #3b82f6; font-size: 0.65rem;
        }
        .product .product-actions .btn-compare:hover { background: rgba(59,130,246,0.16); }
        .product .product-actions .btn-compare.active { background: #3b82f6; color: white; }
        .product .product-actions .btn-review {
            background: rgba(139,92,246,0.08); color: #8b5cf6; font-size: 0.65rem;
        }
        .product .product-actions .btn-review:hover { background: rgba(139,92,246,0.16); }

        .empty-state {
            grid-column: 1 / -1; text-align: center; padding: 60px 20px;
            color: var(--text-secondary);
        }
        .empty-state .icon { font-size: 4rem; display: block; margin-bottom: 16px; opacity: 0.5; }
        .empty-state h3 { font-size: 1.4rem; color: var(--text-primary); margin-bottom: 8px; }

        #notificationToast {
            position: fixed; bottom: 30px; right: 30px;
            padding: 14px 24px; border-radius: 14px;
            background: var(--bg-card); color: var(--text-primary);
            border: 1px solid var(--border-color);
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            z-index: 99999; font-weight: 600; font-size: 0.9rem;
            opacity: 0; transform: translateY(20px) scale(0.95);
            transition: 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
            pointer-events: none; max-width: 400px; backdrop-filter: blur(12px);
        }
        #notificationToast.show { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }
        #notificationToast.success { border-left: 4px solid var(--success); }
        #notificationToast.error { border-left: 4px solid var(--danger); }
        #notificationToast.warning { border-left: 4px solid var(--warning); }

        .footer {
            text-align: center; padding: 30px 20px;
            background: rgba(10,42,68,0.95); color: rgba(255,255,255,0.5);
            font-size: 0.85rem; margin-top: 20px;
            border-top: 1px solid rgba(255,255,255,0.06);
        }

        .modal-overlay {
            display: none; position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(8px);
            z-index: 9998; align-items: center; justify-content: center; padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-overlay .modal-content {
            background: var(--bg-card); border-radius: var(--radius);
            max-width: 700px; width: 100%; max-height: 90vh; overflow-y: auto;
            padding: 24px; border: 1px solid var(--border-color);
            box-shadow: 0 20px 60px rgba(0,0,0,0.2);
        }
        .modal-overlay .modal-close {
            float: right; font-size: 1.4rem; color: var(--text-secondary);
            cursor: pointer; transition: var(--transition);
        }
        .modal-overlay .modal-close:hover { color: var(--text-primary); }

        @media (max-width: 600px) {
            .main-header { padding: 10px 16px; flex-direction: column; align-items: stretch; gap: 8px; }
            .main-header .navbar { justify-content: center; flex-wrap: wrap; }
            .main-header .shop-title { font-size: 1.4rem; }
            .section-header { padding: 0 16px; flex-direction: column; align-items: flex-start; }
            .section-header h2 { font-size: 1.4rem; }
            .stock-notification { margin: 12px 16px 0; padding: 12px 16px; flex-wrap: wrap; }
            .back-link { margin: 12px 16px 6px; font-size: 0.85rem; }
            .product .product-actions { grid-template-columns: 1fr 1fr; }
            .product .product-actions .btn-cart { grid-column: span 2; }
        }
        @media (max-width: 400px) {
            .products-grid { grid-template-columns: 1fr 1fr; gap: 10px; padding: 0 8px 20px; }
            .product { padding: 10px; }
            .product h3 { font-size: 0.85rem; }
            .product .price { font-size: 1rem; }
            .product .product-actions button { font-size: 0.6rem; padding: 5px 3px; }
            .main-header .navbar a { font-size: 0.7rem; padding: 4px 8px; }
        }
    </style>
</head>

<body>

    <!-- HEADER -->
    <header class="main-header sine-header-bg">
        <div class="sine-header-stars">
            <span style="top:15%;left:10%;"></span>
            <span style="top:30%;left:25%;animation-delay:0.5s;"></span>
            <span style="top:20%;left:45%;animation-delay:1s;"></span>
            <span style="top:60%;left:15%;animation-delay:0.3s;"></span>
            <span style="top:70%;left:35%;animation-delay:1.5s;"></span>
            <span style="top:25%;left:65%;animation-delay:0.8s;"></span>
            <span style="top:55%;left:75%;animation-delay:1.2s;"></span>
            <span style="top:40%;left:88%;animation-delay:0.4s;"></span>
        </div>
        <div class="logo-left">
            <img src="../images/logo.png.png" alt="Logo" class="header-logo" onerror="this.src='../images/logo.png'">
            <h1 class="shop-title"><span style="color:black;">SINE.</span><span style="color:blue;">SH</span><span class="sine-heart"
            style="color:red;">♡</span><span style="color:black;">P</span></h1>
        </div>
        <nav class="navbar">
            <a href="../html/panier.html" class="cart-link">
                🛒 <span class="badge" id="cartBadge">0</span>
            </a>
            <a href="../html/favoris.html" title="Favoris">❤️ <span class="badge" id="favBadge">0</span></a>
            <a href="../html/collections.html">📦</a>
            <div class="theme-toggle" id="themeToggle">
                <button data-theme="light" class="active"><i class="fa-regular fa-sun"></i></button>
                <button data-theme="dark"><i class="fa-regular fa-moon"></i></button>
            </div>
            <div class="user-profile" id="userProfile">
                <span class="avatar" id="profileAvatar">👤</span>
                <span class="user-name" id="userName">Invité</span>
            </div>
        </nav>
    </header>

    <!-- NOTIFICATION STOCK -->
    <div id="stockNotification" class="stock-notification">
        <span class="notif-icon">⚠️</span>
        <div class="notif-text">
            <strong id="stockTitle">Information importante</strong>
            <p id="stockMessage">Certains produits peuvent être temporairement en rupture de stock. Veuillez réserver à l'avance avant de passer commande.</p>
        </div>
        <button class="close-notif" onclick="fermerNotification()">✕</button>
    </div>

    <a href="../html/collections.html" class="back-link" id="backLink">← Retour à la collection</a>

    <!-- SECTION VÊTEMENTS -->
    <section id="liste-vetements">
        <div class="section-header">
            <h2>👕 Vêtements</h2>
            <span class="btn-category">Collection 2026</span>
        </div>

        <div class="products-grid" id="vetementsGrid">
            <!-- Généré dynamiquement -->
        </div>
    </section>

    <!-- MODAL APERÇU -->
    <div id="previewModal" class="modal-overlay">
        <div class="modal-content">
            <span class="modal-close" onclick="fermerPreview()">✕</span>
            <div id="previewContent"></div>
        </div>
    </div>

    <div id="notificationToast"></div>

    <footer class="footer">
        <p>© 2026 SINE.SHOP - Tous droits réservés</p>
    </footer>

    <script src="../js/config.js"></script>
    <script src="../js/api.js"></script>
    <script src="../js/comparison-widget.js"></script>
    <script src="../js/share-widget.js"></script>
    <script src="../js/produits.js"></script>
    <script>
        (function() {
            'use strict';

            // Cloisonnement des rôles — page publique (invités autorisés),
            // mais un vendeur/livreur/affilié/admin DÉJÀ connecté ne doit
            // jamais s'y retrouver depuis son espace compte : redirection
            // immédiate vers son propre espace, sans bloquer les visiteurs
            // anonymes ni les clients.
            (function redirigerSiRoleNonClient() {
                try {
                    const u = JSON.parse(localStorage.getItem('sineUser') || 'null');
                    if (!u || u.role === 'client') return;
                    const pages = {
                        seller: '../html/vendeur.html',
                        livreur: '../html/livreur.html',
                        affiliate: '../html/sineshopaffiliation.html',

            function getTraduction() { return TRADUCTIONS[langue] || TRADUCTIONS.fr; }
            function traduire(key) { return getTraduction()[key] || key; }

            /* === THEME === */
            function setTheme(theme) {
                const effective = theme === 'system' ? getSystemTheme() : theme;
                document.documentElement.setAttribute('data-theme', effective);
                localStorage.setItem(STORAGE_KEYS.theme, theme);
                document.querySelectorAll('#themeToggle button').forEach(btn => {
                    btn.classList.toggle('active', btn.dataset.theme === theme);
                });
            }
            function getSystemTheme() {
                return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
            }

            /* === DEVISE === */
            function getDevise() {
                try {
                    const user = JSON.parse(localStorage.getItem(STORAGE_KEYS.user) || '{}');
                    return user.preferredCurrency || 'XOF';
                } catch { return 'XOF'; }
            }
            function getDeviseSymbole(dev) {
                const symboles = { 'FCFA': 'FCFA', 'EUR': '€', 'USD': '$', 'GBP': '£', 'CAD': 'CA$', 'MAD': 'MAD' };
                return symboles[dev] || dev;
            }
            function formatPrix(montant, deviseUtil = null) {
                const d = deviseUtil || getDevise();
                const symbole = getDeviseSymbole(d);
                return montant.toLocaleString('fr-FR') + ' ' + symbole;
            }

            /* === CHARGEMENT DES PRODUITS === */
            async function chargerProduits() {
                if (window.SINE && window.SineAPI) {
                    await window.SINE.initialiserMoteur();
                    const tous = window.SINE.getProduitsVisibles();
                    produits = tous.filter(p => (p.category?.slug || '') === 'vetements' || (p.category?.name || '').toLowerCase().includes('vêtement') || (p.category?.name || '').toLowerCase().includes('vetement'));
                    favoris = window.SINE.favoris || [];
                    panier = window.SINE.panier;
                } else {
                    produits = [];
                    favoris = [];
                    panier = null;
                }

                try {
                    utilisateur = JSON.parse(localStorage.getItem(STORAGE_KEYS.user) || 'null');
                } catch { utilisateur = null; }

                if (utilisateur && window.SineAPI) {
                    try {
                        const data = await window.SineAPI.getComparison();
                        comparaisonIds = (data || []).map(p => p._id);
                    } catch (e) { comparaisonIds = []; }
                }

                try {
                    langue = localStorage.getItem(STORAGE_KEYS.langue) || 'fr';
                } catch { langue = 'fr'; }
                document.documentElement.dir = (langue === 'ar') ? 'rtl' : 'ltr';
                document.documentElement.lang = langue;

                devise = getDevise();
                mettreAJourCompteurs();
                mettreAJourProfil();
                afficherProduits();
                if (window.ComparisonWidget) window.ComparisonWidget.init();
            }

            function afficherProduits() {
                if (!grid) return;
                const t = getTraduction();

                if (produits.length === 0) {
                    grid.innerHTML = `
                        <div class="empty-state">
                            <span class="icon">👕</span>
                            <h3>${t.noProducts}</h3>
                            <p>${t.noProductsDesc}</p>
                        </div>
                    `;
                    return;
                }

                grid.innerHTML = produits.map(p => {
                    const id = p._id;
                    const estFavori = favoris.some(f => (f.product?._id || f.product) === id);
                    const estDispo = (p.stock || 0) > 0;
                    const enPromo = p.discountedPrice && p.discountedPrice < p.price;
                    const prixAffiche = enPromo ? p.discountedPrice : (p.price || 0);
                    const ancienPrixAffiche = p.price || 0;
                    const images = p.images?.length > 0 ? p.images.map(img => img.url) : ['../images/produit.png'];
                    const videos = (p.videos || []).map(v => v.url);
                    const tousMedias = [...images, ...videos];
                    const vendeur = p.seller?.storeName || `${p.seller?.firstName || ''} ${p.seller?.lastName || ''}`.trim() || 'Vendeur';
                    const vendeurPhoto = p.seller?.profilePicture || '../images/profil.png';
                    const vendeurNote = p.rating || 0;

                    let mediaHtml = images.map(img =>
                        `<img src="${img}" alt="${p.name || 'Produit'}" loading="lazy" onerror="this.src='../images/produit.png'">`
                    ).join('');
                    mediaHtml += videos.map(v => `<video src="${v}" muted preload="metadata" playsinline loop onerror="this.closest('.media-scroll')?.classList.add('has-broken-media');this.style.display='none'" class="media-video"></video>`).join('');
                    const enComparaison = comparaisonIds.includes(id);

                    return `
                        <div class="product" data-id="${id}">
                            <div class="image-wrapper" onclick="apercuProduit('${id}')">
                                <div class="media-scroll">${mediaHtml}</div>
                                ${tousMedias.length > 1 ? `<span class="media-count">📷 ${tousMedias.length}</span>` : ''}
                                <span class="favori ${estFavori ? 'active' : ''}" onclick="event.stopPropagation();toggleFavori('${id}')">
                                    ${estFavori ? '❤️' : '♡'}
                                </span>
                                <span class="btn-share-icon" onclick="event.stopPropagation();window.shareProduct('${id}', this)" title="Partager"><i class="fa-solid fa-share-nodes"></i></span>
                                <div class="product-badges">
                                    ${enPromo ? '<span class="badge badge-promo">🔥 Promo</span>' : ''}
                                    ${!estDispo ? '<span class="badge badge-stock">Rupture</span>' : ''}
                                </div>
                            </div>

                            <h3 onclick="apercuProduit('${id}')">${p.name || 'Produit'}</h3>

                            <div class="product-meta">
                                ${p.category?.name ? `<span>📂 ${p.category.name}</span>` : ''}
                            </div>

                            <div class="price">
                                ${enPromo ? `<span class="old-price">${formatPrix(ancienPrixAffiche)}</span>` : ''}
                                <span class="new-price">${formatPrix(prixAffiche)}</span>
                                ${enPromo ? `<span style="font-size:0.7rem;color:var(--success);font-weight:600;">-${Math.round((1 - prixAffiche/ancienPrixAffiche) * 100)}%</span>` : ''}
                            </div>

                            <div class="stock-indicator ${estDispo ? 'in-stock' : 'out-of-stock'}">
                                ${estDispo ? t.inStock : t.outOfStock}
                                ${estDispo && p.stock ? ` (${p.stock})` : ''}
                            </div>

                            <div class="vendor-info" onclick="voirVendeur('${p.seller?._id || ''}')">
                                <img src="${vendeurPhoto}" alt="${vendeur}" loading="lazy" onerror="this.src='../images/profil.png'">
                                <span class="vendor-name">${vendeur}</span>
                                ${vendeurNote > 0 ? `<span class="vendor-rating">⭐ ${vendeurNote.toFixed(1)}</span>` : ''}
                            </div>

                            <div class="product-actions">
                                <button class="btn-cart" onclick="ajouterAuPanier('${id}')">🛒 ${t.addToCart}</button>
                                <button class="btn-reserve" onclick="reserverProduit('${id}')">📅 ${t.reserve}</button>
                                <button class="btn-preview" onclick="apercuProduit('${id}')">👁 ${t.preview}</button>
                                <button class="btn-compare ${enComparaison ? 'active' : ''}" onclick="ajouterComparaison('${id}')">⚖ ${t.compare}</button>
                                <button class="btn-review" onclick="ouvrirAvis('${id}')">⭐ ${t.review}</button>
                            </div>
                        </div>
                    `;
                }).join('');
            }


            /* === FAVORIS === */
            window.toggleFavori = async function(id) {
                if (!utilisateur) {
                    window.location.href = '../html/login.html?redirect=vetements';
                    return;
                }
                try {
                    const estFavori = favoris.some(f => (f.product?._id || f.product) === id);
                    if (estFavori) {
                        await window.SineAPI.removeFavorite(id);
                        showNotification(traduire('removedFromFav'), 'warning');
                    } else {
                        await window.SineAPI.toggleFavorite(id);
                        showNotification(traduire('addedToFav'), 'success');
                    }
                    const data = await window.SineAPI.getFavorites();
                    favoris = Array.isArray(data) ? data : (data?.favorites || []);
                    mettreAJourCompteurs();
                    afficherProduits();
                } catch (error) {
                    showNotification(error.message || 'Erreur favoris.', 'error');
                }
            };

            /* === PANIER === */
            window.ajouterAuPanier = async function(id) {
                if (!utilisateur) {
                    window.location.href = '../html/login.html?redirect=vetements';
                    return;
                }
                try {
                    await window.SineAPI.addToCart(id, 1);
                    const data = await window.SineAPI.getCart();
                    panier = data.cart;
                    mettreAJourCompteurs();
                    showNotification(traduire('addedToCart'), 'success');
                } catch (error) {
                    showNotification(error.message || 'Erreur lors de l\'ajout au panier.', 'error');
                }
            };

            /* === RÉSERVATION === */
            window.reserverProduit = async function(id) {
                if (!utilisateur) {
                    showNotification(traduire('loginRequired'), 'warning');
                    if (confirm(traduire('loginNow') + ' ?')) {
                        window.location.href = '../html/login.html?redirect=' + encodeURIComponent(window.location.pathname);
                    }
                    return;
                }
                const produit = produits.find(p => p._id === id);
                if (!produit) {
                    showNotification(traduire('productNotFound'), 'error');
                    return;
                }
                if ((produit.stock || 0) <= 0) {
                    showNotification(traduire('stockError'), 'error');
                    return;
                }

                try {
                    const startDate = new Date();
                    const endDate = new Date(Date.now() + 7 * 24 * 60 * 60 * 1000);
                    const reservation = await window.SineAPI.createReservation({
                        // Le backend attend productId, pas product.
                        productId: id,
                        quantity: 1,
                        startDate: startDate.toISOString(),
                        endDate: endDate.toISOString(),
                        totalPrice: produit.discountedPrice || produit.price || 0,
                    });

                    showNotification(traduire('reservationDone'), 'success');
                    setTimeout(() => {
                        window.location.href = '../html/confirmation.html?id=' + reservation._id + '&type=reservation';
                    }, 1000);
                } catch (error) {
                    showNotification(error.message || 'Erreur lors de la réservation.', 'error');
                }
            };

            /* === APERÇU === */
            window.apercuProduit = function(id) {
                const produit = produits.find(p => p._id === id);
                if (!produit) {
                    showNotification(traduire('productNotFound'), 'error');
                    return;
                }

                const enPromo = produit.discountedPrice && produit.discountedPrice < produit.price;
                const prixAffiche = enPromo ? produit.discountedPrice : (produit.price || 0);
                const images = produit.images?.length > 0 ? produit.images.map(img => img.url) : ['../images/produit.png'];
                const videos = (produit.videos || []).map(v => v.url);
                const tousMedias = [...images, ...videos];

                let mediasHtml = tousMedias.map(m => {
                    const isVideo = m.endsWith('.mp4') || m.endsWith('.webm') || m.endsWith('.mov');
                    if (isVideo) {
                        return `<video src="${m}" controls style="width:100%;max-height:400px;border-radius:12px;object-fit:contain;" preload="metadata" playsinline></video>`;
                    }
                    return `<img src="${m}" alt="${produit.name}" style="width:100%;max-height:400px;border-radius:12px;object-fit:contain;" loading="lazy" onerror="this.src='../images/produit.png'">`;
                }).join('');

                const modal = document.getElementById('previewModal');
                const content = document.getElementById('previewContent');
                const estFavori = favoris.some(f => (f.product?._id || f.product) === id);

                content.innerHTML = `
                    <h2 style="margin-bottom:8px;">${produit.name || 'Produit'}</h2>
                    <div style="display:flex;flex-wrap:wrap;gap:12px;margin-bottom:12px;">
                        <span style="font-weight:700;color:var(--accent);font-size:1.2rem;">${formatPrix(prixAffiche)}</span>
                        ${enPromo ? `<span style="text-decoration:line-through;color:var(--text-muted);">${formatPrix(produit.price)}</span>` : ''}
                        ${produit.stock !== undefined ? `<span style="padding:2px 12px;border-radius:30px;background:${produit.stock > 0 ? '#dcfce7' : '#fee2e2'};color:${produit.stock > 0 ? '#16a34a' : '#991b1b'};font-size:0.8rem;font-weight:600;">${produit.stock > 0 ? '✅ En stock' : '❌ Rupture'}</span>` : ''}
                    </div>
                    <div style="display:flex;flex-direction:column;gap:8px;max-height:400px;overflow-y:auto;padding:8px 0;">
                        ${mediasHtml}
                    </div>
                    <p style="margin:12px 0;color:var(--text-secondary);line-height:1.6;">${produit.description || 'Aucune description disponible.'}</p>
                    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;">
                        <button style="padding:10px;border-radius:10px;background:var(--accent);color:white;font-weight:700;border:none;cursor:pointer;" onclick="ajouterAuPanier('${id}');fermerPreview();">🛒 Ajouter</button>
                        <button style="padding:10px;border-radius:10px;background:rgba(245,158,11,0.15);color:#d97706;font-weight:700;border:none;cursor:pointer;" onclick="reserverProduit('${id}');fermerPreview();">📅 Réserver</button>
                        <button style="padding:10px;border-radius:10px;background:rgba(0,0,0,0.04);color:var(--text-primary);font-weight:700;border:none;cursor:pointer;grid-column:span 2;" onclick="toggleFavori('${id}');fermerPreview();">${estFavori ? '❤️ Retirer des favoris' : '🤍 Ajouter aux favoris'}</button>
                    </div>
                `;

                modal.classList.add('active');
                document.body.style.overflow = 'hidden';
            };

            window.fermerPreview = function() {
                document.getElementById('previewModal').classList.remove('active');
                document.body.style.overflow = '';
            };

            document.getElementById('previewModal').addEventListener('click', function(e) {
                if (e.target === this) fermerPreview();
            });

            /* === COMPARAISON === */
            window.ajouterComparaison = async function(id) {
                // Synchronisé côté serveur (User.comparisonList) — plus jamais
                // en localStorage, le compte retrouve sa comparaison partout.
                if (!utilisateur) {
                    window.location.href = '../html/login.html?redirect=vetements';
                    return;
                }
                try {
                    const result = await window.SineAPI.toggleComparison(id);
                    comparaisonIds = (result.comparisonList || []).map(cid => cid.toString ? cid.toString() : cid);
                    showNotification(result.added ? traduire('compareAdded') : traduire('compareRemoved'), result.added ? 'success' : 'info');
                    afficherProduits();
                    if (window.ComparisonWidget) window.ComparisonWidget.refresh();
                } catch (error) {
                    showNotification(error.message || 'Erreur lors de la mise à jour de la comparaison.', 'error');
                }
            };

            /* === AVIS === */
            window.ouvrirAvis = async function(id) {
                if (!utilisateur) {
                    window.location.href = '../html/login.html?redirect=vetements';
                    return;
                }
                const produit = produits.find(p => p._id === id);
                if (!produit) {
                    showNotification(traduire('productNotFound'), 'error');
                    return;
                }
                const note = prompt(traduire('reviewPrompt'), '5');
                if (note === null) return;
                const numNote = parseInt(note);
                if (isNaN(numNote) || numNote < 1 || numNote > 5) {
                    showNotification(traduire('reviewInvalid'), 'warning');
                    return;
                }
                const commentaire = prompt(traduire('reviewComment'), '');

                try {
                    await window.SineAPI.addReview(id, numNote, commentaire || '');
                    showNotification(traduire('reviewDone'), 'success');
                } catch (error) {
                    showNotification(error.message || 'Erreur lors de l\'envoi de l\'avis.', 'error');
                }
            };

            /* === VOIR VENDEUR === */
            window.voirVendeur = function(vendeurId) {
                if (!vendeurId) {
                    showNotification('Informations du vendeur non disponibles', 'info');
                    return;
                }
                window.location.href = '../html/vendeur-profil.html?id=' + vendeurId;
            };

            function mettreAJourCompteurs() {
                const nbPanier = panier?.totalItems || (panier?.items || []).reduce((sum, item) => sum + (item.quantity || 1), 0);
                if (cartBadge) cartBadge.textContent = nbPanier;
                if (favBadge) favBadge.textContent = favoris.length;
            }

            /* === PROFIL === */
            function mettreAJourProfil() {
                if (utilisateur) {
                    const nom = utilisateur.firstName || utilisateur.lastName || 'Client';
                    userName.textContent = nom;
                    const initiales = nom.split(' ').map(n => n[0]).join('').toUpperCase().substring(0, 2);
                    profileAvatar.textContent = initiales || '👤';
                    profileAvatar.style.background = 'rgba(255,255,255,0.3)';
                } else {
                    userName.textContent = 'Invité';
                    profileAvatar.textContent = '👤';
                    profileAvatar.style.background = 'rgba(255,255,255,0.3)';
                }
            }

            /* === NOTIFICATION === */
            function showNotification(message, type) {
                const notif = document.getElementById('notificationToast');
                if (!notif) return;
                notif.textContent = message;
                notif.className = 'notification-toast show ' + (type || '');
                clearTimeout(notif._timeout);
                notif._timeout = setTimeout(() => notif.classList.remove('show'), 4000);
            }
            window.showNotification = showNotification;

            /* === FERMER NOTIFICATION STOCK === */
            window.fermerNotification = function() {
                const notification = document.getElementById('stockNotification');
                if (notification) notification.style.display = 'none';
            };

            /* === TRADUCTION ÉLÉMENTS STATIQUES === */
            function traduireElements() {
                const t = getTraduction();
                document.getElementById('stockTitle').textContent = t.stockTitle;
                document.getElementById('stockMessage').textContent = t.stockMessage;
                document.getElementById('backLink').textContent = t.backLink;
                document.querySelector('.section-header h2').textContent = '👕 ' + t.categoryTitle;
                document.querySelector('.section-header .btn-category').textContent = t.categorySub;
            }

            /* === THEME TOGGLE === */
            document.querySelectorAll('#themeToggle button').forEach(btn => {
                btn.addEventListener('click', function() {
                    setTheme(this.dataset.theme);
                });
            });

            /* === PROFIL CLICK === */
            userProfile.addEventListener('click', function() {
                if (utilisateur) {
                    window.location.href = '../html/client.html';
                } else {
                    window.location.href = '../html/login.html';
                }
            });

            /* === STORAGE SYNC === */
            window.addEventListener('storage', function(e) {
                if (e.key === STORAGE_KEYS.produits || e.key === STORAGE_KEYS.favoris || e.key === STORAGE_KEYS.panier) {
                    chargerProduits();
                }
                if (e.key === STORAGE_KEYS.langue) {
                    langue = e.newValue || 'fr';
                    document.documentElement.dir = (langue === 'ar') ? 'rtl' : 'ltr';
                    document.documentElement.lang = langue;
                    traduireElements();
                    chargerProduits();
                }
                if (e.key === STORAGE_KEYS.user) {
                    try { utilisateur = JSON.parse(e.newValue); } catch { utilisateur = null; }
                    mettreAJourProfil();
                    chargerProduits();
                }
            });

            /* === INITIALISATION === */
            if (window.SINE && window.SINE.initialiserMoteur) {
                window.SINE.initialiserMoteur().then(() => {
                    chargerProduits();
                });
            } else {
                setTimeout(chargerProduits, 300);
            }

            setInterval(() => {
                chargerProduits();
            }, 30000);

            console.log('✅ Page Vêtements SINE.SHOP chargée');
        })();
    </script>

</body>
</html>
